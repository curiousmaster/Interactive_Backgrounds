<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Viscous Flow · WebGL Backgrounds</title>
<style>
  :root { color-scheme:dark; font:14px/1.45 system-ui,sans-serif; color:#e5f5f7; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent; }
  #scene { display:block; width:100%; height:100%; touch-action:none; }
  #scene.rotating { cursor:grabbing; }
  #message { position:fixed; inset:0; display:grid; place-items:center; padding:2rem; text-align:center; }
  .settings-open,.settings-panel { position:fixed; top:max(14px,env(safe-area-inset-top)); right:max(14px,env(safe-area-inset-right)); z-index:1; }
  .settings-panel { width:min(345px,calc(100% - 28px)); max-height:calc(100dvh - 28px); overflow:auto; overscroll-behavior:contain;
    background:rgba(11,21,29,.94); border:1px solid #30444e; border-radius:17px; padding:15px; box-shadow:0 12px 45px #0007; }
  .settings-panel header,.settings-line,.settings-preset { display:flex; align-items:center; justify-content:space-between; gap:9px; }
  .settings-panel h1 { margin:2px 0 9px; font-size:21px; font-weight:650; letter-spacing:-.03em; }
  .settings-panel header small { color:#87c6c7; font-size:9px; font-weight:700; letter-spacing:.19em; }
  button,select,input[type=search],input[type=text],textarea { font:inherit; color:inherit; border:1px solid #34505b;
    border-radius:7px; background:#142631; padding:6px 8px; }
  button { cursor:pointer; }
  button:hover { background:#254450; }
  :focus-visible { outline:2px solid #8df4e7; outline-offset:2px; }
  input[type=search],textarea { width:100%; }
  textarea { margin-top:8px; resize:vertical; font:11px/1.4 ui-monospace,monospace; }
  input[type=range] { display:block; width:100%; margin:4px 0; accent-color:#75d9ca; }
  input[type=checkbox] { accent-color:#75d9ca; }
  input[type=color] { width:24px; height:24px; padding:0; border:0; background:transparent; cursor:pointer; }
  .settings-color,.settings-actions { display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
  .settings-color input[type=text] { font:11px ui-monospace,monospace; width:83px; }
  .settings-preset,.settings-actions,.settings-stats { margin-top:9px; }
  .settings-preset select { flex:1; }
  .settings-actions button { font-size:12px; }
  .settings-panel details { border-top:1px solid #30444e; margin-top:9px; }
  .settings-panel summary { padding:8px 0 1px; cursor:pointer; font-weight:650; }
  .settings-group { padding-top:4px; }
  .settings-group h2 { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:#94c7cb; margin:9px 0 1px; }
  .settings-row { padding:5px 0; }
  .settings-row small,.settings-status,.settings-stats { color:#a1b6c0; font-size:11px; }
  .settings-stats { display:block; font-variant-numeric:tabular-nums; }
  .settings-row output { color:#a6e6df; font-size:11px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .settings-status { margin:7px 0 0; }
</style>
</head>
<body>
<canvas id="scene" aria-label="Animated viscous liquid cascade"></canvas>
<div id="message" role="status" hidden></div>
<div id="editor"></div>
<script>
(() => {
  "use strict";

  // Edit these values to configure the background without the settings editor.
  const settings = {
    "editor": {
      "enabled": true
    },
    "view": {
      "mode": "3d",
      "perspective": true,
      "yaw": 8,
      "tilt": 16,
      "zoom": 0.8599976487362043,
      "orbit": true,
      "orbitSpeed": 8
    },
    "flow": {
      "gravity": 10,
      "viscosity": 0.24,
      "tension": 0.5,
      "rebound": 0.25,
      "adhesion": 0.15,
      "rate": 180,
      "nozzle": 0.2,
      "nozzleX": 0.8,
      "depth": 1,
      "speed": 1,
      "sway": true,
      "swayWidth": 2.75,
      "swaySpeed": 0.3
    },
    "scene": {
      "obstacles": true,
      "layout": "cascade",
      "obstacleCount": 12,
      "obstacleType": "capsule",
      "obstacleMotion": true,
      "motionDistance": 0.45,
      "motionSpeed": 1,
      "motionTurn": 12,
      "motionSeed": 7,
      "motionPath": "wander",
      "motionPhase": 57,
      "basin": false,
      "retention": 2.8,
      "showSolids": true,
      "solid": "#243F4A",
      "background": "#07131E",
      "backdrop": true,
      "grid": true
    },
    "liquid": {
      "style": "surface",
      "body": "#584CAE",
      "edge": "#1E1849",
      "highlight": "#FFFFFF",
      "opacity": 0.68,
      "thickness": 1.01,
      "detail": 2,
      "bloom": false,
      "glow": 1.02,
      "impact": true,
      "impactLight": 1.5
    },
    "interaction": {
      "enabled": true,
      "radius": 1,
      "bounce": 0.05,
      "show": true,
      "burst": true,
      "force": 7
    },
    "quality": {
      "maxParticles": 6000,
      "iterations": 1,
      "renderScale": 0.68,
      "pixelRatio": 1.4,
      "fps": "display",
      "adaptive": true,
      "stats": false
    },
    "lighting": {
      "preset": "studio",
      "intensity": 0.85,
      "azimuth": 102,
      "elevation": 33
    },
    "bloom": {
      "enabled": true,
      "intensity": 1.5,
      "threshold": 0.45,
      "radius": 8,
      "knee": 0.06
    },
    "pulse": {
      "enabled": true,
      "frequency": 0.8,
      "duty": 0.38,
      "minimum": 0.2,
      "secondaryPhase": 0.5
    },
    "secondary": {
      "enabled": true,
      "x": -2.4,
      "z": 0.35,
      "rate": 95,
      "width": 0.28,
      "color": "#71117E",
      "mix": 0
    },
    "wake": {
      "enabled": false,
      "strength": 3.6,
      "reach": 1.25,
      "fade": 0.8
    },
    "wet": {
      "enabled": false,
      "radius": 1.5,
      "fade": 4.4,
      "strength": 0.63
    },
    "mist": {
      "enabled": false,
      "threshold": 15,
      "amount": 6,
      "budget": 1200,
      "lifetime": 0.75
    },
    "trails": {
      "enabled": true,
      "length": 0.28,
      "fade": 0.41,
      "path": "history",
      "minSpeed": 4
    },
    "speedColor": {
      "enabled": true,
      "fast": "#A5AAF3",
      "low": 2,
      "high": 12
    },
    "refraction": {
      "enabled": true,
      "strength": 35,
      "dispersion": 0.28
    },
    "caustics": {
      "enabled": true,
      "strength": 0.6,
      "reach": 72,
      "scale": 4
    },
    "iridescence": {
      "enabled": true,
      "strength": 0.55,
      "shift": 0.25
    },
    "bridges": {
      "enabled": true,
      "strength": 0.85,
      "length": 0.75,
      "lifetime": 0.23,
      "width": 0.28
    },
    "recoil": {
      "enabled": true,
      "strength": 0.35,
      "threshold": 3,
      "stiffness": 18,
      "damping": 5.8
    },
    "drips": {
      "enabled": true,
      "capture": 0.12,
      "capacity": 5,
      "delay": 0.42
    },
    "haze": {
      "enabled": true,
      "color": "#293053",
      "strength": 0.55,
      "start": 0,
      "range": 5
    },
    "glints": {
      "enabled": true,
      "color": "#EACBFF",
      "strength": 0.9,
      "threshold": 5,
      "speed": 2.4,
      "lifetime": 0.65
    },
    "gravityTilt": {
      "enabled": true,
      "angle": 16,
      "swing": false,
      "amplitude": 15,
      "frequency": 0.16
    }
  };

  const jadeFoundry = {
    view: { mode: "3d", perspective: true, yaw: 17, tilt: 11, zoom: 1, orbit: false, orbitSpeed: 8 },
    flow: { gravity: 16, viscosity: .26, tension: .21, rebound: .12, adhesion: .17,
      rate: 265, nozzle: .44, nozzleX: -2.75, depth: .8, speed: 2.8, sway: true, swayWidth: .35, swaySpeed: .65 },
    scene: { obstacles: true, layout: "cascade", obstacleCount: 4, obstacleType: "box",
      obstacleMotion: false, motionDistance: .45, motionSpeed: 1, motionTurn: 12, motionSeed: 7,
      basin: true, retention: 2.8,
      showSolids: true, solid: "#243F4A", background: "#07131E", backdrop: true, grid: true },
    liquid: { style: "surface", body: "#139D9D", edge: "#5BF4DE", highlight: "#F2FFF8", opacity: .96,
      thickness: 1.13, detail: 1.2, bloom: true, glow: .43, impact: true, impactLight: .75 },
    interaction: { enabled: true, radius: .58, bounce: .26, show: true, burst: true, force: 7 },
    quality: { maxParticles: 2800, iterations: 2, renderScale: .66, pixelRatio: 1.5, fps: "60", adaptive: true, stats: false }
  };

  const classicEffects = {
    pulse: { ...settings.pulse, enabled: false },
    lighting: { ...settings.lighting, intensity: 1, azimuth: 0, elevation: 0 },
    secondary: { ...settings.secondary, enabled: false },
    speedColor: { ...settings.speedColor, enabled: false, fast: "#FF8FC8" },
    refraction: { enabled: false, strength: 11 },
    bloom: { ...settings.bloom, enabled: false }
  };
  Object.assign(jadeFoundry, classicEffects);

  const lightingPresets = {
    studio: { label: "Soft Studio", key: "#FFFFFF", rim: "#C8DAFF", azimuth: -34, elevation: 34,
      ambient: .66, diffuse: .54, specular: .72, gloss: 14, edge: .16 },
    moon: { label: "Moonlit Steel", key: "#A6D8FF", rim: "#7B9EFF", azimuth: -56, elevation: 27,
      ambient: .48, diffuse: .83, specular: 1.12, gloss: 24, edge: .38 },
    amber: { label: "Amber Furnace", key: "#FFB369", rim: "#FF713E", azimuth: 42, elevation: 29,
      ambient: .49, diffuse: .88, specular: 1.07, gloss: 19, edge: .31 },
    neon: { label: "Neon Violet", key: "#BB99FF", rim: "#6AFBEE", azimuth: -55, elevation: 12,
      ambient: .42, diffuse: .78, specular: 1.22, gloss: 21, edge: .54 },
    overcast: { label: "Overcast", key: "#E5F1FF", rim: "#DBECFF", azimuth: -8, elevation: 62,
      ambient: .78, diffuse: .40, specular: .39, gloss: 7, edge: .07 },
    noir: { label: "Noir Rim", key: "#DDE5FF", rim: "#B7D9FF", azimuth: 77, elevation: 18,
      ambient: .31, diffuse: .84, specular: 1.2, gloss: 30, edge: .57 }
  };

  const jadeVariant = overrides => Object.fromEntries(Object.entries(jadeFoundry).map(
    ([group, values]) => [group, { ...values, ...overrides[group] }]
  ));

  const presets = {
    "Preferred settings": settings,
    "Violet Spectacle": {
      ...settings,
      caustics: { ...settings.caustics, enabled: true },
      iridescence: { ...settings.iridescence, enabled: true },
      bridges: { ...settings.bridges, enabled: true },
      recoil: { ...settings.recoil, enabled: true },
      pulse: { ...settings.pulse, secondaryPhase: .5 },
      drips: { ...settings.drips, enabled: true },
      trails: { ...settings.trails, enabled: true, path: "history", minSpeed: 4 },
      refraction: { ...settings.refraction, dispersion: .28 },
      haze: { ...settings.haze, enabled: true },
      glints: { ...settings.glints, enabled: true }
    },
    "All effects": {
      ...settings,
      scene: { ...settings.scene, motionPath: "weave" },
      pulse: { ...settings.pulse, enabled: true },
      secondary: { ...settings.secondary, enabled: true },
      wake: { ...settings.wake, enabled: true },
      wet: { ...settings.wet, enabled: true },
      mist: { ...settings.mist, enabled: true },
      trails: { ...settings.trails, enabled: true },
      speedColor: { ...settings.speedColor, enabled: true },
      refraction: { ...settings.refraction, enabled: true },
      gravityTilt: { ...settings.gravityTilt, enabled: true, swing: true }
    },
    "Jade Foundry": jadeFoundry,
    "Liquid Mercury": jadeVariant({ flow: { viscosity: .36, tension: .37, rebound: .18 },
      liquid: { body: "#5A758B", edge: "#B9E6FF", highlight: "#FFFFFF", glow: .24 }, scene: { solid: "#343B4A" } }),
    "Amber Syrup": jadeVariant({ flow: { gravity: 12, viscosity: .59, tension: .29, adhesion: .44, rate: 230 },
      liquid: { body: "#A43D14", edge: "#FFAB3C", highlight: "#FFF5C1", glow: .33 }, scene: { background: "#1A0C12" } }),
    "Blueprint": jadeVariant({ view: { mode: "2d" }, scene: { background: "#08182B", layout: "pinball", obstacleCount: 6 },
      flow: { tension: .15 }, liquid: { style: "particles", body: "#2F8CC7", edge: "#77DCFF", glow: .24 } }),
    "Transparent Overlay": jadeVariant({ scene: { background: "#00000000", backdrop: false, showSolids: false },
      liquid: { glow: .23 }, view: { mode: "2d" } }),
    "Low Power": jadeVariant({ view: { mode: "2d" }, flow: { rate: 145 },
      liquid: { bloom: false }, quality: { maxParticles: 1150, iterations: 1, renderScale: .45, pixelRatio: 1, fps: "30" } })
  };

  const when3D = config => config.view.mode === "3d";
  const hasObstacles = config => config.scene.obstacles && config.scene.obstacleCount > 0;
  const movingObstacles = config => hasObstacles(config) && config.scene.obstacleMotion;
  const cameraLimits = { yaw: [-180, 180], tilt: [-75, 75], zoom: [.6, 1.7] };
  const range = (path, label, min, max, step, options = {}) => ({ path, label, type: "range", min, max, step, ...options });
  const toggle = (path, label, options = {}) => ({ path, label, type: "boolean", ...options });
  const choice = (path, label, options, extra = {}) => ({ path, label, type: "select", options, ...extra });
  const color = (path, label, options = {}) => ({ path, label, type: "color", ...options });
  const group = (label, fields) => ({ label, fields });
  const section = (label, groups, open = false) => ({ label, groups, open });
  const sections = [
    section("View", [
      group("Camera", [
        choice("view.mode", "View mode", { "2d": "2D · planar", "3d": "3D · volume" },
          { help: "Left-drag to rotate in 3D. Use the mouse wheel to zoom in either view." }),
        toggle("view.perspective", "Perspective camera", { when: when3D }),
        range("view.yaw", "Yaw", ...cameraLimits.yaw, 1, { when: when3D, unit: "°" }),
        range("view.tilt", "Tilt", ...cameraLimits.tilt, 1, { when: when3D, unit: "°" }),
        range("view.zoom", "Zoom", ...cameraLimits.zoom, .01, { continuous: true })
      ]),
      group("Camera motion", [
        toggle("view.orbit", "Auto-orbit camera", { when: when3D }),
        range("view.orbitSpeed", "Orbit speed", 1, 25, 1, { when: c => when3D(c) && c.view.orbit })
      ])
    ], true),
    section("Particles", [
      group("Physics", [
        range("flow.gravity", "Gravity", 0, 30, .5),
        range("flow.viscosity", "Viscosity", 0, .8, .01, { help: "Blends the velocities of nearby particles." }),
        range("flow.tension", "Surface tension", 0, .6, .01, { help: "Draws the edges of the liquid together." }),
        range("flow.rebound", "Surface bounce", 0, .8, .01),
        range("flow.adhesion", "Surface stickiness", 0, .8, .01),
        range("scene.retention", "Pool retention", .5, 6, .1, { when: c => c.scene.basin, unit: " s",
          help: "Controls how long liquid collects before it drains." })
      ]),
      group("Emitter", [
        range("flow.rate", "Emission rate", 30, 600, 5, { unit: " /s" }),
        range("flow.nozzle", "Nozzle width", .16, 1.6, .01),
        range("flow.nozzleX", "Nozzle position", -6, 6, .05),
        range("flow.depth", "Nozzle depth", .15, 2.4, .05, { when: when3D }),
        range("flow.speed", "Emission speed", .4, 9, .1),
        toggle("flow.sway", "Sweep the stream"),
        range("flow.swayWidth", "Sweep width", 0, 3, .05, { when: c => c.flow.sway }),
        range("flow.swaySpeed", "Sweep speed", .1, 3, .05, { when: c => c.flow.sway })
      ]),
      group("Appearance", [
        choice("liquid.style", "Render style", { surface: "Glossy surface", particles: "Visible particles" }),
        color("liquid.body", "Body color"), color("liquid.edge", "Edge color"), color("liquid.highlight", "Highlight color"),
        range("liquid.opacity", "Liquid opacity", .1, 1, .01),
        range("liquid.thickness", "Rendered particle size", .6, 1.75, .01),
        range("liquid.detail", "Surface relief", 0, 3, .05, { when: c => c.liquid.style === "surface" })
      ]),
      group("Liquid highlights", [
        toggle("liquid.bloom", "Liquid edge glow"),
        range("liquid.glow", "Glow intensity", 0, 1.5, .01, { when: c => c.liquid.bloom }),
        toggle("liquid.impact", "Impact highlights"),
        range("liquid.impactLight", "Impact brightness", 0, 1.5, .05, { when: c => c.liquid.impact })
      ]),
      group("Pointer", [
        toggle("interaction.enabled", "Pointer deflector", { help: "Mouse hover or touch pushes liquid aside. In 3D it sits at the center of the stream depth." }),
        range("interaction.radius", "Deflector radius", .18, 1.8, .01, { when: c => c.interaction.enabled }),
        range("interaction.bounce", "Deflector bounce", 0, .8, .01, { when: c => c.interaction.enabled }),
        toggle("interaction.show", "Show deflector", { when: c => c.interaction.enabled }),
        toggle("interaction.burst", "Click or tap for an impulse", { when: c => c.interaction.enabled }),
        range("interaction.force", "Impulse strength", 1, 18, .5, { when: c => c.interaction.enabled && c.interaction.burst })
      ]),
      group("Simulation quality", [
        range("quality.maxParticles", "Particle budget", 400, 6000, 100),
        range("quality.iterations", "Pressure iterations", 1, 4, 1),
        range("quality.renderScale", "Liquid resolution", .35, 1, .01),
        toggle("quality.adaptive", "Adaptive quality", { help: "Lowers liquid resolution and emission when frames slow down." }),
        toggle("quality.stats", "Show FPS and particles")
      ])
    ], true),
    section("Scene", [
      group("Obstacles", [
        toggle("scene.obstacles", "Enable obstacles"),
        range("scene.obstacleCount", "Obstacle count", 0, 12, 1, { when: c => c.scene.obstacles }),
        choice("scene.layout", "Obstacle layout", { cascade: "Foundry cascade", pinball: "Pinball", terraces: "Split terraces" }, { when: hasObstacles }),
        choice("scene.obstacleType", "Obstacle type", { box: "Ledge", round: "Round bumper",
          capsule: "Capsule", wedge: "Wedge", diamond: "Diamond", mixed: "Mixed" }, { when: hasObstacles }),
        toggle("scene.obstacleMotion", "Random obstacle movement", { when: hasObstacles }),
        range("scene.motionDistance", "Travel distance", 0, 1.5, .05, { when: movingObstacles }),
        range("scene.motionSpeed", "Movement speed", .1, 3, .05, { when: movingObstacles }),
        range("scene.motionTurn", "Rocking angle", 0, 45, 1, { when: movingObstacles, unit: "°" }),
        choice("scene.motionPath", "Obstacle motion path", { wander: "Random drift", wave: "Wave",
          eight: "Figure eight", weave: "Depth weave" }, { when: movingObstacles }),
        range("scene.motionPhase", "Neighbor phase offset", 0, 360, 1,
          { when: c => movingObstacles(c) && c.scene.motionPath !== "wander", unit: "°" }),
        range("scene.motionSeed", "Motion seed", 1, 100, 1, { when: movingObstacles,
          help: "Change the seed to give the obstacles different paths." })
      ]),
      group("Basin and surfaces", [
        toggle("scene.basin", "Catch basin"),
        toggle("scene.showSolids", "Show obstacle surfaces", { when: c => hasObstacles(c) || c.scene.basin }),
        color("scene.solid", "Obstacle color", { when: c => c.scene.showSolids && (hasObstacles(c) || c.scene.basin) })
      ]),
      group("Backdrop", [
        color("scene.background", "Background color", { help: "Use #00000000 for a fully transparent backdrop." }),
        toggle("scene.backdrop", "Backdrop lighting"),
        toggle("scene.grid", "Backdrop grid", { when: c => c.scene.backdrop })
      ])
    ]),
    section("Lighting", [
      group("Light rig", [
        choice("lighting.preset", "Lighting preset",
          Object.fromEntries(Object.entries(lightingPresets).map(([key, light]) => [key, light.label]))),
        range("lighting.intensity", "Lighting intensity", 0, 2, .05),
        range("lighting.azimuth", "Horizontal light offset", -180, 180, 1, { unit: "°" }),
        range("lighting.elevation", "Vertical light offset", -75, 75, 1, { unit: "°" })
      ]),
      group("Bloom", [
        toggle("bloom.enabled", "Bloom"),
        range("bloom.intensity", "Bloom intensity", 0, 2, .05, { when: c => c.bloom.enabled }),
        range("bloom.threshold", "Brightness threshold", 0, 1, .01, { when: c => c.bloom.enabled }),
        range("bloom.radius", "Bloom radius", 2, 64, 1, { when: c => c.bloom.enabled, unit: " px" }),
        range("bloom.knee", "Threshold softness", .01, .5, .01, { when: c => c.bloom.enabled })
      ])
    ]),
    section("Effects", [
      group("Pulsed emitter", [
        toggle("pulse.enabled", "Pulsed emitter"),
        range("pulse.frequency", "Pulse frequency", .1, 5, .1, { when: c => c.pulse.enabled, unit: " Hz" }),
        range("pulse.duty", "Burst fraction", .05, .95, .01, { when: c => c.pulse.enabled }),
        range("pulse.minimum", "Minimum flow fraction", 0, 1, .01, { when: c => c.pulse.enabled }),
        range("pulse.secondaryPhase", "Second emitter pulse offset", 0, 1, .01,
          { when: c => c.pulse.enabled && c.secondary.enabled, help: "A value of 0.5 staggers the emitters by half a cycle." })
      ]),
      group("Two-tone streams", [
        toggle("secondary.enabled", "Second emitter"),
        range("secondary.x", "Second emitter X", -6, 6, .05, { when: c => c.secondary.enabled }),
        range("secondary.z", "Second emitter depth offset", -2, 2, .05, { when: c => c.secondary.enabled && when3D(c) }),
        range("secondary.rate", "Second emission rate", 10, 600, 5, { when: c => c.secondary.enabled, unit: " /s" }),
        range("secondary.width", "Second nozzle width", .16, 1.6, .01, { when: c => c.secondary.enabled }),
        color("secondary.color", "Second liquid color", { when: c => c.secondary.enabled }),
        range("secondary.mix", "Dye mixing", 0, 1, .01, { when: c => c.secondary.enabled })
      ]),
      group("Wake vortices", [
        toggle("wake.enabled", "Wake vortices", { when: movingObstacles }),
        range("wake.strength", "Wake strength", 0, 12, .1, { when: c => movingObstacles(c) && c.wake.enabled }),
        range("wake.reach", "Wake reach", .25, 3, .05, { when: c => movingObstacles(c) && c.wake.enabled }),
        range("wake.fade", "Wake fade time", .1, 3, .05, { when: c => movingObstacles(c) && c.wake.enabled, unit: " s" })
      ]),
      group("Wet surfaces", [
        toggle("wet.enabled", "Wet surfaces"),

  function obstacleOutline(type, width, height) {
    if (type === "round") {
      const radius = clamp(width * .52, .32, .78);
      return Array.from({ length: 20 }, (_, i) => {
        const angle = i * 2 * Math.PI / 20;

      });
    }
    if (type === "capsule") {
      const radius = Math.min(width * .6, Math.max(height, .27));
      const span = width - radius;
      return Array.from({ length: 18 }, (_, i) => {
        const angle = (i % 9) * Math.PI / 8 - Math.PI / 2 + (i < 9 ? 0 : Math.PI);
        return [(i < 9 ? span : -span) + radius * Math.cos(angle), radius * Math.sin(angle)];

      const h = Math.max(height, .48);

  }

  function setObstaclePose(solid, angle) {
    solid.c = Math.cos(angle);
    solid.s = Math.sin(angle);
    solid.boundX = Math.abs(solid.c) * solid.w + Math.abs(solid.s) * solid.h;
    solid.boundY = Math.abs(solid.s) * solid.w + Math.abs(solid.c) * solid.h;
  }

  function updateObstacleMotion(time, dt = 0) {
    const { motionSpeed, motionPath, motionPhase } = config.scene;
    const motionDistance = movingCount ? config.scene.motionDistance : 0;
    const motionTurn = movingCount ? config.scene.motionTurn : 0;
    const recoil = config.recoil;
    const activeCount = recoil.enabled ? ledgeCount : movingCount;
    for (let i = 0; i < activeCount; i++) {
      const solid = solids[i];
      const { baseX, baseY, baseZ, angle, phaseX, phaseY, phaseTurn, pace } = solid;
      const ordered = motionPath !== "wander";
      const speed = motionSpeed * (ordered ? 1 : pace);
      const phase = i * motionPhase * radians;
      const x = time * speed + (ordered ? phase : phaseX);
      const eight = motionPath === "eight";
      const weave = is3D && motionPath === "weave";
      const verticalRate = ordered ? (eight ? 2 : 1) : .73;
      const y = time * speed * verticalRate + (ordered ? phase * verticalRate + (eight ? 0 : Math.PI / 2) : phaseY);
      const z = x + Math.PI / 2;
      const turn = time * speed * 1.17 + (ordered ? phase : phaseTurn);
      const rocking = motionTurn * radians;
      solid.x = baseX + motionDistance * Math.sin(x);
      solid.y = baseY + motionDistance * .48 * Math.sin(y);
      solid.z = baseZ + (weave ? motionDistance * Math.sin(z) : 0);
      solid.vx = motionDistance * speed * Math.cos(x);
      solid.vy = motionDistance * .48 * speed * verticalRate * Math.cos(y);
      solid.vz = weave ? motionDistance * speed * Math.cos(z) : 0;
      solid.angularVelocity = rocking * speed * 1.17 * Math.cos(turn);
      if (recoil.enabled) {
        const decay = Math.exp(-recoil.damping * dt);
        solid.recoilVX = (solid.recoilVX - solid.recoilX * recoil.stiffness * dt) * decay;
        solid.recoilVY = (solid.recoilVY - solid.recoilY * recoil.stiffness * dt) * decay;
        solid.recoilSpin = (solid.recoilSpin - solid.recoilAngle * recoil.stiffness * dt) * decay;
        solid.recoilX = clamp(solid.recoilX + solid.recoilVX * dt, -.6, .6);
        solid.recoilY = clamp(solid.recoilY + solid.recoilVY * dt, -.6, .6);
        solid.recoilAngle = clamp(solid.recoilAngle + solid.recoilSpin * dt, -.45, .45);
        solid.x += solid.recoilX;
        solid.y += solid.recoilY;
        solid.vx += solid.recoilVX;
        solid.vy += solid.recoilVY;
        solid.angularVelocity += solid.recoilSpin;
      }
      setObstaclePose(solid, angle + rocking * Math.sin(turn) + (recoil.enabled ? solid.recoilAngle : 0));
      if (config.wake.enabled && movingCount) {
        const blend = dt ? -Math.expm1(-dt / config.wake.fade) : 1;
        solid.wakeX += (solid.x - solid.wakeX) * blend;
        solid.wakeY += (solid.y - solid.wakeY) * blend;
        solid.wakeZ += (solid.z - solid.wakeZ) * blend;
        const speedXY = Math.hypot(solid.vx, solid.vy, solid.vz);
        solid.wakePower += (Math.min(1, speedXY) - solid.wakePower) * blend;

  class Fluid {

    spawn(due, center, depth, width, dye) {
      const budget = config.quality.maxParticles;
      const f = config.flow;
      for (let spawned = 0; spawned < due && this.count < budget; spawned++) {
        const i = this.count++;

        this.p[k] = center + (this.random() - .5) * width;
        this.p[k + 1] = 5.49 + this.random() * .21;
        this.p[k + 2] = is3D ? depth + (this.random() - .5) * f.depth : 0;
        this.v[k] = (this.random() - .5) * .55;
        this.v[k + 1] = -f.speed * (.85 + .3 * this.random());
        this.v[k + 2] = is3D ? (this.random() - .5) * .45 : 0;

      this.impact[i] = 0;
      this.wet[i] = 0;

    releaseDrips(dt) {

        if (solid.dripCount >= capacity || solid.dripTimer >= delay * 2) solid.dripping = true;
        if ((!solid.dripping && config.drips.enabled) || solid.dripTimer < delay ||

        this.initParticle(i,dye);

    emitMist(i, nx, ny, nz, impact) {
      const { amount, budget, lifetime } = config.mist;

        this.mist[m + 2] = this.p[k + 2];
        this.mist[m + 3] = this.v[k] * .55 + nx * speed + (this.random() - .5) * scatter;
        this.mist[m + 4] = this.v[k + 1] * .55 + ny * speed + (this.random() - .5) * scatter;
        this.mist[m + 5] = is3D ? this.v[k + 2] * .55 + nz * speed + (this.random() - .5) * scatter : 0;
        this.mist[m + 6] = this.mist[m + 7] = lifetime * (.6 + .4 * this.random());

    updateMist(dt, gx, gy) {

          continue;
        }
        mist[m + 3] = (mist[m + 3] + gx * dt * .55) * drag;
        mist[m + 4] = (mist[m + 4] + gy * dt * .55) * drag;
        mist[m + 5] *= drag;
        for (let axis = 0; axis < 3; axis++) mist[m + axis] += mist[m + 3 + axis] * dt;
      }
    }

    applyWake(k, dt) {
      const reach = config.wake.reach;
      const strength = config.wake.strength * dt / reach;
      for (let i = 0; i < movingCount; i++) {
        const solid = solids[i];
        const dx = this.p[k] - solid.wakeX;
        const dy = this.p[k + 1] - solid.wakeY;
        const dz = this.p[k + 2] - solid.wakeZ;
        const distance2 = dx * dx + dy * dy + dz * dz;
        if (distance2 >= reach * reach) continue;
        const falloff = 1 - distance2 / (reach * reach);
        const spin = (i % 2 ? -1 : 1) * strength * solid.wakePower * falloff * falloff;
        this.v[k] -= dy * spin;
        this.v[k + 1] += dx * spin;
      }
    }

    remove(i) {
      const end = --this.count;
      this.breakLink(i);
      if (end === i) return;
      const partner = this.links[end];
      this.links[i] = partner;
      this.linkLife[i] = this.linkLife[end];
      if (partner >= 0) this.links[partner] = i;
      this.capture[i] = this.capture[end];
      this.historyCount[i] = this.historyCount[end];
      if (this.history && this.historyCount[i]) {
        const stride = historySamples * 3;
        this.history.copyWithin(i*stride,end*stride,(end+1)*stride);
      }
      const k = i * 3;
      this.p.copyWithin(k, end * 3, end * 3 + 3);
      this.v.copyWithin(k, end * 3, end * 3 + 3);
      this.impact[i] = this.impact[end];
      this.wet[i] = this.wet[end];
      this.dye[i] = this.dye[end];
    }

    breakLink(i) {
      const partner = this.links[i];
      if (partner >= 0) this.links[partner] = -1;
      this.links[i] = -1;
    }

    updateLinks(dt) {
      const { length, strength } = config.bridges;
      for (let i = 0; i < this.count; i++) {
        const j = this.links[i];
        if (j <= i) continue;
        const a = i*3, b = j*3;
        const dx = this.p[b]-this.p[a], dy = this.p[b+1]-this.p[a+1], dz = this.p[b+2]-this.p[a+2];
        const distance = Math.hypot(dx,dy,dz);
        const life = Math.min(this.linkLife[i],this.linkLife[j])-dt;
        if (!config.bridges.enabled || life <= 0 || distance > length) {
          this.breakLink(i);
          continue;
        }
        this.linkLife[i] = this.linkLife[j] = life;
        const impulse = distance > .22 ? Math.min(.22,(distance-.22)*strength*dt*28)/distance : 0;
        this.v[a] += dx*impulse;
        this.v[a+1] += dy*impulse;
        this.v[a+2] += dz*impulse;
        this.v[b] -= dx*impulse;
        this.v[b+1] -= dy*impulse;
        this.v[b+2] -= dz*impulse;
      }
    }

    recordHistory(dt) {
      const enabled = config.trails.enabled && config.trails.path === "history";
      if (!enabled || config.trails.length !== this.historyLength) {
        if (this.historyLength) this.historyCount.fill(0);
        this.historyLength = enabled ? config.trails.length : 0;
        this.historyClock = 0;
      }
      if (!enabled) return;
      this.history ??= new Float32Array(particleCapacity * historySamples * 3);
      this.historyClock += dt;
      const interval = Math.max(dt,this.historyLength / historySamples);
      if (this.historyClock < interval) return;
      this.historyClock %= interval;
      this.historyHead = (this.historyHead + 1) % historySamples;
      for (let i = 0, k = 0; i < this.count; i++, k += 3) {
        const offset = (i*historySamples + this.historyHead)*3;
        this.history[offset] = this.p[k];
        this.history[offset+1] = this.p[k+1];
        this.history[offset+2] = this.p[k+2];
        this.historyCount[i] = Math.min(historySamples,this.historyCount[i]+1);
      }
    }

    packSegments(bridges) {
      this.segments ??= new Float32Array(particleCapacity * historySamples * 12);
      const out = this.segments;
      let offset = 0;
      const minSpeed = config.trails.minSpeed;
      const write = (x,y,z,tx,ty,tz,k,i,fade,dye) => {
        out[offset++] = x; out[offset++] = y; out[offset++] = z; out[offset++] = this.impact[i];
        out[offset++] = this.v[k]; out[offset++] = this.v[k+1]; out[offset++] = this.v[k+2]; out[offset++] = dye;
        out[offset++] = tx; out[offset++] = ty; out[offset++] = tz; out[offset++] = fade;
      };
      for (let i = 0, k = 0; i < this.count; i++, k += 3) {
        const x = this.p[k], y = this.p[k+1], z = this.p[k+2];
        if (bridges) {
          const j = this.links[i];
          if (j <= i) continue;
          const q = j*3, dx = this.p[q]-x, dy = this.p[q+1]-y, dz = this.p[q+2]-z;
          const distance = Math.hypot(dx,dy,dz);
          if (distance < .26 || distance > config.bridges.length) continue;
          const fade = Math.min(1,this.linkLife[i]/Math.max(.04,config.bridges.lifetime*.45));
          write(x,y,z,this.p[q],this.p[q+1],this.p[q+2],k,i,fade,(this.dye[i]+this.dye[j])*.5);
          continue;
        }
        const vx=this.v[k], vy=this.v[k+1], vz=this.v[k+2];
        if (vx*vx+vy*vy+vz*vz < minSpeed*minSpeed) continue;
        let hx = x, hy = y, hz = z;
        for (let j = 0; j < this.historyCount[i]; j++) {
          const h = (i*historySamples+(this.historyHead-j+historySamples)%historySamples)*3;
          const tx=this.history[h], ty=this.history[h+1], tz=this.history[h+2];
          write(hx,hy,hz,tx,ty,tz,k,i,1-(j+1)/historySamples,this.dye[i]);
          hx=tx; hy=ty; hz=tz;
        }
      }
      return offset / 12;
    }

    hash() {
      const { p, head, next, cells, h, nx, ny, nz, layer } = this;
      head.fill(-1);
      for (let i = 0, k = 0; i < this.count; i++, k += 3) {
        const x = clamp(Math.floor(p[k] / h + nx / 2), 0, nx - 1);
        const y = clamp(Math.floor(p[k + 1] / h + ny / 2), 0, ny - 1);
        const z = clamp(Math.floor(p[k + 2] / h + nz / 2), 0, nz - 1);
        const cell = x + y * nx + z * layer;
        cells[i] = cell;
        next[i] = head[cell];
        head[cell] = i;
      }
    }

    // Two pressure passes share the same grid. Each pair is evaluated once per pass.
    neighbors(phase) {
      const { p, v, delta, density, cells, head, next, h, nx, ny, nz, layer } = this;
      const h2 = h * h;
      const { tension, viscosity } = config.flow;
      const dyeMix = config.secondary.enabled ? config.secondary.mix : 0;
      const bridges = config.bridges;
      const targetDensity = is3D ? 3.2 : 4.5;
      const pressureScale = is3D ? 1 : .62;
      for (let i = 0, a = 0; i < this.count; i++, a += 3) {
        const cell = cells[i];
        const cx = cell % nx;
        const cy = Math.floor(cell / nx) % ny;
        const cz = Math.floor(cell / layer);
        const px = p[a], py = p[a + 1], pz = p[a + 2];
        const minX = Math.max(0, cx - 1), maxX = Math.min(nx - 1, cx + 1);
        const minY = Math.max(0, cy - 1), maxY = Math.min(ny - 1, cy + 1);
        const minZ = Math.max(0, cz - 1), maxZ = Math.min(nz - 1, cz + 1);
        for (let z = minZ; z <= maxZ; z++) {
          for (let y = minY; y <= maxY; y++) {
            const start = z * layer + y * nx;
            for (let x = minX; x <= maxX; x++) {
              for (let j = head[start + x]; j > i; j = next[j]) {
                // Linked lists contain indices in descending order.
                const b = j * 3;
                const dx = p[b] - px, dy = p[b + 1] - py, dz = p[b + 2] - pz;
                const r2 = dx * dx + dy * dy + dz * dz;
                if (r2 >= h2) continue;
                const r = Math.sqrt(Math.max(r2, 1e-10));
                const q = 1 - r / h;
                if (phase === 0) {
                  density[i] += q * q;
                  density[j] += q * q;
                  continue;
                }
                let fx, fy, fz;
                if (phase === 1) {
                  const excess = Math.max(0, (density[i] + density[j]) * .5 - targetDensity);
                  const core = .055 * q * q * q;
                  const repel = pressureScale * Math.min(.047, .008 * excess * q + core);
                  const cohesion = tension * .029 * q * (1 - q);
                  if (bridges.enabled && r > .20 && r < .32 && this.links[i] < 0 && this.links[j] < 0
                    && (v[b]-v[a])*dx + (v[b+1]-v[a+1])*dy + (v[b+2]-v[a+2])*dz > .12) {
                    this.links[i] = j;
                    this.links[j] = i;
                    this.linkLife[i] = this.linkLife[j] = bridges.lifetime;
                  }
                  const force = (repel - cohesion) / r;
                  fx = r2 < 1e-10 ? .012 : dx * force;
                  fy = dy * force;
                  fz = dz * force;
                } else {
                  const mix = viscosity * q / (2 + Math.max(density[i], density[j]) * 2);
                  fx = (v[a] - v[b]) * mix;
                  fy = (v[a + 1] - v[b + 1]) * mix;
                  fz = (v[a + 2] - v[b + 2]) * mix;
                  if (dyeMix) {
                    const transfer = (this.dye[i] - this.dye[j]) * dyeMix * q
                      / (4 + Math.max(density[i], density[j]) * 4);
                    this.dyeDelta[i] -= transfer;
                    this.dyeDelta[j] += transfer;
                  }
                }
                delta[a] -= fx;
                delta[a + 1] -= fy;
                delta[a + 2] -= fz;
                delta[b] += fx;
                delta[b + 1] += fy;
                delta[b + 2] += fz;
              }
            }
          }
        }
      }
    }

    contact(i, nx, ny, nz, overlap, bounce, adhesion, surfaceX, surfaceY, surfaceZ, respond, solid) {
      const k = i * 3;
      this.p[k] += nx * overlap;
      this.p[k + 1] += ny * overlap;
      this.p[k + 2] += nz * overlap;
      if (!respond) return;
      const vx = this.v[k] - surfaceX;
      const vy = this.v[k + 1] - surfaceY;
      const vz = this.v[k + 2] - surfaceZ;
      const normalSpeed = vx * nx + vy * ny + vz * nz;
      if (normalSpeed >= 0) return;
      const reflected = -normalSpeed * bounce;
      const friction = 1 - adhesion * .32;
      this.v[k] = surfaceX + (vx - normalSpeed * nx) * friction + reflected * nx;
      this.v[k + 1] = surfaceY + (vy - normalSpeed * ny) * friction + reflected * ny;
      this.v[k + 2] = surfaceZ + (vz - normalSpeed * nz) * friction + reflected * nz;
      if (solid?.ledge) this.obstacleImpact(solid,i,nx,ny,-normalSpeed);
      if (solid && config.wet.enabled) {
        const dx = this.p[k] - solid.x, dy = this.p[k + 1] - solid.y;
        const deposit = Math.min(.6, -normalSpeed * .09);
        const mix = deposit / Math.max(.01, deposit + solid.wetness);
        solid.wetX += (solid.c * dx + solid.s * dy - solid.wetX) * mix;
        solid.wetY += (-solid.s * dx + solid.c * dy - solid.wetY) * mix;
        solid.wetZ += (this.p[k + 2] - solid.z - solid.wetZ) * mix;
        solid.wetness = Math.min(1, solid.wetness + deposit);
        solidsDirty = true;
      }
      if (config.mist.enabled && -normalSpeed >= config.mist.threshold) {
        this.emitMist(i, nx, ny, nz, -normalSpeed);
      }
      this.impact[i] = Math.max(this.impact[i], Math.min(1, -normalSpeed * .085));
    }

    obstacleImpact(solid,i,nx,ny,speed) {
      const { recoil, drips, glints } = config;
      if (!recoil.enabled && !drips.enabled && !glints.enabled) return;
      const k = i*3, dx = this.p[k]-solid.x, dy = this.p[k+1]-solid.y;
      const localX = solid.c*dx+solid.s*dy;
      if (recoil.enabled && speed >= recoil.threshold) {
        const impulse = Math.min(.65,(speed-recoil.threshold)*recoil.strength*.055);
        solid.recoilVX = clamp(solid.recoilVX-nx*impulse,-3,3);
        solid.recoilVY = clamp(solid.recoilVY-ny*impulse,-3,3);
        solid.recoilSpin = clamp(solid.recoilSpin-(dx*ny-dy*nx)*impulse,-3,3);
      }
      if (glints.enabled && speed >= glints.threshold) {
        const power = Math.min(1,speed/12);
        if (power >= solid.glintPower * Math.max(0,1-solid.glintAge/glints.lifetime)) {
          solid.glintX = localX;
          solid.glintY = -solid.s*dx+solid.c*dy;
          solid.glintZ = this.p[k+2]-solid.z;
          solid.glintAge = 0;
          solid.glintPower = power;
          solidsDirty = true;
        }
      }
      if (drips.enabled && !this.capture[i] && speed >= .85 && solid.dripCount < drips.capacity*2
        && this.random() < drips.capture) {
        this.capture[i] = 1;
        const weight = 1 / ++solid.dripCount;
        solid.dripX += (localX-solid.dripX)*weight;
        solid.dripZ += (this.p[k+2]-solid.z-solid.dripZ)*weight;
        solid.dripDye += this.dye[i];
      }
    }

    collide(i, respond) {
      const k = i * 3;
      const p = this.p;
      const radius = .083;
      const { rebound, adhesion } = config.flow;
      for (const solid of solids) {
        const dx = p[k] - solid.x, dy = p[k + 1] - solid.y, z = p[k + 2] - solid.z;
        if (Math.abs(dy) > solid.boundY + radius || Math.abs(dx) > solid.boundX + radius
          || (is3D && Math.abs(z) >= solid.d + radius)) continue;
        const x = solid.c * dx + solid.s * dy;
        const y = -solid.s * dx + solid.c * dy;
        let distance = is3D ? Math.abs(z) - solid.d : -Infinity;
        let nx = 0, ny = 0, nz = Math.sign(z) || 1;
        for (const face of solid.faces) {
          const signed = face.nx * x + face.ny * y - face.offset;
          if (signed > distance) {
            distance = signed;
            nx = face.nx;
            ny = face.ny;
            nz = 0;
          }
          if (distance >= radius) break;
        }
        if (distance >= radius) continue;
        this.contact(i, solid.c * nx - solid.s * ny, solid.s * nx + solid.c * ny, nz, radius - distance, rebound, adhesion,
          solid.vx - solid.angularVelocity * dy, solid.vy + solid.angularVelocity * dx, solid.vz, respond, solid);
      }
      if (!pointer.valid) return;
      const dx = p[k] - pointer.x;
      const dy = p[k + 1] - pointer.y;
      const dz = p[k + 2];
      const reach = config.interaction.radius + radius;
      const distance2 = dx * dx + dy * dy + dz * dz;
      if (distance2 < reach * reach) {
        const distance = Math.sqrt(distance2);
        const inverse = distance > 1e-6 ? 1 / distance : 0;
        this.contact(i, dx * inverse, inverse ? dy * inverse : 1, dz * inverse, reach - distance,
          config.interaction.bounce, 0, pointer.vx, pointer.vy, 0, respond);
      }
    }

    step(dt) {
      if (movingCount || config.recoil.enabled) updateObstacleMotion(elapsed, dt);
      if (config.glints.enabled) {
        for (let j = 0; j < ledgeCount; j++) {
          const solid = solids[j];
          if (!solid.glintPower) continue;
          solid.glintAge += dt;
          if (solid.glintAge >= config.glints.lifetime) solid.glintPower = 0;
          solidsDirty = true;
        }
      }
      const { p, v, base, delta, density, impact, wet } = this;
      const { gravity, viscosity } = config.flow;
      const { retention, basin: hasBasin } = config.scene;
      for (let i = this.count - 1; i >= 0; i--) {
        const k = i * 3;
        if (hasBasin && p[k + 1] < -3.95 && Math.abs(p[k]) < 4.85 && Math.abs(p[k + 2]) < 1.9) {
          wet[i] += dt * (.85 + Math.abs(p[k]) * .12);
        }
        if (p[k + 1] < -7.15 || p[k + 1] > 7.6 || Math.abs(p[k]) > 11.6 || Math.abs(p[k + 2]) > 4.7
          || wet[i] > retention || this.count > config.quality.maxParticles) this.remove(i);
      }
      this.releaseDrips(dt);
      this.emit(dt);
      const tilt = config.gravityTilt;
      const angle = tilt.enabled ? (tilt.angle + (tilt.swing
        ? Math.sin(elapsed * tilt.frequency * 2 * Math.PI) * tilt.amplitude : 0)) * radians : 0;
      const gx = gravity * Math.sin(angle), gy = -gravity * Math.cos(angle);
      this.updateMist(dt, gx, gy);
      if (config.wet.enabled) {
        const fade = Math.exp(-dt / config.wet.fade);
        for (const solid of solids) {
          if (!solid.wetness) continue;
          solid.wetness = solid.wetness > .002 ? solid.wetness * fade : 0;
          solidsDirty = true;
        }
      }

      for (let i = 0, k = 0; i < this.count; i++, k += 3) {
        impact[i] *= .95;
        if (pointer.valid && pointer.impulse) {
          const dx = p[k] - pointer.x, dy = p[k + 1] - pointer.y, dz = p[k + 2];
          const distance = Math.hypot(dx, dy, dz);
          const reach = config.interaction.radius * 3;
          if (distance < reach) {
            const force = config.interaction.force * (1 - distance / reach) / Math.max(distance, .05);
            v[k] += dx * force;
            v[k + 1] += dy * force;
            v[k + 2] += dz * force;
            impact[i] = Math.max(impact[i], .8);
          }
        }
        if (config.wake.enabled && movingCount) this.applyWake(k, dt);
        v[k] += gx * dt;
        v[k + 1] += gy * dt;
        // A speed limit keeps one step shorter than the thinnest expanded ledge.
        const speed = Math.max(1, Math.hypot(v[k], v[k + 1], v[k + 2]) / 21);
        for (let axis = 0; axis < 3; axis++) {
          v[k + axis] /= speed;
          p[k + axis] += v[k + axis] * dt;
        }
        this.collide(i, true);
      }
      pointer.impulse = false;
      if (config.drips.enabled) {
        for (let i = this.count-1; i >= 0; i--) if (this.capture[i]) this.remove(i);
      }
      const active = this.count * 3;
      for (let k = 0; k < active; k++) base[k] = p[k];
      for (let iteration = 0; iteration < config.quality.iterations; iteration++) {
        this.hash();
        density.fill(0, 0, this.count);
        delta.fill(0, 0, this.count * 3);
        this.neighbors(0);
        this.neighbors(1);
        for (let i = 0, k = 0; i < this.count; i++, k += 3) {
          for (let axis = 0; axis < 3; axis++) p[k + axis] += clamp(delta[k + axis], -.065, .065);
          this.collide(i, false);
        }
      }

      const correctionVelocity = (is3D ? .45 : .27) / dt;
      for (let k = 0; k < this.count * 3; k++) v[k] += (p[k] - base[k]) * correctionVelocity;
      const mixDye = config.secondary.enabled && config.secondary.mix > 0;
      if (viscosity > 0 || mixDye) {
        // Reuse the last pressure pass's density estimate for velocity mixing.
        this.hash();
        delta.fill(0, 0, active);
        if (mixDye) this.dyeDelta.fill(0, 0, this.count);
        this.neighbors(2);
        for (let k = 0; k < active; k++) v[k] += delta[k];
        if (mixDye) for (let i = 0; i < this.count; i++) this.dye[i] = clamp(this.dye[i] + this.dyeDelta[i], 0, 1);
      }
      this.updateLinks(dt);
      this.recordHistory(dt);
    }

    pack() {
      const out = this.vertexData;
      const visibleMist = config.mist.enabled ? this.mistCount : 0;
      for (let i = 0, a = 0, b = 0; i < this.count; i++, a += 3, b += 8) {
        out[b] = this.p[a];
        out[b + 1] = this.p[a + 1];
        out[b + 2] = this.p[a + 2];
        out[b + 3] = this.impact[i];
        out[b + 4] = this.v[a];
        out[b + 5] = this.v[a + 1];
        out[b + 6] = this.v[a + 2];
        out[b + 7] = this.dye[i];
      }
      for (let i = 0, a = 0, b = this.count * 8; i < visibleMist; i++, a += 9, b += 8) {
        out[b] = this.mist[a];
        out[b + 1] = this.mist[a + 1];
        out[b + 2] = this.mist[a + 2];
        out[b + 3] = -this.mist[a + 6] / this.mist[a + 7];
        out[b + 4] = this.mist[a + 3];
        out[b + 5] = this.mist[a + 4];
        out[b + 6] = this.mist[a + 5];
        out[b + 7] = this.mist[a + 8];
      }
      this.beadCount = 0;
      if (config.drips.enabled) {
        for (let i = 0; i < ledgeCount; i++) {
          const solid = solids[i];
          if (!solid.dripCount) continue;
          const offset = (this.count + visibleMist + this.beadCount++)*8;
          const outlet = this.dripOutlet(solid);
          out.set(outlet,offset);
          out[offset+1] += .045;
          out[offset+3] = -(.45+.5*Math.min(1,solid.dripCount/config.drips.capacity));
          out[offset+4] = solid.vx;
          out[offset+5] = solid.vy;
          out[offset+6] = solid.vz;
          out[offset+7] = solid.dripDye/solid.dripCount;
        }
      }
      return out;
    }
  }

  const camera = {
    right: new Float32Array(3), up: new Float32Array(3), axis: new Float32Array(3),
    extent: new Float32Array(2), perspective: 0
  };

  function updateCamera() {
    const view = config.view;
    const orbit = view.orbit ? Math.sin(elapsed * view.orbitSpeed * .018) * 25 : 0;
    const yaw = is3D ? (view.yaw + orbit) * Math.PI / 180 : 0;
    const pitch = is3D ? view.tilt * Math.PI / 180 : 0;
    const sy = Math.sin(yaw), cy = Math.cos(yaw);
    const sp = Math.sin(pitch), cp = Math.cos(pitch);
    camera.right.set([cy, 0, -sy]);
    camera.up.set([-sy * sp, cp, -cy * sp]);
    camera.axis.set([sy * cp, sp, cy * cp]);
    const aspect = canvas.clientWidth / Math.max(1, canvas.clientHeight);
    const halfHeight = Math.max(6.05, 5.4 / Math.max(.01, aspect)) / view.zoom;
    camera.extent[0] = halfHeight * aspect;
    camera.extent[1] = halfHeight;
    camera.perspective = Number(is3D && view.perspective);
  }

  function mapPointer(dt) {
    const wasValid = pointer.valid;
    pointer.valid = pointer.active && config.interaction.enabled;
    if (!pointer.valid) {
      pointer.vx = pointer.vy = 0;
      pointer.impulse = false;
      return;
    }

          vertex(a, -depth, nx, ny, 0, 0, 0);
          vertex(b, -depth, nx, ny, 0, 1, 0);
          vertex(b, depth, nx, ny, 0, 1, 1);
          vertex(a, -depth, nx, ny, 0, 0, 0);
          vertex(b, depth, nx, ny, 0, 1, 1);
          vertex(a, depth, nx, ny, 0, 0, 1);
        }
      }
      this.solidCount = vertices;
      gl.bindBuffer(gl.ARRAY_BUFFER, this.solidBuffer);
      const usage = dynamic ? gl.DYNAMIC_DRAW : gl.STATIC_DRAW;
      if (this.solidBufferBytes !== points.byteLength || this.solidUsage !== usage) {
        gl.bufferData(gl.ARRAY_BUFFER, points, usage);
        this.solidBufferBytes = points.byteLength;
        this.solidUsage = usage;
      } else if (vertices) {
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, points);
      }
    }

    cameraUniforms(u) {
      gl.uniform3fv(u.uRight, camera.right);
      gl.uniform3fv(u.uUp, camera.up);
      gl.uniform3fv(u.uAxis, camera.axis);
      gl.uniform2fv(u.uExtent, camera.extent);
      gl.uniform1f(u.uPerspective, camera.perspective);
    }

    bind(target) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, target?.fb || null);
      gl.viewport(0, 0, target?.w || canvas.width, target?.h || canvas.height);
    }

    texture(unit, id, location) {
      gl.activeTexture(gl.TEXTURE0 + unit);
      gl.bindTexture(gl.TEXTURE_2D, id);
      gl.uniform1i(location, unit);
    }

    lightUniforms(u, light, direction) {
      gl.uniform3fv(u.uLightDir,direction);
      gl.uniform3fv(u.uKeyColor,light.key);
      gl.uniform3fv(u.uRimColor,light.rim);
      gl.uniform4fv(u.uLight,light.levels);
      gl.uniform1f(u.uGloss,light.gloss);
    }

    drawBloom(w, h, ratio) {
      this.bloomHorizontal ??= this.target(false);
      this.bloomVertical ??= this.target(false);
      const width = Math.max(1,Math.ceil(w / 4));
      const height = Math.max(1,Math.ceil(h / 4));
      this.sizeTarget(this.bloomHorizontal,width,height);
      this.sizeTarget(this.bloomVertical,width,height);
      const { radius, threshold, knee, intensity } = config.bloom;
      const { handle, u } = this.bloomBlur;
      const spread = radius * ratio / 3.230769;
      gl.useProgram(handle);
      gl.uniform1f(u.uThreshold,threshold);
      gl.uniform1f(u.uKnee,knee);

      this.bind(this.bloomHorizontal);
      this.texture(0,this.compositeTarget.color,u.uInput);
      gl.uniform1i(u.uExtract,1);
      gl.uniform2f(u.uStep,spread / w,0);
      gl.drawArrays(gl.TRIANGLES,0,3);

      this.bind(this.bloomVertical);
      this.texture(0,this.bloomHorizontal.color,u.uInput);
      gl.uniform1i(u.uExtract,0);
      gl.uniform2f(u.uStep,0,spread / h);
      gl.drawArrays(gl.TRIANGLES,0,3);

      this.bind(null);
      const compose = this.bloomCompose;
      gl.useProgram(compose.handle);
      this.texture(0,this.compositeTarget.color,compose.u.uBase);
      this.texture(1,this.bloomVertical.color,compose.u.uBloom);
      gl.uniform1f(compose.u.uIntensity,intensity);
      gl.drawArrays(gl.TRIANGLES,0,3);
    }

    drawSegments(u,bridges,radius) {
      const count = simulation.packSegments(bridges);
      if (!count) return;
      if (!this.segmentsVAO) {
        this.segmentsVAO = gl.createVertexArray();
        this.segmentsBuffer = gl.createBuffer();
        gl.bindVertexArray(this.segmentsVAO);
        gl.bindBuffer(gl.ARRAY_BUFFER,this.segmentsBuffer);
        gl.bufferData(gl.ARRAY_BUFFER,particleCapacity*historySamples*48,gl.DYNAMIC_DRAW);
        for (let i = 0; i < 3; i++) {
          gl.enableVertexAttribArray(i);
          gl.vertexAttribPointer(i,4,gl.FLOAT,false,48,i*16);
          gl.vertexAttribDivisor(i,1);
        }
      }
      gl.bindVertexArray(this.segmentsVAO);
      gl.bindBuffer(gl.ARRAY_BUFFER,this.segmentsBuffer);
      gl.bufferSubData(gl.ARRAY_BUFFER,0,simulation.segments,0,count*12);
      gl.uniform1f(u.uSegmentMode,bridges ? 2 : 1);
      gl.uniform1f(u.uRadius,radius*(bridges ? config.bridges.width : 1));
      gl.uniform1f(u.uTrailFade,bridges ? .84 : config.trails.fade);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,count);
      gl.uniform1f(u.uSegmentMode,0);
      gl.uniform1f(u.uRadius,radius);
      gl.uniform1f(u.uTrailFade,config.trails.fade);
    }

    draw() {
      const { quality, scene, liquid, interaction, bloom } = config;
      const light = lightRig(config.lighting);
      const { haze, glints, caustics, iridescence, refraction } = config;
      const fog = haze.enabled ? haze.strength : 0;
      const applyBloom = bloom.enabled && bloom.intensity > 0;
      if (solidsDirty && scene.showSolids) {
        this.setSolids(solids, movingCount > 0 || config.wet.enabled || config.recoil.enabled || config.glints.enabled);
        solidsDirty = false;
      }
      const ratio = Math.min(devicePixelRatio || 1, quality.pixelRatio,
        this.maxSize / Math.max(1, canvas.clientWidth, canvas.clientHeight));
      const w = Math.max(1, Math.round(canvas.clientWidth * ratio));
      const h = Math.max(1, Math.round(canvas.clientHeight * ratio));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      const scale = Math.max(.32, quality.renderScale * qualityFactor);
      this.sizeTarget(this.sceneTarget, w, h);
      this.sizeTarget(this.fluidTarget, Math.max(1, Math.round(w*scale)), Math.max(1, Math.round(h*scale)));
      const show = scene.showSolids && this.solidCount > 0;

      this.bind(this.sceneTarget);
      gl.enable(gl.DEPTH_TEST);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      if (show) {
        const { handle, u } = this.solid;
        gl.useProgram(handle);
        this.cameraUniforms(u);
        this.lightUniforms(u,light,light.direction);
        gl.uniform3fv(u.uEye,camera.axis);
        gl.uniform3fv(u.uHazeColor,hex(haze.color));
        gl.uniform3f(u.uHaze,fog,haze.start,haze.start+haze.range);
        gl.uniform3fv(u.uGlintColor,hex(glints.color));
        gl.uniform2f(u.uGlint,glints.enabled ? glints.strength : 0,glints.speed);
        gl.uniform3fv(u.uColor, hex(scene.solid));
        gl.uniform3fv(u.uWetColor, hex(liquid.body));
        gl.uniform1f(u.uWetRadius, config.wet.radius);
        gl.uniform1f(u.uWetStrength, config.wet.enabled ? config.wet.strength : 0);
        gl.bindVertexArray(this.solidsVAO);
        gl.drawArrays(gl.TRIANGLES, 0, this.solidCount);
      }

      this.bind(this.fluidTarget);
      gl.drawBuffers([gl.COLOR_ATTACHMENT0,fog > 0 ? gl.COLOR_ATTACHMENT1 : gl.NONE]);
      gl.disable(gl.DEPTH_TEST);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE);
      {
        const { handle, u } = this.fluid;
        gl.useProgram(handle);
        this.cameraUniforms(u);
        this.texture(0, this.sceneTarget.depth, u.uSolidDepth);
        gl.uniform2f(u.uSize, this.fluidTarget.w, this.fluidTarget.h);
        const radius = (liquid.style === "particles" ? .145 : .24) * liquid.thickness;
        gl.uniform1f(u.uRadius,radius);
        gl.uniform3f(u.uHaze,fog,haze.start,haze.start+haze.range);
        gl.uniform1f(u.uTrailMin,config.trails.minSpeed);
        gl.uniform1f(u.uTrailLength,0);
        gl.uniform1f(u.uSegmentMode,0);
        gl.uniform1f(u.uParticles, Number(liquid.style === "particles"));
        gl.uniform1f(u.uHasSolids, Number(show));
        gl.bindVertexArray(this.particlesVAO);
        gl.bindBuffer(gl.ARRAY_BUFFER, this.particleBuffer);
        const data = simulation.pack();
        const total = simulation.count + (config.mist.enabled ? simulation.mistCount : 0) + simulation.beadCount;
        const { low, high } = config.speedColor;
        gl.uniform2f(u.uSpeedRange, low, Math.max(low + .01, high));
        gl.uniform1f(u.uUseSpeed, Number(config.speedColor.enabled));
        gl.uniform1f(u.uTrailFade, config.trails.fade);
        if (total) {
          gl.bufferSubData(gl.ARRAY_BUFFER, 0, data, 0, total * 8);
          if (config.trails.enabled && config.trails.path === "straight" && simulation.count) {
            gl.uniform1f(u.uTrailLength, config.trails.length);
            gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, simulation.count);
          }
          gl.uniform1f(u.uTrailLength, 0);
          gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, total);
          if (config.bridges.enabled) this.drawSegments(u,true,radius);
          if (config.trails.enabled && config.trails.path === "history") this.drawSegments(u,false,radius);
        }
      }
      gl.disable(gl.BLEND);

      if (applyBloom) {
        this.compositeTarget ??= this.target(false);
        this.sizeTarget(this.compositeTarget,w,h);
      }
      this.bind(applyBloom ? this.compositeTarget : null);
      const { handle, u } = this.finish;
      gl.useProgram(handle);
      this.lightUniforms(u,light,light.screen);
      this.texture(0, this.sceneTarget.color, u.uScene);
      this.texture(1, this.fluidTarget.color, u.uFluid);
      this.texture(2, this.fluidTarget.haze, u.uFluidHaze);
      gl.uniform3fv(u.uHazeColor,hex(haze.color));
      gl.uniform1f(u.uHazeStrength,fog);
      gl.uniform3f(u.uCaustics,caustics.enabled ? caustics.strength : 0,caustics.reach*ratio,caustics.scale/ratio);
      gl.uniform2f(u.uIridescence,iridescence.enabled ? iridescence.strength : 0,iridescence.shift);
      gl.uniform1f(u.uDispersion,refraction.enabled ? refraction.dispersion : 0);
      gl.uniform1f(u.uTime,elapsed);
      gl.uniform2f(u.uPixel, 1 / this.fluidTarget.w, 1 / this.fluidTarget.h);
      gl.uniform2f(u.uViewport, w, h);
      gl.uniform4fv(u.uBackground, hex(scene.background, true));
      gl.uniform3fv(u.uBody, hex(liquid.body));
      gl.uniform3fv(u.uEdge, hex(liquid.edge));
      gl.uniform3fv(u.uHighlight, hex(liquid.highlight));
      gl.uniform3fv(u.uDyeColor, hex(config.secondary.color));
      gl.uniform3fv(u.uFastColor, hex(config.speedColor.fast));
      gl.uniform1f(u.uUseDye, Number(config.secondary.enabled));
      gl.uniform1f(u.uUseSpeed, Number(config.speedColor.enabled));
      gl.uniform1f(u.uRefraction, config.refraction.enabled ? config.refraction.strength * ratio : 0);
      gl.uniform1f(u.uBackdrop, Number(scene.backdrop));
      gl.uniform1f(u.uGrid, Number(scene.grid));
      gl.uniform1f(u.uOpacity, liquid.opacity);
      gl.uniform1f(u.uDetail, liquid.detail);
      gl.uniform1f(u.uGlow, liquid.bloom ? liquid.glow : 0);
      gl.uniform1f(u.uImpact, liquid.impact ? liquid.impactLight : 0);
      gl.uniform1f(u.uParticles, Number(liquid.style === "particles"));
      gl.uniform2f(u.uPointer, .5+.5*pointer.u, .5+.5*pointer.v);
      const depth = camera.axis[0]*pointer.x + camera.axis[1]*pointer.y;
      const projection = 1 - camera.perspective * depth / 18;
      gl.uniform1f(u.uPointerRadius, pointer.valid && interaction.show
        ? interaction.radius*h/(2*camera.extent[1]*projection) : 0);
      gl.bindVertexArray(this.emptyVAO);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      if (applyBloom) this.drawBloom(w,h,ratio);
    }
  }

  let raf = 0;
  let sampleStart = 0;
  let sampleFrames = 0;
  let healthySamples = 0;
  let editor;
  let contextLost = false;
  const targetFPS = () => config.quality.fps === "display" ? 0 : Number(config.quality.fps);

  function schedule() {
    if (!raf && renderer && !contextLost && !document.hidden && (!paused || needsRender)) {
      raf = requestAnimationFrame(frame);
    }
  }

  function resetClock() {
    lastTime = 0;
    lastDraw = -Infinity;
    sampleStart = sampleFrames = healthySamples = 0;
    accumulator = 0;
  }

  function restart(warm = true) {
    elapsed = 0;
    for (const solid of solids) {
      solid.dripCount = solid.dripDye = solid.dripTimer = 0;
      solid.dripping = false;
      solid.glintPower = solid.glintAge = 0;
      solid.recoilX = solid.recoilY = solid.recoilVX = solid.recoilVY = 0;
      solid.recoilAngle = solid.recoilSpin = 0;
    }
    solidsDirty = true;
    if (movingCount || config.recoil.enabled) updateObstacleMotion(elapsed);
    pointer.impulse = false;
    simulation = new Fluid();
    const valid = pointer.valid;
    pointer.valid = false;
    // Show a falling stream immediately while leaving the basin room to fill.
    if (warm) for (let step = 0; step < 32; step++) {
      elapsed += timestep;
      simulation.step(timestep);
    }
    pointer.valid = valid;
    resetClock();
    needsRender = true;
    schedule();
  }

  function frame(now) {
    raf = 0;
    const dt = lastTime ? Math.min(.1, (now - lastTime) / 1000) : 0;
    lastTime = now;
    const fps = targetFPS();
    const period = fps ? 1000 / fps : 0;
    if (!paused) {
      accumulator = Math.min(accumulator + dt, timestep * 4);
      updateCamera();
      mapPointer(dt);
      while (accumulator >= timestep) {
        elapsed += timestep;
        simulation.step(timestep);
        accumulator -= timestep;
      }
    }
    if (needsRender || now - lastDraw >= period - 1.25) {
      if (paused) {
        updateCamera();
        mapPointer(0);
      }
      lastDraw = now;
      needsRender = false;
      try { renderer.draw(); }
      catch (error) {
        console.error(error);
        message.textContent = "Viscous Flow could not render at these settings.";
        message.hidden = false;
        return;
      }
      if (!paused) {
        if (!sampleStart) sampleStart = now;
        sampleFrames++;
        if (now - sampleStart >= 1200) {
          const actual = Math.round((sampleFrames - 1) * 1000 / (now - sampleStart));
          if (config.quality.stats) editor?.setStats(actual + " fps · " + simulation.count + " particles · "
            + Math.round(qualityFactor * 100) + "% adaptive quality");
          if (config.quality.adaptive) {
            const target = fps || 60;
            if (actual < target * .83) {
              qualityFactor = Math.max(.58, qualityFactor - .08);
              healthySamples = 0;
            } else if (actual >= target * .97 && ++healthySamples >= 4) {
              qualityFactor = Math.min(1, qualityFactor + .04);
              healthySamples = 0;
            }
          }
          sampleStart = now;
          sampleFrames = 1;
        }
      }
    }
    schedule();
  }

  function apply(next, path) {
    const newMode = next.view.mode === "3d";
    const changedMode = newMode !== is3D;
    config = next;
    is3D = newMode;
    if (!config.quality.adaptive || !path) qualityFactor = 1;
    if (!config.quality.stats) editor?.setStats("");
    if (path === "quality.fps") resetClock();
    if (!renderer || contextLost) return;
    if (!path || changedMode || path.startsWith("scene.") || path === "recoil.enabled") buildSolids();
    if (path === "wet.enabled" && !config.wet.enabled) {
      for (const solid of solids) solid.wetness = 0;
      solidsDirty = true;
    }
    if (changedMode) restart();
    needsRender = true;
    schedule();
  }

  function track(event) {
    const rect = canvas.getBoundingClientRect();
    pointer.u = 2 * (event.clientX - rect.left) / rect.width - 1;
    pointer.v = 1 - 2 * (event.clientY - rect.top) / rect.height;
    pointer.active = true;
    if (paused) {
      needsRender = true;
      schedule();
    }
  }
  function redrawView() {
    needsRender = true;
    schedule();
  }

  function finishDrag() {
    const completed = drag;
    drag = null;
    if (completed?.rotating) {
      canvas.classList.remove("rotating");
      editor?.commitChanges?.();
    }
    return completed;
  }

  function splash() {
    if (config.interaction.enabled && config.interaction.burst && !paused) pointer.impulse = true;
  }

  function clearPointer() {
    pointer.active = false;
    pointer.impulse = false;
    if (paused) {
      needsRender = true;
      schedule();
    }
  }
  window.addEventListener("pointermove", event => {
    if (drag?.id === event.pointerId) {
      if (!(event.buttons & 1)) {
        finishDrag();
        clearPointer();
        return;
      }
      const dx = event.clientX - drag.x;
      const dy = event.clientY - drag.y;
      if (is3D && (drag.rotating || Math.hypot(dx, dy) >= 4)) {
        drag.rotating = true;
        canvas.classList.add("rotating");
        const yaw = drag.yaw - dx * .3;
        config.view.yaw = ((Math.round(yaw) + 180) % 360 + 360) % 360 - 180;
        config.view.tilt = clamp(Math.round(drag.tilt + dy * .3), ...cameraLimits.tilt);
        clearPointer();
        redrawView();
        return;
      }
    }
    if (event.target === canvas && (event.pointerType !== "touch" || event.buttons)) track(event);
    else clearPointer();
  });
  canvas.addEventListener("pointerdown", event => {
    if (!event.isPrimary || event.button !== 0) return;
    track(event);
    canvas.setPointerCapture(event.pointerId);
    if (event.pointerType === "mouse") {
      drag = { id: event.pointerId, x: event.clientX, y: event.clientY,
        yaw: config.view.yaw, tilt: config.view.tilt, rotating: false };
    } else {
      splash();
    }
  });
  canvas.addEventListener("pointerup", event => {
    if (event.pointerType === "mouse" && event.button === 0 && drag?.id === event.pointerId) {
      const completed = finishDrag();
      track(event);
      if (!completed.rotating) splash();
    }
    if (event.pointerType === "touch") {
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      // Let the next simulation step consume even a very quick tap.
      if (pointer.impulse) setTimeout(clearPointer, 90);
      else clearPointer();
    }
  });
  canvas.addEventListener("wheel", event => {
    event.preventDefault();
    const pixels = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? canvas.clientHeight : 1);
    const zoom = clamp(config.view.zoom * Math.exp(-pixels * .0015), ...cameraLimits.zoom);
    if (zoom === config.view.zoom) return;
    config.view.zoom = zoom;
    editor?.commitChanges?.();
    redrawView();
  }, { passive: false });
  canvas.addEventListener("pointercancel", event => {
    if (drag?.id === event.pointerId) finishDrag();
    clearPointer();
  });
  canvas.addEventListener("lostpointercapture", event => {
    if (drag?.id !== event.pointerId) return;
    finishDrag();
    clearPointer();
  });
  canvas.addEventListener("pointerleave", event => {
    if (event.pointerType !== "touch") clearPointer();
  });
  window.addEventListener("blur", () => {
    finishDrag();
    clearPointer();
  });
  window.addEventListener("resize", () => {
    needsRender = true;
    schedule();
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      cancelAnimationFrame(raf);
      raf = 0;
      finishDrag();
      clearPointer();
    }
    resetClock();
    schedule();
  });

  function setup() {
    try {
      renderer = new Renderer();
      buildSolids();
      restart();
      message.hidden = true;
    } catch (error) {
      console.error(error);
      renderer = null;
      message.textContent = "Viscous Flow could not start the WebGL renderer.";
      message.hidden = false;
    }
  }
  function loadSettingsEditor() {
    const script = document.createElement("script");
    script.src = "./settings-editor.js";
    script.addEventListener("load", () => {
      if (typeof window.createSettingsEditor !== "function") return;
      editor = window.createSettingsEditor({
        root: document.querySelector("#editor"),
        defaults: settings,
        presets,
        sections,
        storageKey: "viscous-cascade-v1",
        onChange: apply,
        onRestart: () => { if (renderer && !contextLost) restart(false); },
        onPause: value => {
          paused = value;
          resetClock();
          needsRender = true;
          schedule();
        }
      });
      apply(editor.config, null);
    }, { once: true });
    document.head.append(script);
  }

  if (settings.editor.enabled) loadSettingsEditor();
  if (!gl) {
    message.textContent = "Viscous Flow requires WebGL 2.";
    message.hidden = false;
    return;
  }
  canvas.addEventListener("webglcontextlost", event => {
    event.preventDefault();
    contextLost = true;
    cancelAnimationFrame(raf);
    raf = 0;
    message.textContent = "The WebGL context was interrupted. Waiting for it to recover…";
    message.hidden = false;
  });
  canvas.addEventListener("webglcontextrestored", () => {
    contextLost = false;
    setup();
  });
  setup();
})();
</script>
</body>
</html>
