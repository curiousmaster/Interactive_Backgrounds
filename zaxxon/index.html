  sky.position.copy(render.camera.position);
  sky.material.uniforms.time.value = now / 1000;
  sky.material.uniforms.clouds.value = Number(config.features.nebula);
  sun.target.position.set(0, 0, p.z - 9);
  sun.position.copy(sun.target.position).add(new T.Vector3(-10, 27, 7));
  pulse.position.copy(p);
  const flash = config.visual.reducedFlash ? 0 : 60 * Math.max(cooldown, 0);
  pulse.intensity = config.features.lighting ? 15 + flash : 0;
  canopy.visible = !config.visual.damageFx || config.visual.reducedFlash || damage <= 0 || tick % 12 < 8;
  bloom.enabled = config.features.bloom;
  bloom.strength = config.features.intensity;
  bloom.radius = config.features.radius;
  bloom.threshold = config.features.threshold;
  let ahead;
  for (const { hp, object } of obstacles) {
    const z = object.position.z;
    if (hp && z < p.z && z > (ahead?.position.z ?? p.z - 25)
        && Math.abs(p.x - object.position.x) < object.scale.x / 2 + 0.45) ahead = object;
  }
  hud.textContent = `Fuel ${Math.max(0, Math.ceil(fuel))}% · Score ${score} · Alt ${p.y.toFixed(1)} · `
    + `Seed ${seed} · ${config.visual.camera} · Level ${level} · Shield ${Math.ceil(shieldCharge)}%`
    + (config.game.autopilot || (config.game.idleAutopilot && tick - lastInput > 600) ? ' · AUTO' : '')
    + (tick < spaceUntil ? ` · Arrival ${Math.ceil((spaceUntil - tick) / 60)}s` : '')
    + (tick < bonusUntil ? ` · ${bonusLabel}` : '')
    + (ahead && config.visual.clearance
      ? ` · Obstacle top ${(ahead.position.y + ahead.scale.y / 2).toFixed(1)}` : '');
  clearance.hidden = !ahead || !config.visual.clearance;
  if (!clearance.hidden) {
    const limit = ahead.position.y + ahead.scale.y / 2 + 0.45;
    clearance.firstElementChild.style.height = Math.min(100, limit * 10) + '%';
    clearance.lastElementChild.style.bottom = p.y * 10 + '%';
  }
  composer.render();
});
</script>
</html>
