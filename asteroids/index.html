<script>

const clamp = (v,a,b) => Math.min(b,Math.max(a,v));

const delta = (v,size) => wrap(v + size/2,size) - size/2;

  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }

const presets = {

const sections = [

    { path: "graphics.nebulaSpeed", label: "Nebula animation speed", type: "range", min: 0, max: 3, step: 0.05, unit: "×", help: "Set to zero to hold the clouds still.", when: s => s.graphics.nebula && s.graphics.style === "Advanced" && !s.graphics.transparent },
    { path: "graphics.glow", label: "Engine and impact glow", type: "boolean" },
    { path: "graphics.trails", label: "Engine trails", type: "boolean" },
    { path: "graphics.quiet", label: "Quiet region in center", type: "boolean" },

    { path: "scoreboard.align", label: "Alignment", type: "select", options: {"left": "Left", "center": "Center", "right": "Right"}, when: s => s.scoreboard.enabled },
    { path: "scoreboard.opacity", label: "Opacity", type: "range", min: 0.2, max: 1, step: 0.05, when: s => s.scoreboard.enabled },
    { path: "scoreboard.scale", label: "Scale", type: "range", min: 0.65, max: 1.5, step: 0.05, when: s => s.scoreboard.enabled },
    { path: "scoreboard.color", label: "Color", type: "color", when: s => s.scoreboard.enabled },
    { path: "scoreboard.showScore", label: "Score", type: "boolean", when: s => s.scoreboard.enabled },
    { path: "scoreboard.showBest", label: "Best", type: "boolean", when: s => s.scoreboard.enabled },
    { path: "scoreboard.showWave", label: "Wave", type: "boolean", when: s => s.scoreboard.enabled },
    { path: "scoreboard.showLives", label: "Lives", type: "boolean", when: s => s.scoreboard.enabled },
    { path: "scoreboard.showPilot", label: "Pilot", type: "boolean", when: s => s.scoreboard.enabled },
    { path: "scoreboard.radar", label: "Radar", type: "boolean", when: s => s.scoreboard.enabled },

    { label: "Asteroid shadows", fields: [
      { path: "features.shadows.enabled", label: "Cast asteroid shadows", type: "boolean", help: "Nearby asteroids block directional light. Shaded surfaces are visible in Advanced style." },
      { path: "features.shadows.amount", label: "Shadow strength", type: "range", min: 0, max: 1, step: 0.01, when: s => s.features.shadows.enabled },
    ] },
    { label: "Bloom", fields: [
      { path: "features.bloom.enabled", label: "Enable bloom", type: "boolean" },
      { path: "features.bloom.amount", label: "Intensity", type: "range", min: 0, max: 2, step: 0.01, when: s => s.features.bloom.enabled },
      { path: "features.bloom.radius", label: "Radius", type: "range", min: 2, max: 32, step: 1, unit: " px", when: s => s.features.bloom.enabled },
      { path: "features.bloom.threshold", label: "Brightness threshold", type: "range", min: 0.1, max: 0.95, step: 0.01, when: s => s.features.bloom.enabled },

      { path: "features.explosions.amount", label: "Explosion intensity", type: "range", min: 0.1, max: 1, step: 0.01, when: s => s.features.explosions.enabled },
    ] },
    { label: "Aurora ribbons", fields: [
      { path: "features.aurora.enabled", label: "Enable aurora ribbons", type: "boolean", help: "Layered, moving curtains of ionized gas. Visible with the opaque sky." },
      { path: "features.aurora.amount", label: "Brightness", type: "range", min: 0.1, max: 1, step: 0.01, when: s => s.features.aurora.enabled },
    ] },
    { label: "Meteor showers", fields: [
      { path: "features.meteors.enabled", label: "Enable meteor showers", type: "boolean", help: "Distant streaks cross the opaque sky in short bursts." },
      { path: "features.meteors.amount", label: "Density", type: "range", min: 0.1, max: 1, step: 0.01, when: s => s.features.meteors.enabled },
    ] },
    { label: "Eclipsed star", fields: [
      { path: "features.eclipse.enabled", label: "Enable eclipsed star", type: "boolean", help: "A dark stellar disc edged by a hot corona. Visible with the opaque sky." },
      { path: "features.eclipse.amount", label: "Corona intensity", type: "range", min: 0.1, max: 1, step: 0.01, when: s => s.features.eclipse.enabled },
    ] },
    { label: "Navigation grid", fields: [
      { path: "features.grid.enabled", label: "Enable navigation grid", type: "boolean", help: "A projected coordinate grid tracks the playfield in 2D and 3D." },
      { path: "features.grid.amount", label: "Opacity", type: "range", min: 0.1, max: 1, step: 0.01, when: s => s.features.grid.enabled },
    ] },
    { label: "Shield shimmer", fields: [
      { path: "features.shield.enabled", label: "Enable shield shimmer", type: "boolean", help: "Animated arcs surround the ship during respawn or hyperspace protection." },
      { path: "features.shield.amount", label: "Brightness", type: "range", min: 0.1, max: 1, step: 0.01, when: s => s.features.shield.enabled },
    ] },
    { label: "Plasma tracers", fields: [
      { path: "features.tracers.enabled", label: "Enable plasma tracers", type: "boolean", help: "Shots leave a fading, color-matched plasma wake." },
      { path: "features.tracers.amount", label: "Length", type: "range", min: 0.1, max: 1, step: 0.01, when: s => s.features.tracers.enabled },
    ] },
    { label: "Impact fissures", fields: [
      { path: "features.fissures.enabled", label: "Enable impact fissures", type: "boolean", help: "Freshly split asteroid fragments cool from bright fracture lines." },
      { path: "features.fissures.amount", label: "Brightness", type: "range", min: 0.1, max: 1, step: 0.01, when: s => s.features.fissures.enabled },
    ] },
    { label: "Double shockwaves", fields: [
      { path: "features.shockwaves.enabled", label: "Enable double shockwaves", type: "boolean", help: "A second expanding wave follows impacts, jumps, and ship destruction." },

      { path: "features.cometTail.amount", label: "Length", type: "range", min: 0.1, max: 1, step: 0.01, when: s => s.features.cometTail.enabled },

const legacyPaths = {
  "view": "view.mode",
  "graphics": "graphics.style",
  "hud": "scoreboard.enabled",
  "tilt": "view.tilt",
  "zoom": "view.zoom",
  "orbit": "view.orbit",
  "transparent": "graphics.transparent",
  "nebula": "graphics.nebula",
  "glow": "graphics.glow",
  "trails": "graphics.trails",
  "quiet": "graphics.quiet",
  "quality": "graphics.quality",
  "align": "scoreboard.align",
  "opacity": "scoreboard.opacity",
  "scale": "scoreboard.scale",
  "color": "scoreboard.color",
  "showScore": "scoreboard.showScore",
  "showBest": "scoreboard.showBest",
  "showWave": "scoreboard.showWave",
  "showLives": "scoreboard.showLives",
  "showPilot": "scoreboard.showPilot",
  "radar": "scoreboard.radar",
  "director": "gameplay.director",
  "ufo": "gameplay.ufo",
  "idle": "gameplay.idle"
};

function migrateSettings(input) {
  if (!input || typeof input !== 'object' || Array.isArray(input)) return input;
  const migrated = { ...input };
  for (const [key, path] of Object.entries(legacyPaths)) {
    const value = input[key];
    if (!Object.hasOwn(input, key) || value === null || typeof value === 'object') continue;
    const [section, field] = path.split('.');
    if (migrated[section] === input[section]) {
      migrated[section] = typeof input[section] === 'object' ? { ...input[section] } : {};
    }
    if (!Object.hasOwn(migrated[section], field)) migrated[section][field] = value;
  }
  return migrated;
}

let config = settings;

function featureAmount(name) {
  const feature = config.features[name];
  return feature.enabled ? feature.amount : 0;
}
let editor;

function applySettings(next) {
  config = next;
  document.body.classList.toggle('clear', config.graphics.transparent);
}

function loadSettingsEditor() {
  const script = document.createElement('script');
  script.src = './settings-editor.js';
  script.addEventListener('load', () => {
    editor = window.createSettingsEditor({
      root: $('editor'),
      title: 'Asteroids — Deep Field',
      restartLabel: 'Restart game',
      defaults: settings,
      presets,
      sections,
      storageKey: 'deep-field-settings',
      migrate: migrateSettings,
      initiallyPaused: paused,
      initiallyOpen: false,
      onChange: applySettings,
      onRestart: resetRound,
      onPause: setPause
    });
    $('controls').insertBefore($('editor').querySelector('.settings-open'), $('hint'));
    applySettings(editor.config);
  }, { once: true });
  document.head.append(script);
}

applySettings(settings);

const canvas=$('space');
const gl=canvas.getContext('webgl',{alpha:true,premultipliedAlpha:true,antialias:true});
function fail(message) { $('error').textContent=message; $('error').hidden=false; }
function program(vertex,fragment) {
  const p=gl.createProgram();
  for(const [type,source] of [[gl.VERTEX_SHADER,vertex],[gl.FRAGMENT_SHADER,fragment]]) {
    const shader=gl.createShader(type);
    gl.shaderSource(shader,source); gl.compileShader(shader);
    if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS)) throw Error(gl.getShaderInfoLog(shader));
    gl.attachShader(p,shader); gl.deleteShader(shader);
  }
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw Error(gl.getProgramInfoLog(p));
  return p;
}
const skyVertex=`
attribute vec2 position;
varying vec2 uv;
void main(){uv=position*.5+.5;gl_Position=vec4(position,0.,1.);}
`;
const skyFragment=`
precision highp float;
varying vec2 uv;
uniform float aspect,time,advanced,quiet,nebula,nebulaPhase,aurora,meteors,eclipse;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){
 vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
 return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);
}
float cloud(vec2 p){
 float n=0.,a=.5;
 for(int i=0;i<5;i++){n+=noise(p)*a;p=mat2(1.7,-1.1,1.1,1.7)*p+5.;a*=.5;}
 return n;
}
vec3 stars(vec2 p,float grid,float seed){
 vec2 g=p*grid,i=floor(g),f=fract(g);
 float r=hash(i+seed), g2=hash(i+seed+83.);
 vec2 d=f-mix(vec2(.25),vec2(.75),vec2(r,g2));
 float glow=exp(-dot(d,d)*510.)*step(.72,r);
 float core=exp(-dot(d,d)*2500.);
 float flare=(exp(-abs(d.x)*145.-abs(d.y)*14.)+exp(-abs(d.y)*145.-abs(d.x)*14.))*step(.985,r);
 return mix(vec3(.34,.66,1.),vec3(1.,.69,.48),g2)*(glow*.37+core*glow*.65+flare*.35)*(.84+.16*sin(time*.85+r*34.));
}
void main(){
 vec2 p=(uv-.5)*vec2(aspect,1.);
 vec3 color=mix(vec3(.006,.011,.028),vec3(.004,.008,.018),1.-advanced);
 color+=stars(p+vec2(time*.00065,0),63.,6.)*.75+stars(p-vec2(time*.0012,0),117.,47.)*.52;

  }
  const shadow=featureAmount('shadows');
  const light=(a,b,z)=>rockLight(r,x+r.r*(a*cos-b*sin),y+r.r*(a*sin+b*cos),z*r.r,shadow);
  const edgeLight=r.ring.map(([a,b,z])=>light(a,b,z));
  const innerLight=r.ring.map(([a,b,z])=>light(a*.54,b*.54,.48+z*.43));
  const peakLight=light(-.09,-.11,.64);
  const shaded=(a,b,c,color,l1,l2,l3)=>{
    vertex(a,color.map(v=>v*l1),1);
    vertex(b,color.map(v=>v*l2),1);
    vertex(c,color.map(v=>v*l3),1);
  };
  const inner=r.ring.map(([a,b,z])=>local(a*.54,b*.54,.48+z*.43));
  const peak=local(-.09,-.11,.64);
  for(let i=0;i<edge.length;i++){
    const j=(i+1)%edge.length;
    const a=i*TAU/edge.length+r.a;
    const lit=.5+.5*Math.cos(a+2.25);
    const irregular=.86+.14*Math.sin(i*8.7+r.phase);
    const surface=[.095+lit*.27,.12+lit*.24,.18+lit*.25].map(c=>c*irregular);
    const top=surface.map(c=>c*1.24);
    shaded(edge[i],edge[j],inner[j],surface,edgeLight[i],edgeLight[j],innerLight[j]);
    shaded(edge[i],inner[j],inner[i],surface.map(c=>c*.78),edgeLight[i],innerLight[j],innerLight[i]);
    shaded(inner[i],inner[j],peak,top,innerLight[i],innerLight[j],peakLight);
    if(lit>.61)line(edge[i],edge[j],r.comet?cyan:[.81,.66,.63],lit*.62*Math.min(edgeLight[i],edgeLight[j]),1.4);
    if(i%3===0)line(inner[i],peak,[.62,.52,.64],.25,.8);
  }
  for(const [a,b,d] of r.craters){
    const contour=Array.from({length:7},(_,i)=>local(a+Math.cos(i*TAU/7)*d,b+Math.sin(i*TAU/7)*d,.61));
    const center=local(a,b,.61);
    contour.forEach((p,i)=>triangle(p,contour[(i+1)%7],center,[.045,.049,.088],.48));
    loop(contour,[.68,.60,.68],.27,.8);
  }
  if(fracture)drawFissures(local,fracture);
  if(r.comet)halo(project(x,y),38,cyan,.37);
}
function drawShip(x,y) {
  const a=ship.a,dx=Math.cos(a),dy=Math.sin(a);
  const local=(f,s,z=0)=>project(x+dx*f-dy*s,y+dy*f+dx*s,z);
  const nose=local(21,0,2),left=local(-13,-12),right=local(-13,12);
  const tail=local(-8,0),ridge=local(-3,0,8);
  halo(tail,ship.thrust?30:16,cyan,ship.thrust?.36:.16);
  if(advanced()){
    triangle(nose,left,ridge,[.20,.57,.74]);
    triangle(nose,right,ridge,[.10,.23,.42]);
    triangle(left,ridge,tail,[.12,.35,.51]);
    triangle(right,ridge,tail,[.07,.16,.28]);
    line(local(9,0,5),ridge,[.75,.97,1],.96,2.3);
  }
  loop([nose,left,tail,right],cyan,.97,1.6);
  if(ship.thrust)loop([local(-9,-4),local(-23-5*Math.sin(time*31),0),local(-9,4)],amber,.89,1.35);
  const shield=featureAmount('shield');
  if(ship.safe>0&&shield){
    const spin=reduced.matches?0:time*2.4;
    for(let i=0;i<3;i++){
      const arc=spin+i*TAU/3;
      for(let j=0;j<8;j++){
        const a=arc+j*.16,b=a+.16;
        line(local(29*Math.cos(a),29*Math.sin(a),2),local(29*Math.cos(b),29*Math.sin(b),2),cyan,shield*(j+1)/8,1.45);
      }
    }
  }
  if(ship.safe>0&&advanced()){
    const points=Array.from({length:24},(_,i)=>local(27*Math.cos(i*TAU/24),27*Math.sin(i*TAU/24)));
    loop(points,cyan,.23,1);
  }
}
function drawUfo(x,y) {
  const points=Array.from({length:16},(_,i)=>project(x+Math.cos(i*TAU/16)*23,y+Math.sin(i*TAU/16)*8,3));
  const center=project(x,y,3);
  if(advanced())points.forEach((p,i)=>triangle(center,p,points[(i+1)%16],[.35,.12,.28],.95));
  loop(points,pink,.9,1.3);
  line(project(x-12,y,7),project(x+12,y,7),pink,.92,2);
  halo(center,29,pink,.26);
}
function locations(p,attributes,uniforms) {
  return {
    p,
    ...Object.fromEntries(attributes.map(key=>[key,gl.getAttribLocation(p,key)])),
    ...Object.fromEntries(uniforms.map(key=>[key,gl.getUniformLocation(p,key)]))
  };
}
function drawFissures(local,amount) {
  const crack=[[-.64,.32],[-.29,.12],[-.19,-.11],[.07,.02],[.22,-.21],[.55,-.38]];
  const points=crack.map(([x,y])=>local(x,y,.68));
  points.slice(1).forEach((p,i)=>line(points[i],p,amber,amount,1.55));
  line(points[2],local(-.47,-.38,.61),amber,amount*.65,1.1);
}

function drawGrid(amount) {
  if(!amount)return;
  const color=[.24,.55,.72];
  for(let i=0;i<=12;i++){
    const x=i*W/12;
    line(project(x,0,-8),project(x,H,-8),color,amount*(i===6?.51:.27),1);
  }
  for(let i=0;i<=8;i++){
    const y=i*H/8;
    line(project(0,y,-8),project(W,y,-8),color,amount*(i===4?.51:.27),1);
  }
}

function drawCometTail(r,x,y,amount) {
  const speed=Math.hypot(r.vx,r.vy);
  const dx=r.vx/speed,dy=r.vy/speed;
  const end=95+amount*170;
  const head=project(x,y,0);
  for(let i=0;i<5;i++){
    const spread=(i-2)*8;
    const tip=project(x-dx*end-dy*spread,y-dy*end+dx*spread,-3);
    const shoulder=project(x-dx*45+dy*spread,y-dy*45-dx*spread,0);
    vertex(head,cyan,amount*.37);
    vertex(shoulder,[.18,.56,1],amount*.14);
    vertex(tip,cyan,0);
  }
}

function drawTargetLock(amount) {
  if(!amount||manual||ship.dead>0)return;
  const [target]=nearest(ship);
  if(!target)return;
  const radius=target.r*1.28+7;
  tiles(target,radius,(x,y)=>{
    for(let i=0;i<8;i++){
      const a=i*TAU/8,b=a+.39;
      line(project(x+Math.cos(a)*radius,y+Math.sin(a)*radius),
           project(x+Math.cos(b)*radius,y+Math.sin(b)*radius),amber,amount,1.25);
    }
    const tx=x+target.vx*.24,ty=y+target.vy*.24;
    line(project(tx-5,ty),project(tx+5,ty),amber,amount,1.1);
    line(project(tx,ty-5),project(tx,ty+5),amber,amount,1.1);
  });
}

function drawBlasts() {
  const amount=featureAmount('explosions');
  if(!amount||reduced.matches)return;
  for(const blast of blasts)tiles(blast,blast.radius*1.6,(x,y)=>{
    const age=time-blast.started;
    const flash=Math.max(0,1-age/.19);
    const scale=canvas.clientWidth/W;
    const center=project(x,y);
    halo(center,(blast.radius*.60+age*80)*scale,blast.color,flash*amount*.85,true);
    halo(center,(12+age*29)*scale,[1,.97,.82],flash*amount,true);
    for(let layer=0;layer<3;layer++){
      const progress=(age-layer*.058)/(.70-layer*.10);
      if(progress<0||progress>=1)continue;
      const radius=blast.radius*(.12+progress*(1.45-layer*.24));
      const ring=Array.from({length:36},(_,i)=>{
        const a=i*TAU/36;
        const ripple=radius*(1+.035*Math.sin(a*7+blast.angle+layer));
        return project(x+Math.cos(a)*ripple,y+Math.sin(a)*ripple,layer*3);
      });
      loop(ring,layer===0?[1,.87,.63]:blast.color,amount*(1-progress)**2,layer===0?2.1:1.1);
    }
  });
}

function bindBloomTarget() {
  if(!featureAmount('bloom'))return false;
  const width=canvas.width,height=canvas.height;
  if(width!==bloomTarget.width||height!==bloomTarget.height){
    Object.assign(bloomTarget,{width,height});
    gl.bindTexture(gl.TEXTURE_2D,bloomTarget.texture);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,width,height,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
    gl.bindFramebuffer(gl.FRAMEBUFFER,bloomTarget.framebuffer);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,bloomTarget.texture,0);
    bloomTarget.ready=gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE;
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,bloomTarget.ready?bloomTarget.framebuffer:null);
  return bloomTarget.ready;
}

function compositeBloom() {
  const options=config.features.bloom;
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.disable(gl.BLEND);
  gl.useProgram(bloomProgram.p);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D,bloomTarget.texture);
  gl.uniform1i(bloomProgram.image,0);
  gl.uniform2f(bloomProgram.stride,options.radius/(2*canvas.clientWidth),options.radius/(2*canvas.clientHeight));
  gl.uniform1f(bloomProgram.threshold,options.threshold);
  gl.uniform1f(bloomProgram.strength,options.amount);
  gl.bindBuffer(gl.ARRAY_BUFFER,screenBuffer);
  gl.enableVertexAttribArray(bloomProgram.position);
  gl.vertexAttribPointer(bloomProgram.position,2,gl.FLOAT,false,0,0);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.disableVertexAttribArray(bloomProgram.position);
}

function draw() {
  const bloom=bindBloomTarget();
  gl.disable(gl.BLEND);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
  if(!config.graphics.transparent){
    gl.useProgram(sky.p);gl.bindBuffer(gl.ARRAY_BUFFER,screenBuffer);
    gl.enableVertexAttribArray(sky.position);gl.vertexAttribPointer(sky.position,2,gl.FLOAT,false,0,0);
    gl.uniform1f(sky.aspect,canvas.width/canvas.height);
    gl.uniform1f(sky.time,reduced.matches?0:time);
    gl.uniform1f(sky.advanced,Number(advanced()));
    gl.uniform1f(sky.nebulaPhase,nebulaPhase);
    gl.uniform1f(sky.nebula,Number(advanced()&&config.graphics.nebula));
    gl.uniform1f(sky.quiet,Number(config.graphics.quiet));
    gl.uniform1f(sky.aurora,featureAmount('aurora'));
    gl.uniform1f(sky.meteors,reduced.matches?0:featureAmount('meteors'));
    gl.uniform1f(sky.eclipse,featureAmount('eclipse'));
    gl.drawArrays(gl.TRIANGLES,0,3);
    gl.disableVertexAttribArray(sky.position);
  }
  vertices.length=0;
  drawGrid(featureAmount('grid'));
  for(const d of dust)tiles(d,d.ring?90:12,(x,y)=>{
    const alpha=d.life/d.max;
    if(d.ring){
      const size=12+(1-alpha)*66;
      const ring=Array.from({length:24},(_,i)=>project(x+size*Math.cos(i*TAU/24),y+size*Math.sin(i*TAU/24)));
      loop(ring,d.color,alpha*.43,1.2);
      const echo=featureAmount('shockwaves');
      if(echo&&alpha<.78){
        const radius=size*.68;
        const ripple=Array.from({length:24},(_,i)=>project(x+radius*Math.cos(i*TAU/24),y+radius*Math.sin(i*TAU/24)));
        loop(ripple,d.color,Math.sin(alpha/.78*Math.PI)*echo*.62,1.7);
      }
    }else{
      const p=project(x,y);
      line(p,project(x-d.vx*.033-d.size,y-d.vy*.033),d.color,alpha*.83,d.size);
    }
  });
  const tail=featureAmount('cometTail');
  for(const r of rocks){
    if(r.comet&&tail)tiles(r,100+tail*170,(x,y)=>drawCometTail(r,x,y,tail));
    tiles(r,r.r*1.3,(x,y)=>drawRock(r,x,y));
  }
  drawBlasts();
  drawTargetLock(featureAmount('targeting'));
  if(rival)tiles(rival,30,drawUfo);
  if(ship.dead<=0)tiles(ship,36,drawShip);
  const tracer=featureAmount('tracers');
  for(const b of shots)tiles(b,34+tracer*84,(x,y)=>{
    const color=b.owner==='rival'?pink:cyan;
    const p=project(x,y);
    halo(p,12,color,.62);
    if(tracer){
      const speed=Math.hypot(b.vx,b.vy);
      const ux=b.vx/speed,uy=b.vy/speed;
      const length=24+tracer*82;
      vertex(project(x-uy*4,y+ux*4),color,tracer*.54);
      vertex(project(x+uy*4,y-ux*4),color,tracer*.54);
      vertex(project(x-ux*length,y-uy*length),color,0);
    }
    line(p,project(x-b.vx*.035,y-b.vy*.035),color,.93,2);
  });
  gl.useProgram(mesh.p);
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  gl.bindBuffer(gl.ARRAY_BUFFER,meshBuffer);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(vertices),gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(mesh.position);gl.vertexAttribPointer(mesh.position,2,gl.FLOAT,false,24,0);
  gl.enableVertexAttribArray(mesh.color);gl.vertexAttribPointer(mesh.color,4,gl.FLOAT,false,24,8);
  gl.drawArrays(gl.TRIANGLES,0,vertices.length/6);
  gl.disableVertexAttribArray(mesh.position);gl.disableVertexAttribArray(mesh.color);
  if(bloom)compositeBloom();
}
function updateHud() {
  const hud=$('hud');
  hud.hidden=!config.scoreboard.enabled;
  if(hud.hidden)return;
  hud.style.opacity=config.scoreboard.opacity;
  hud.style.color=config.scoreboard.color;
  hud.style.justifyContent={left:'flex-start',center:'center',right:'flex-end'}[config.scoreboard.align];
  hud.style.setProperty('--hud-scale',config.scoreboard.scale);
  const data={Score:String(score).padStart(5,'0'),Best:String(records[manual?'player':'auto']).padStart(5,'0'),Wave:String(wave).padStart(2,'0'),Lives:lives,Pilot:manual?'PLAYER':'AUTO'};
  const metrics=Object.entries(data).filter(([key])=>config.scoreboard['show'+key]);
  const cache=JSON.stringify([metrics,config.scoreboard.radar]);
  if(cache!==hudCache){
    hudCache=cache;hud.replaceChildren();
    for(const [name,value] of metrics){
      const block=document.createElement('div'),label=document.createElement('small'),number=document.createElement('b');
      label.textContent=name.toUpperCase();number.textContent=value;
      block.append(label,number);hud.append(block);
    }
    if(config.scoreboard.radar){
      const radar=document.createElement('canvas');
      radar.id='radar';radar.width=112;radar.height=62;
      radar.setAttribute('aria-label','Nearby asteroid radar');hud.append(radar);
    }
  }
  const radar=$('radar');
  if(!radar)return;
  const ctx=radar.getContext('2d');
  if(!ctx)return;
  ctx.clearRect(0,0,112,62);
  ctx.strokeStyle='#456980';ctx.beginPath();ctx.ellipse(56,31,38,23,0,0,TAU);ctx.stroke();
  const [threat]=nearest(ship,.4);
  for(const r of rocks){
    const dx=delta(r.x-ship.x,W)*.145,dy=delta(r.y-ship.y,H)*.145;
    if(Math.abs(dx)>53||Math.abs(dy)>29)continue;
    ctx.fillStyle=r===threat?'#ff9679':'#83c7ea';ctx.fillRect(56+dx,31+dy,3,3);
    if(r===threat){
      ctx.strokeStyle='#ff967999';ctx.beginPath();ctx.moveTo(57+dx,32+dy);
      ctx.lineTo(57+dx+(r.vx-ship.vx)*.12,32+dy+(r.vy-ship.vy)*.12);ctx.stroke();
    }
  }
  ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(56,31);
  ctx.lineTo(56+Math.cos(ship.a)*10,31+Math.sin(ship.a)*10);ctx.stroke();
}
function frame(now) {
  resize();
  if(!paused&&previous){
    accumulator+=Math.min(.05,(now-previous)/1000);
    while(accumulator>=1/120){step(1/120);accumulator-=1/120;}
  }
  previous=now;
  draw();updateHud();
  requestAnimationFrame(frame);
}
try {
  if(!gl)throw Error('WebGL is unavailable. Enable hardware acceleration or try another browser.');
  sky=locations(program(skyVertex,skyFragment),['position'],['aspect','time','advanced','quiet','nebula','nebulaPhase','aurora','meteors','eclipse']);
  mesh=locations(program(meshVertex,meshFragment),['position','color'],[]);
  bloomProgram=locations(program(skyVertex,bloomFragment),['position'],['image','stride','threshold','strength']);
  bloomTarget.framebuffer=gl.createFramebuffer();
  bloomTarget.texture=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,bloomTarget.texture);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  screenBuffer=gl.createBuffer();meshBuffer=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,screenBuffer);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();fail('WebGL rendering was interrupted. Reload to resume.');});
  resize();
  resetRound();
  if (settings.editor.enabled) loadSettingsEditor();
  requestAnimationFrame(frame);
} catch(error) {
  console.error(error);
  fail(error.message);
}
</script>
</body>
