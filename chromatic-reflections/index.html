 for(const phi of [0,Math.PI/2]){let prev=null;
  for(let i=0;i<=112;i++){const a=i*TAU/112,now=V(ch.ratio*Math.sin(a)*Math.cos(phi),Math.cos(a),ch.ratio*Math.sin(a)*Math.sin(phi));
   if(prev)shellLine(out,ch,prev,now,color,opacity*1.7,cfg.lighting.boundaryGlow?1.55:1.1);prev=now;}}
 if(cfg.features.livingBoundary.enabled&&cfg.features.livingBoundary.refraction>0){const glass=cfg.features.livingBoundary.refraction;
  ring3(out,ch,V(),ch.ratio*.98,1,[.27,.49,1],opacity*glass*.23,2);}}
function drawConfocalGuides(out,ch){
 if(!(cfg.features.confocalGuides||cfg.geometry.type==='confocal'))return;
 const col=rgb(cfg.colors.boundary),count=cfg.features.guideCount;
 for(let layer=1;layer<=count;layer++){
  const a=ch.c+(1-ch.c)*layer/(count+1),b=Math.sqrt(Math.max(0,a*a-ch.c*ch.c));
  if(b<.005)continue;
  for(let j=0;j<6;j++){const phi=TAU*j/6;let last=null;
   for(let i=0;i<=36;i++){const theta=Math.PI*i/36,pt=project(ch,V(b*Math.sin(theta)*Math.cos(phi),a*Math.cos(theta),b*Math.sin(theta)*Math.sin(phi)));
    if(last)line(out,last,pt,col,.11,.6);last=pt;}}
 }
}
function makeOverlay(out,dots){const color=rgb(cfg.colors.boundary);
 for(const ch of chambers){drawShell(out,ch);drawConfocalGuides(out,ch);
  if(cfg.features.axes){
   const axisCol=rgb(cfg.colors.boundary);
   for(const [a,b] of [[V(0,-1.08,0),V(0,1.08,0)],[V(-ch.ratio*1.08,0,0),V(ch.ratio*1.08,0,0)],[V(0,0,-ch.ratio*1.08),V(0,0,ch.ratio*1.08)]])
    line(out,project(ch,a),project(ch,b),axisCol,.27,.8);
  }
  if(cfg.geometry.showFoci){for(const [i,y]of (ch.c>1e-6?[[-1,-ch.c],[1,ch.c]]:[[0,0]])){
    const v=V(0,y,0),p=project(ch,v),warm=i<=0,fc=rgb(warm?cfg.colors.focusA:cfg.colors.focusB);
    const f=cfg.features.focusCores,size=f.enabled?f.size:1,pulse=(f.enabled?1+Math.sin(clock*3+i)*f.pulse:1)*
      (cfg.features.focusPulse?1+.13*Math.sin(clock*4+i*1.7):1);
    if(cfg.lighting.focusGlow)point(dots,p,fc,.65*size,32*size*pulse);
    point(dots,p,[1,1,1],.94,6.2*size*pulse);ring(out,p,5*size*pulse,fc,.8,1.15);}}
  if(cfg.features.haze.enabled){const f=cfg.features.haze;
   for(let i=0;i<Math.round(180*f.density);i++){
    const y=rand(i*3+2)*1.9-.95,ang=rand(i*4+17)*TAU,rr=Math.sqrt(rand(i*7+54))*.85*ch.ratio*Math.sqrt(1-y*y),p=project(ch,V(rr*Math.cos(ang),y,rr*Math.sin(ang)));
    const shade=clamp(1+f.depthFade*p.depth*.5,.4,1.4);
    point(dots,p,[.12,.24,.65],f.brightness*.14*shade,10+rand(i+5)*23);}}
 }
 for(const p of particles){const ch=chambers[p.chamberId],pos=project(ch,p);
  if(cfg.particles.showBodies){const shade=clamp(1+pos.depth*.22,.5,1.4);point(dots,pos,particleColor(p),.8*shade,cfg.particles.size*5*pos.per);
   point(dots,pos,[1,1,1],.9,cfg.particles.size*1.65*pos.per);}
  if(cfg.features.directionMarkers){const direction=norm(V(p.vx,p.vy,p.vz));
   const behind=project(ch,sub(V(p.x,p.y,p.z),mul(direction,.065)));
   line(out,behind,pos,particleColor(p),.9,1.8);point(dots,pos,[1,1,1],.8,3);}}
 if(cursor&&cfg.interaction.enabled&&cfg.interaction.showAim){ring(out,cursor,9,[.65,.9,1],.75,1.4);}
 if(cfg.features.endpointFlashes)for(const flash of flashes){const p=project(chambers[flash.ch],flash.p);point(dots,p,flash.color,.8*flash.life/.6,18*flash.life/.6+4)}
 if(cfg.features.shockwaves.enabled){const f=cfg.features.shockwaves;
  for(const wave of waves){const ch=chambers[wave.ch],r=wave.age*f.waveSpeed,alpha=f.intensity*Math.exp(-wave.age*f.decay*2)*(1-r/Math.max(.1,f.waveRadius));
   if(r>0&&alpha>.01){for(let axis=0;axis<3;axis++){
    let prev=null;for(let i=0;i<=64;i++){
     const angle=TAU*i/64,distorted=r*(1+f.distortion*.14*Math.sin(angle*7-wave.age*19+axis));let pp;
     if(axis===0)pp=add(wave.p,V(distorted*Math.cos(angle),distorted*Math.sin(angle),0));
     else if(axis===1)pp=add(wave.p,V(distorted*Math.cos(angle),0,distorted*Math.sin(angle)));
     else pp=add(wave.p,V(0,distorted*Math.cos(angle),distorted*Math.sin(angle)));
     const q=project(ch,pp);if(prev)line(out,prev,q,[.42,.7,1],alpha*.36,1.1);prev=q;
    }
   }}}}
 if(cfg.features.constellations.enabled){const f=cfg.features.constellations;for(let i=0;i<stars3D.length;i++){
  const star=stars3D[i],p=project(chambers[star.ch],star.p),alpha=clamp(1-star.age/f.persistence,0,1)*f.intersectionGlow;
  point(dots,p,star.color,alpha,6*f.sparkleSize);point(dots,p,[1,1,1],alpha,1.5*f.sparkleSize);
  if(i>0&&i%3===0&&f.connectionBrightness>0){const prev=stars3D[i-1];
   if(mag(sub(prev.p,star.p))<.6)line(out,project(chambers[prev.ch],prev.p),p,star.color,alpha*f.connectionBrightness*.2,.65);}}}
 if(cfg.features.echoes.enabled){const f=cfg.features.echoes;for(let k=0;k<Math.min(snapshots.length,f.echoCount);k++){
  const snap=snapshots[snapshots.length-1-k],opacity=f.echoOpacity*Math.pow(.72,k);
  for(const s of snap){const ch=chambers[s.ch],pos=project(ch,V(s.x,s.y,s.z+(k+1)*f.depthSeparation));point(dots,pos,s.color,opacity,5+cfg.particles.size*1.5);}}}
}
function resize(){width=Math.max(1,innerWidth);height=Math.max(1,innerHeight);renderer.resize(width,height);chambers=makeChambers()}
resize();addEventListener('resize',resize,{passive:true});
editor=SettingsEditor.create({defaults,initial:cfg,onToggle(){chambers=makeChambers();renderer.clearTrails()},onChange(next,path){const old=cfg;cfg=next;
 try{localStorage.setItem(STORAGE,JSON.stringify(cfg))}catch{}
 const restart=path==='preset'||path==='reset'||path==='import'||
  /^(geometry\.(type|aspect|eccentricity)|particles\.(max|speed|speedVariation|emitter|splitAngle|azimuth|elevation|spread|distribution))$/.test(path);
 chambers=makeChambers();cameraCache=null;
 if(restart)reset();
 if(old.trails.enabled!==cfg.trails.enabled)renderer.clearTrails();
 $('#description').textContent=cfg.geometry.type==='sphere'?'Coincident foci · spherical reflection · 3D splitting':'Focus A → spheroid wall → focus B → split';
}});
editor.setOpen(cfg.editor.enabled&&!matchMedia('(max-width:700px)').matches);
$('#description').textContent=cfg.geometry.type==='sphere'?'Coincident foci · spherical reflection · 3D splitting':'Focus A → spheroid wall → focus B → split';
$('#settings').addEventListener('click',()=>editor.toggle());
function togglePause(){paused=!paused;$('#pause').textContent=paused?'Resume':'Pause'}
$('#pause').addEventListener('click',togglePause);
addEventListener('keydown',e=>{if(e.key==='Escape'&&editor.isOpen()){editor.setOpen(false);return}if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;
 if(e.key===' '){e.preventDefault();togglePause()}else if(e.key.toLowerCase()==='e')editor.toggle();else if(e.key.toLowerCase()==='r')reset();else if(e.key.toLowerCase()==='s')screenshot();else if(e.key.toLowerCase()==='b')burst();});
function screenshot(){canvas.toBlob(b=>{if(!b)return;const url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='chromatic-reflections-3d.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)},'image/png')}
function burst(){for(let i=0;i<cfg.interaction.burstCount&&particles.length<cfg.particles.max;i++){
 particles.push(makeParticle(i%2?'a':'b',seedDirection(nextId+i),i%chambers.length));}if(particles.length>=cfg.particles.max)scheduleReset()}
let drag=null,pinchDist=0;
canvas.addEventListener('pointerdown',e=>{if(!cfg.interaction.enabled)return;cursor={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,yaw:dragYaw,pitch:dragPitch,moved:false}});
canvas.addEventListener('pointermove',e=>{if(!cfg.interaction.enabled)return;cursor={x:e.clientX,y:e.clientY};
 if(!drag||!cfg.interaction.dragRotate)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(Math.hypot(dx,dy)>3)drag.moved=true;dragYaw=drag.yaw+dx*.34;dragPitch=clamp(drag.pitch+dy*.26,-75,75)});
canvas.addEventListener('pointerup',e=>{if(drag&&!drag.moved&&cfg.interaction.clickBurst)burst();drag=null;cursor=null;try{canvas.releasePointerCapture(e.pointerId)}catch{}});
canvas.addEventListener('pointercancel',()=>{drag=null;cursor=null});canvas.addEventListener('pointerleave',()=>{if(!drag)cursor=null});
canvas.addEventListener('wheel',e=>{if(!cfg.interaction.enabled||!cfg.interaction.wheelZoom)return;e.preventDefault();cfg.view.zoom=clamp(cfg.view.zoom*Math.exp(-e.deltaY*.0012),.5,1.65);editor.sync(cfg);try{localStorage.setItem(STORAGE,JSON.stringify(cfg))}catch{}},{passive:false});
canvas.addEventListener('touchstart',e=>{if(e.touches.length===2)pinchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});
canvas.addEventListener('touchmove',e=>{if(e.touches.length!==2||!cfg.interaction.wheelZoom)return;const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
 if(pinchDist>0)cfg.view.zoom=clamp(cfg.view.zoom*d/pinchDist,.5,1.65);pinchDist=d;editor.sync(cfg);try{localStorage.setItem(STORAGE,JSON.stringify(cfg))}catch{}},{passive:true});
canvas.addEventListener('touchend',()=>pinchDist=0,{passive:true});
document.addEventListener('visibilitychange',()=>last=performance.now());reset();
function frame(now){requestAnimationFrame(frame);let rawDT=clamp((now-last)/1000,0,.05);last=now;const dt=paused||document.hidden?0:rawDT;if(dt)clock+=dt;cameraCache=null;
 chambers=makeChambers();const trails=[],overlay=[],points=[];
 if(dt){for(const f of flashes)f.life-=dt;flashes=flashes.filter(f=>f.life>0);
  for(const w of waves)w.age+=dt;waves=waves.filter(w=>w.age<2.5&&w.age*cfg.features.shockwaves.waveSpeed<cfg.features.shockwaves.waveRadius);
  for(const i of impacts)i.age+=dt;impacts=impacts.filter(i=>i.age<1.5);
  for(const s of stars3D)s.age+=dt;stars3D=stars3D.filter(s=>s.age<cfg.features.constellations.persistence);
  if(segments.length)segments=segments.filter(s=>clock-s.time<Math.max(2,cfg.features.constellations.persistence));
  retiredTrails=retiredTrails.filter(g=>clock-g.born<cfg.trails.lifetime);
  const pending=[];for(const p of particles)advance(p,dt,trails,pending);particles.push(...pending.slice(0,Math.max(0,cfg.particles.max-particles.length)));
  if(resetCountdown>=0){resetCountdown-=dt;if(resetCountdown<=0)reset()}
  if(cfg.features.echoes.enabled){snapshotClock+=dt;if(snapshotClock>=cfg.features.echoes.echoInterval){snapshotClock=0;
   snapshots.push(particles.map(p=>({x:p.x,y:p.y,z:p.z,ch:p.chamberId,color:particleColor(p)})));
   if(snapshots.length>6)snapshots.shift()}}else snapshots=[];
 }
 buildTrails(trails);
 makeOverlay(overlay,points);renderer.render(trails,overlay,points,dt,clock,chambers[0]);
 frames=frames*.94+(rawDT?1/rawDT:60)*.06;
 if(now-statsLast>250){$('#balls').textContent=particles.length.toLocaleString();$('#bounces').textContent=bounces.toLocaleString();
  $('#generation').textContent=Math.max(0,...particles.map(p=>p.generation));$('#fps').textContent=Math.round(frames);statsLast=now;}}
requestAnimationFrame(frame);
})();
</script>
</body>
