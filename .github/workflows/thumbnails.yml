name: Generate Background Thumbnails

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      regenerate_all:
        description: "Regenerate all thumbnails"
        type: boolean
        required: false
        default: false
      bootstrap_manifest:
        description: "Trust existing thumbnails without rendering (first run only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: thumbnails-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and commit thumbnails
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Record starting commit
        id: start
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure checkpoint commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check pending thumbnails
        id: preflight
        shell: bash
        env:
          FORCE: ${{ inputs.regenerate_all }}
          BOOTSTRAP: ${{ inputs.bootstrap_manifest }}
        run: |
          set -euo pipefail
          unset THUMBNAIL_FOLDERS
          if [[ "$FORCE" == true || "$BOOTSTRAP" == true ]]; then
            echo "render=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/generate-thumbnails.mjs --dry-run | tee "$RUNNER_TEMP/thumbnail-plan"
            if grep -q '^Pending: 0; current: .*; failed: 0;' "$RUNNER_TEMP/thumbnail-plan"; then
              echo "render=false" >> "$GITHUB_OUTPUT"
            else
              echo "render=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Install Playwright
        if: steps.preflight.outputs.render == 'true'
        run: npm install --no-save --no-package-lock playwright@1.56.1

      - name: Install Chromium
        if: steps.preflight.outputs.render == 'true'
        run: npx playwright install --with-deps chromium

      - name: Generate thumbnails with checkpoints
        if: steps.preflight.outputs.render == 'true'
        shell: bash
        env:
          FORCE: ${{ inputs.regenerate_all }}
          BOOTSTRAP: ${{ inputs.bootstrap_manifest }}
        run: |
          set -euo pipefail
          unset THUMBNAIL_FOLDERS
          args=(--checkpoint --workers=1 --batch-size=1 --max-runtime=40)
          if [[ "$FORCE" == true ]]; then args+=(--all); fi
          if [[ "$BOOTSTRAP" == true ]]; then args+=(--bootstrap-manifest); fi
          # Hard safety limit: completed checkpoints are already on GitHub.
          set +e
          timeout --kill-after=15s 45m node scripts/generate-thumbnails.mjs "${args[@]}"
          status=$?
          set -e
          if [[ "$status" == 124 || "$status" == 137 ]]; then
            echo "::warning::Generation time budget exhausted; resuming on next run."
            # Discard any incomplete, uncheckpointed working-tree changes.
            git reset --hard HEAD
          elif [[ "$status" != 0 ]]; then
            exit "$status"
          fi

      - name: Record checkpoint commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$(git rev-parse HEAD)" != "${{ steps.start.outputs.sha }}" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy GitHub Pages
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout generated repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.generate.outputs.commit_sha }}
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/website"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='scripts/' \
            --exclude='.gitignore' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='thumbnail-manifest.json' \
            --exclude='_thumbnail-diagnostics/' \
            ./ "$RUNNER_TEMP/website/"

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "${{ runner.temp }}/website"
          retention-days: 1

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
