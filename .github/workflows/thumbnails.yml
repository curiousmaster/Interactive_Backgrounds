name: Generate Background Thumbnails

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      regenerate_all:
        description: "Regenerate all thumbnails"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: thumbnails-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and commit thumbnails
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate thumbnails
        shell: bash
        env:
          REGENERATE_ALL: ${{ inputs.regenerate_all }}
        run: |
          set -euo pipefail
          unset THUMBNAIL_FOLDERS
          if [[ "$REGENERATE_ALL" == "true" ]]; then
            node scripts/generate-thumbnails.mjs --all --workers=1
          else
            node scripts/generate-thumbnails.mjs --workers=1
          fi

      - name: Commit generated thumbnails
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find . -name thumbnail.webp \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -print0 | xargs -0 -r git add --
          if [[ -f thumbnail-manifest.json ]]; then
            git add -- thumbnail-manifest.json
          fi
          if git diff --cached --quiet; then
            echo "No thumbnail changes to commit."
          else
            git commit -m "chore: update background thumbnails [skip ci]"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy GitHub Pages
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout generated repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.generate.outputs.commit_sha }}
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/website"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='scripts/' \
            --exclude='.gitignore' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='thumbnail-manifest.json' \
            --exclude='_thumbnail-diagnostics/' \
            ./ "$RUNNER_TEMP/website/"

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "${{ runner.temp }}/website"
          retention-days: 1

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4