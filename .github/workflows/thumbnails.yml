name: Generate Background Thumbnails

on:
  push:
    branches:
      - main
      - master
    paths:
      - "backgrounds.js"
      - "*/index.html"
      - "*/*/index.html"
      - "*/settings-editor.js"
      - "*/*/settings-editor.js"
      - "scripts/generate-thumbnails.mjs"
      - ".github/workflows/thumbnails.yml"

  workflow_dispatch:
    inputs:
      regenerate_all:
        description: "Regenerate all thumbnails"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: thumbnails-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and commit thumbnails
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Find updated background folders
        if: github.event_name == 'push'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { appendFileSync } from "node:fs";

          const before = process.env.BEFORE_SHA;
          const after = process.env.AFTER_SHA;

          function git(args) {
            return execFileSync("git", args, {
              encoding: "utf8",
              maxBuffer: 64 * 1024 * 1024
            });
          }

          let files;

          if (/^0+$/.test(before)) {
            // New branch: consider its current background source files.
            files = git([
              "ls-tree",
              "-r",
              "--name-only",
              "-z",
              after
            ]);
          } else {
            // A force push can leave the previous tip outside local history.
            try {
              git(["cat-file", "-e", `${before}^{commit}`]);
            } catch {
              git(["fetch", "--no-tags", "origin", before]);
            }

            // Compare the entire push, including multiple commits.
            files = git([
              "diff",
              "--name-only",
              "--no-renames",
              "--diff-filter=ACMT",
              "-z",
              before,
              after
            ]);
          }

          const folders = new Set();

          for (const file of files.split("\0").filter(Boolean)) {
            const match = file.match(
              /^(.+)\/(?:index\.html|settings-editor\.js)$/
            );

            if (match) {
              folders.add(match[1]);
            }
          }

          const selected = [...folders].sort();

          appendFileSync(
            process.env.GITHUB_ENV,
            `THUMBNAIL_FOLDERS=${JSON.stringify(selected)}\n`
          );

          console.log(
            selected.length
              ? `Updated background folders:\n${selected.join("\n")}`
              : "No background source files changed."
          );
          NODE

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Generate thumbnails
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REGENERATE_ALL: ${{ inputs.regenerate_all }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            # The folder filter limits --all to updated effects.
            node scripts/generate-thumbnails.mjs --all
          elif [[ "$REGENERATE_ALL" == "true" ]]; then
            node scripts/generate-thumbnails.mjs --all
          else
            node scripts/generate-thumbnails.mjs
          fi

      - name: Commit generated thumbnails
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find . -name thumbnail.webp \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -print0 | xargs -0 -r git add --

          if git diff --cached --quiet; then
            echo "No thumbnail changes to commit."
          else
            git commit -m "chore: update background thumbnails [skip ci]"
            git push
          fi

  deploy:
    name: Deploy GitHub Pages
    needs: generate
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
