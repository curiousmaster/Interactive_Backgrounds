<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
  <title>
   Game of Pi — Infinite Walk
  </title>
  <style>
  :root {
    color-scheme: dark;
    font-family: Inter,system-ui,Arial,sans-serif;
  }
  * {
    box-sizing: border-box;
  }
  html,body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030610;
    color: #e6f0ff;
  }
  #gl,#fx {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #fx {
    pointer-events: none;
  }
  #hud {
    position: fixed;
    left: 16px;
    top: 15px;
    pointer-events: none;
    text-shadow: 0 1px 8px #000;
    font-size: 12px;
    line-height: 1.6;
  }
  #hud b {
    font-size: 15px;
    letter-spacing: .13em;
  }
  #hud small {
    color: #a9b9d4;
  }
  #help {
    position: fixed;
    left: 16px;
    bottom: 14px;
    color: #93a6c6;
    font-size: 11px;
    pointer-events: none;
  }
  #status {
    position: fixed;
    left: 16px;
    bottom: 37px;
    color: #f5bd76;
    font-size: 11px;
    pointer-events: none;
  }
  #editor-root {
    position: fixed;
    right: 0;
    top: 0;
    bottom: 0;
    z-index: 5;
  }
  button {
    cursor: pointer;
  }
  body.editor-hidden #editor-root {
    display: none;
  }
  #open-editor {
    position: fixed;
    right: 14px;
    top: 14px;
    z-index: 4;
    border: 1px solid #425573;
    background: #152138;
    color: white;
    border-radius: 10px;
    padding: 9px 12px;
  }
  body:not(.editor-hidden) #open-editor {
    display: none;
  }
  @media (max-width:600px) {
    #hud {
      left: 9px;
      top: 8px;
    }
    #help {
      max-width: 65vw;
    }
  }
  #transport {
    position: fixed;
    z-index: 3;
    left: 50%;
    bottom: max(18px,env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: min(540px, 96vw);
    max-width: 96vw;
    box-sizing: border-box;
    background: #0b1629dd;
    border: 1px solid #3b5875;
    border-radius: 16px;
    padding: 9px;
    backdrop-filter: blur(12px);
  }
  #transport button {
    color: #eafaff;
    background: #203753;
    border: 1px solid #4b6b88;
    border-radius: 9px;
    padding: 10px 16px;
    font: 600 12px system-ui;
  }
  #transport button:hover {
    background: #305879;
  }
  #transport button:disabled {
    opacity: .4;
    cursor: wait;
  }
  #transport small {
    flex: 1 1 190px;
    min-width: 0;
    color: #9cb9d4;
    font-size: 12px;
    line-height: 1.4;
    text-align: center;
    overflow-wrap: anywhere;
  }
  #status {
    bottom: 85px !important;
  }
  #help {
    bottom: 115px !important;
  }
  [hidden] {
    display: none !important;
  }
  @media (max-width:600px) {
    #transport {
      width: calc(100vw - 16px);
      max-width: 96vw;
      flex-wrap: wrap;
      justify-content: center;
    }
    #transport button {
      padding: 9px;
    }
    #transport small {
      display: block;
      flex: 1 0 100%;
    }
  }
</style>
 </head>
 <body>
  <canvas id="gl">

   <button id="run-toggle" type="button">

   <small id="run-progress">
    Preparing π…
   </small>
  </div>
  <div id="editor-root">
  </div>
  <script>

    camera: { autoZoom: true, zoomSpeed: .7, follow: true, followStrength: 2.2, mode: 'endpoint', zoom: 4, manualPause: 3, orbit: false, orbitSpeed: .05, threeD: false, tilt: 32, yaw: 35, perspective: true },
    render: { background: '#030610', lineWidth: 1.35, pointSize: 2.3, opacity: .85, colors: 'digit', palette: ['#63f5ff', '#61a8ff', '#8068ff', '#ca69ff', '#ff62bb', '#ff7768', '#ffc56b', '#e7ff80', '#76ffc0', '#ffffff'], trailFade: 0, bloom: true, bloomStrength: 1.4, showGrid: false },

      nodeFade: { enabled: true, halfLife: 12, minOpacity: .05 }, luminous: { enabled: true, glow: 1.1 }, nebula: { enabled: true, count: 9000, emission: 2, drift: .45 }, density: { enabled: false, resolution: 7, height: 30, wireframe: true }, chromatic: { enabled: true }, lens: { enabled: false, strength: .25, radius: 80 }, lightning: { enabled: false, distance: 12, frequency: 20 }, liquid: { enabled: false, strength: 1, decay: .9 }, extrusion: { enabled: false, height: 8, thickness: 2 }, echoes: { enabled: false, count: 3, offset: 6, opacity: .28 }, nodes: { enabled: true, every: 100, radius: 3 }, fractal: { enabled: true }, interference: { enabled: false, layers: 3, angle: 2, offset: 4 }, vortices: { enabled: false, strength: 1 }, crystals: { enabled: false, size: 5, threshold: 3 }, spectral: { enabled: false, window: 250 }, multiverse: { enabled: false, walkers: 4, spread: 15 }
    }, performance: { maxVisibleSegments: 180000, chunkSize: 4096, maxStoredSteps: 1500000, particleCap: 12000 }, ui: { showStats: true, showHelp: true }

  const deepClone = object => JSON.parse(JSON.stringify(object));
  function merge(target, source) {

  try {
    merge(config, JSON.parse(localStorage.getItem('game-of-pi-config') || '{}'));
  }
  catch { }
  // Chudnovsky binary-splitting algorithm in a dedicated, self-contained Worker.
  // The worker returns exactly N digits AFTER the decimal point; it never fetches digits.
  // Exact decimal arithmetic; no repeating finite prefixes or external network dependencies.
  const PI_WORKER_SOURCE = `
    'use strict';
    const C = 640320n;
    const CUBED_OVER_24 = C * C * C / 24n;

    function integerSqrt(value) {
      if (value < 0n) throw Error('Negative square root');
      if (value < 2n) return value;
      let x = 1n << BigInt(Math.ceil(value.toString(2).length / 2));
      while (true) {
        const next = (x + value / x) >> 1n;
        if (next >= x) return x;
        x = next;
      }

      if (b - a === 1) {
        if (a === 0) return [1n, 1n, 13591409n];

        const P = (6n * k - 5n) * (2n * k - 1n) * (6n * k - 1n);
        const Q = k * k * k * CUBED_OVER_24;

        return [P, Q, T];
      }
      const middle = (a + b) >> 1;
      const [p1, q1, t1] = split(a, middle);
      const [p2, q2, t2] = split(middle, b);
      return [p1 * p2, q1 * q2, t1 * q2 + p1 * t2];
    }

    function decimalDigits(name, count) {
      if (name === 'champernowne') {
        let result = '';
        for (let i = 1; result.length < count; i++) result += i;
        return result.slice(0, count);
      }

      const precision = count + 24;
      const scale = 10n ** BigInt(precision);
      let fixed;

      if (name === 'pi') {
        const terms = Math.ceil(precision / 14.181647462725477) + 1;
        const [, Q, T] = split(0, terms);
        fixed = 426880n * integerSqrt(10005n * scale * scale) * Q / T;
      } else if (name === 'sqrt2') {
        fixed = integerSqrt(2n * scale * scale);
      } else if (name === 'phi') {
        fixed = (scale + integerSqrt(5n * scale * scale)) / 2n;
      } else if (name === 'e') {
        let term = scale;
        fixed = term;
        for (let k = 1n; term !== 0n; k++) {
          term /= k;
          fixed += term;
        }
      } else if (name === 'ln2') {
        // ln(2) = 2 * atanh(1/3) = 2 * sum(1 / ((2k+1) * 3^(2k+1))).
        let power = scale / 3n;
        let sum = 0n;
        for (let k = 0n; power !== 0n; k++) {
          sum += power / (2n * k + 1n);
          power /= 9n;
        }
        fixed = 2n * sum;
      } else {
        throw Error('Unsupported mathematical constant: ' + name);
      }

      const text = fixed.toString().padStart(precision + 1, '0');
      return text.slice(0, -precision) === '0'
        ? text.slice(-precision, -precision + count)
        : text.slice(0, -precision) + '.' + text.slice(-precision, -precision + count);
    }

    // Compute progressively larger exact prefixes. Each prefix replaces the
    // previous one; only the newly available suffix is transferred to the UI.
    let activeJob = 0;

    onmessage = ({ data }) => {
      const { count, id, constant } = data;
      activeJob = id;
      let delivered = 0;
      let target = Math.min(count, 512);

      function calculateNext() {
        if (activeJob !== id) {
          return;
        }

        try {
          const result = decimalDigits(constant, target);
          const decimal = result.includes('.') ? result.split('.')[1] : result;
          const chunk = decimal.slice(delivered);
          delivered = decimal.length;

          postMessage({
            id,
            chunk,
            calculated: delivered,
            total: count,
            complete: delivered >= count
          });

          if (delivered < count) {
            target = Math.min(count, Math.max(target + 1, target * 2));
            setTimeout(calculateNext, 0);
          }
        } catch (error) {
          postMessage({ id, error: String(error) });
        }
      }

      calculateNext();
    };
  `;
  let worker = null;
  let jobId = 0;
  let availableDigits = '';
  let ready = false;
  let computing = false;
  let calculationComplete = false;

  function updateCalculationLabel() {
    const label = document.getElementById('run-progress');
    const target = config.simulation.digitCount;
    const consumed = Math.min(totalSteps * digitGroupWidth(), target);
    const calculated = Math.max(0, availableDigits.length - config.simulation.startDigit);

    if (computing) {
      label.textContent =
        'Visualized ' + consumed.toLocaleString() + ' / ' + target.toLocaleString() +
        ' · Calculated ' + Math.min(target, calculated).toLocaleString();
    } else {
      label.textContent = consumed.toLocaleString() + ' / ' + target.toLocaleString();
    }
  }

  function prepareDigits() {
    const count = clamp(Math.round(config.simulation.digitCount), 100, 1000000);
    config.simulation.digitCount = count;
    const offset = Math.max(0, Math.round(config.simulation.startDigit));
    const requested = count + offset;
    const id = ++jobId;

    ready = false;
    computing = true;
    calculationComplete = false;
    availableDigits = '';

    if (worker) {
      worker.terminate();
      worker = null;
    }

    const url = URL.createObjectURL(new Blob([PI_WORKER_SOURCE], {
      type: 'text/javascript'
    }));
    worker = new Worker(url);
    URL.revokeObjectURL(url);

    document.getElementById('status').textContent = '';
    document.getElementById('run-toggle').disabled = false;
    updateCalculationLabel();

    worker.onmessage = ({ data }) => {
      if (data.id !== jobId) {
        return;
      }

      if (data.error) {
        computing = false;
        document.getElementById('status').textContent = data.error;
        document.getElementById('run-progress').textContent = 'Calculation failed';
        worker.terminate();
        worker = null;
        return;
      }

      if (typeof data.chunk === 'string') {
        availableDigits += data.chunk;
        ready = availableDigits.length >= offset + digitGroupWidth();
        calculationComplete = Boolean(data.complete);
        computing = !calculationComplete;
        updateCalculationLabel();

        if (calculationComplete) {
          worker.terminate();
          worker = null;
        }
      }
    };

    worker.onerror = event => {
      if (id !== jobId) {
        return;
      }

      computing = false;
      document.getElementById('run-progress').textContent = 'Worker error';
      document.getElementById('status').textContent = event.message;
    };

    worker.postMessage({
      count: requested,
      id,
      constant: config.simulation.constant
    });
  }
  const gl = document.getElementById('gl').getContext('webgl2', { antialias: true, alpha: false, preserveDrawingBuffer: false });
  if (!gl) {
    document.getElementById('status').textContent = 'WebGL2 is required.';
    throw Error('WebGL2 required');
  }
  const fx = document.getElementById('fx'), ctx = fx.getContext('2d');
  function shader(type, source) {
    const s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
      throw Error(gl.getShaderInfoLog(s));
      return s;
  }
  function program(v, f) {
    const p = gl.createProgram();
    gl.attachShader(p, shader(gl.VERTEX_SHADER, v));
    gl.attachShader(p, shader(gl.FRAGMENT_SHADER, f));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS))
      throw Error(gl.getProgramInfoLog(p));

  }
  const vert = `#version 300 es
    precision highp float;
    layout(location = 0) in vec3 position;
    layout(location = 1) in vec4 color;
    uniform vec3 u_center;
    uniform vec2 u_viewport;
    uniform float u_zoom;
    uniform float u_size;
    uniform float u_tilt;
    uniform float u_yaw;
    uniform float u_threeD;
    uniform float u_perspective;
    out vec4 v_color;

    void main() {
      vec3 p = position - u_center;
      float cy = cos(u_yaw);
      float sy = sin(u_yaw);
      float ct = cos(u_tilt);
      float st = sin(u_tilt);
      vec3 rotated = vec3(cy * p.x - sy * p.y, p.z, sy * p.x + cy * p.y);
      float vertical = rotated.y * ct - rotated.z * st;
      float depth = rotated.y * st + rotated.z * ct;
      float perspectiveScale = u_perspective > 0.5 ? 1.0 / max(0.15, 1.0 + depth * 0.0015 * u_zoom) : 1.0;
      vec2 projected = u_threeD > 0.5
        ? vec2(rotated.x, vertical) * perspectiveScale
        : vec2(p.x, p.y);
      projected *= u_zoom;
      gl_Position = vec4(2.0 * projected.x / u_viewport.x, -2.0 * projected.y / u_viewport.y, 0.0, 1.0);

      v_color = color;
    }
  `;
  const frag = `#version 300 es
    precision highp float;in vec4 v_color;uniform float u_points;out vec4 outColor;void main(){float alpha=v_color.a;if(u_points>0.5){float r=length(gl_PointCoord-.5)*2.;alpha*=smoothstep(1.,.05,r);}outColor=vec4(v_color.rgb*alpha,alpha);}`;
  const prog = program(vert, frag), loc = { center: gl.getUniformLocation(prog, 'u_center'), yaw: gl.getUniformLocation(prog, 'u_yaw'), threeD: gl.getUniformLocation(prog, 'u_threeD'), perspective: gl.getUniformLocation(prog, 'u_perspective'), viewport: gl.getUniformLocation(prog, 'u_viewport'), zoom: gl.getUniformLocation(prog, 'u_zoom'), size: gl.getUniformLocation(prog, 'u_size'), tilt: gl.getUniformLocation(prog, 'u_tilt'), points: gl.getUniformLocation(prog, 'u_points') };
  const vao = gl.createVertexArray(), buffer = gl.createBuffer();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 28, 0);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 28, 12);
  gl.bindVertexArray(null);
  const walkers = [];
  let totalSteps = 0, elapsed = 0, carry = 0, last = performance.now(), lastUser = 0, cam = { x: 0, y: 0, z: 0, zoom: config.camera.zoom }, bounds = { minX: 0, maxX: 0, minY: 0, maxY: 0, minZ: 0, maxZ: 0 }, hist = new Uint32Array(10), density = new Map(), events = [], particles = [], geometryDirty = true;
  const path = [];
  const DEG = Math.PI / 180;
  // packed points: {x,y,d,w}; bounded memory; world is unbounded, geometry storage is not.
  const palettes = { digit: d => config.render.palette[d] || '#fff', time: (d, i) => `hsl(${(i * .05) % 360} 100% 68%)`, distance: (d, i, x, y) => `hsl(${(Math.hypot(x, y) * 2) % 360} 100% 65%)`, mono: () => '#6ae8ff' };
  function rgb(s) {
    if (s.startsWith('#')) {

  function initWalkers() {
    walkers.length = 0; const count = config.features.multiverse.enabled ? config.features.multiverse.walkers : config.simulation.walkers; for (let i = 0; i < count; i++)
      walkers.push({ x: 0, y: 0, z: 0, heading: 0, orientation: [0, 0, 0, 1], roll: 0, thickness: 1, curvature: 0, offset: i * config.features.multiverse.spread, mode: i === 0 ? config.simulation.mode : (i % 2 ? 'relative' : 'absolute') });
  }
  function reset() {
    path.length = 0;
    particles.length = 0;
    events.length = 0;
    density.clear();
    hist.fill(0);
    totalSteps = 0;
    elapsed = 0;
    carry = 0;
    bounds = {
      minX: 0,
      maxX: 0,
      minY: 0,
      maxY: 0,
      minZ: 0,
      maxZ: 0

  }
  function key(x, y) { const s = config.features.density.resolution; return `${Math.floor(x / s)},${Math.floor(y / s)}`; }

  function axisRotation(axis, angle) {
    const half = angle / 2;
    const sine = Math.sin(half);

  function digitGroupWidth() {
    const group = config.simulation.grouping;
    if (group === 'pair') return 2;
    if (group === 'triplet') return 3;
    if (group === 'quadruplet') return 4;
    if (group === 'highResolution') return 6;
    return 1;
  }

  function lengthMultiplier(digit) {
    if (digit !== 0) return digit;
    if (config.simulation.zeroLength === 'one') return 1;
    if (config.simulation.zeroLength === 'ten') return 10;

  function displacement(walker, digits) {
    const settings = config.simulation;
    const group = settings.grouping;
    const base = settings.stepLength;
    const relative = walker.mode === 'relative';
    const angleOffset = settings.angleOffset * DEG;
    let vector;
    let distance = base;
    let heading = digits[0] * DIGIT_ANGLE + angleOffset;

      distance *= group === 'pair' ? lengthMultiplier(digits[1]) : 1;
      walker.heading = relative ? walker.heading + heading : heading;
      vector = [Math.sin(walker.heading), 0, Math.cos(walker.heading)];
    } else if (settings.interpretation === 'cartesian') {
      vector = digits.slice(0, 3).map(digit => (2 * digit - 9) / 9);
      if (group === 'quadruplet') {
        applyFourthDigit(walker, digits[3]);
      }
      if (relative) {
        vector = rotateVector(walker.orientation, vector);
      }
    } else {
      const highResolution = group === 'highResolution';
      const azimuth = highResolution ? (digits[0] * 10 + digits[1]) * TAU / 100 + angleOffset : heading;
      const elevationDigit = highResolution ? digits[2] * 10 + digits[3] : digits[1];
      const elevation = highResolution
        ? (elevationDigit / 99 - 0.5) * Math.PI
        : (elevationDigit - 4.5) * Math.PI / 9;
      const lengthDigit = highResolution ? digits[4] * 10 + digits[5] : digits[2];
      distance *= highResolution ? lengthDigit : lengthMultiplier(lengthDigit);

      if (relative) {
        const yaw = axisRotation([0, 1, 0], azimuth);
        const pitch = axisRotation([1, 0, 0], -elevation);
        walker.orientation = multiplyQuaternion(walker.orientation, multiplyQuaternion(yaw, pitch));
        vector = rotateVector(walker.orientation, [0, 0, 1]);
      } else {
        vector = [
          Math.cos(elevation) * Math.sin(azimuth),
          Math.sin(elevation),
          Math.cos(elevation) * Math.cos(azimuth)
        ];
      }
      if (group === 'quadruplet') applyFourthDigit(walker, digits[3]);
    }

    return vector.map(value => value * distance);
  }

  function applyFourthDigit(walker, digit) {
    const value = digit / 9;
    switch (config.simulation.fourth) {
      case 'roll':
        walker.roll = value * TAU;
        walker.orientation = multiplyQuaternion(walker.orientation, axisRotation([0, 0, 1], walker.roll));
