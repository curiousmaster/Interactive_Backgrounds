 const uniform=(n)=>gl.getUniformLocation(postProg,n);gl.uniform1i(uniform('sceneTex'),0);gl.uniform1i(uniform('historyTex'),1);gl.uniform2f(uniform('texel'),1/w,1/h);gl.uniform1i(uniform('bloomEnabled'),cfg.effects.bloom?1:0);gl.uniform1f(uniform('bloomStrength'),cfg.effects.bloomStrength);gl.uniform1i(uniform('chromaticEnabled'),cfg.effects.chromatic?1:0);gl.uniform1f(uniform('chromaticAmount'),cfg.effects.chromaticAmount);gl.uniform1i(uniform('kaleidoEnabled'),cfg.effects.kaleidoscope?1:0);gl.uniform1i(uniform('slices'),cfg.effects.kaleidoscopeSlices);gl.uniform1f(uniform('vignette'),cfg.effects.vignette);gl.uniform1f(uniform('trailEnabled'),cfg.particles.trails&&historyValid?1:0);gl.uniform1f(uniform('trailMix'),cfg.simulation.mode==='flow'?cfg.simulation.decay:Math.min(.995,.45+cfg.particles.trailLength*.54));gl.uniform3f(uniform('background'),...rgb);gl.drawArrays(gl.TRIANGLES,0,3);
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.useProgram(copyProg);tex(0,targets[outputIndex].tex);gl.uniform1i(gl.getUniformLocation(copyProg,'sourceTex'),0);gl.drawArrays(gl.TRIANGLES,0,3);gl.bindVertexArray(null);historyIndex=outputIndex;historyValid=true;
 if(diagnostics){document.getElementById('debug').textContent=`Points: ${npoints} / ${points.length/3}\nSystems: ${systems.length} / vertices: ${systems[0]?.vertices.length||0}\nGL error: ${gl.getError()}\nRenderer: WebGL2 + postprocessing\nGeometry: ${cfg.geometry.shape} / scale ${cfg.geometry.scale}\nCanvas: ${w} × ${h}\nWorld center: ${worldCenter.map(x=>x.toFixed(3)).join(', ')}\nWorld radius: ${worldRadius.toFixed(2)}\nCamera yaw/tilt: ${(yaw*180/Math.PI).toFixed(1)}° / ${(tilt*180/Math.PI).toFixed(1)}°\nZoom: ${cfg.view.zoom.toFixed(2)}`;}else document.getElementById('debug').textContent='';}
function tick(ms){requestAnimationFrame(tick);let dt=Math.min(.08,(ms-lastFrame)/1000||.016);if(ms-lastFrame<1000/Math.max(1,cfg.performance.frameCap)-2)return;lastFrame=ms;frameCounter++;if(frameCounter%25===0)fps=Math.round(1/Math.max(dt,.001));if(!paused){epoch+=dt;if(cfg.view.autoOrbit)renderYaw+=dt*cfg.view.orbitSpeed;if(cfg.animation.enabled){let amount=Math.min(18000,Math.floor(cfg.simulation.rate*dt));generate(amount,epoch)}else if(npoints<points.length/3)generate(Math.min(18000,points.length/3-npoints),epoch)}render(epoch);document.getElementById('stats').textContent=`${npoints.toLocaleString()} points · ${systems.length} systems · ${fps} FPS · ${cfg.simulation.dimension.toUpperCase()}`}
function center(){historyValid=false;cfg.view.panX=0;cfg.view.panY=0;cfg.view.zoom=1;renderYaw=0;renderTilt=0;cfg.view.yaw=DEFAULTS.view.yaw;cfg.view.tilt=DEFAULTS.view.tilt;editor?.setSettings(cfg)}
function apply(next){let before=cfg;cfg=merge(clone(DEFAULTS),next);let keys=['simulation','geometry'];let changed=keys.some(k=>JSON.stringify(before[k])!==JSON.stringify(cfg[k]))||before.performance.pointBudget!==cfg.performance.pointBudget;if(changed){rebuild();historyValid=false}}
function preset(name){let result=merge(clone(DEFAULTS),PRESETS[name]||{});return result}
if(typeof mountSettingsEditor==='function'){editor=mountSettingsEditor({host:document.getElementById('editor-host'),settings:cfg,defaults:DEFAULTS,presets:PRESETS,onChange:apply,onPreset:preset,onCapture:()=>{let a=document.createElement('a');a.download='chaos-game.png';a.href=canvas.toDataURL('image/png');a.click()}})}else console.warn('settings-editor.js missing; simulation still runs');
document.getElementById('settings').onclick=()=>editor?.toggle();document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'Resume':'Pause'};document.getElementById('reset').onclick=()=>rebuild();document.getElementById('center').onclick=center;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,shift:e.shiftKey}});canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;if(drag.shift){cfg.view.panX+=dx/canvas.clientHeight*worldRadius*2;cfg.view.panY-=dy/canvas.clientHeight*worldRadius*2}else{renderYaw+=dx*.3;renderTilt=Math.max(-85,Math.min(85,renderTilt+dy*.3))}});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);canvas.addEventListener('wheel',e=>{e.preventDefault();cfg.view.zoom=Math.max(.12,Math.min(15,cfg.view.zoom*Math.exp(-e.deltaY*.001)));editor?.setSettings(cfg)},{passive:false});window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(e.key.toLowerCase()==='c')center();if(e.key.toLowerCase()==='d')diagnostics=!diagnostics;if(e.code==='Space'){e.preventDefault();document.getElementById('pause').click()}});
rebuild();render(0);requestAnimationFrame(tick);
