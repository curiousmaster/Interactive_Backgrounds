<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Woven Time</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }
</style>
</head>

<body>
<canvas id="background" aria-hidden="true"></canvas>

<script type="module">
"use strict";

const config = {
    fabric: {
        spacing: 34,
        rotation: -15,
        lineWidth: 1,
        opacity: 0.65,
        colorA: [65, 210, 220],
        colorB: [190, 100, 255]
    },

    time: {
        speed: 0.8,
        variation: 0.85,
        pauseStrength: 0.7,
        recovery: 1.5
    },

    weave: {
        amplitude: 22,
        wavelength: 280,
        knotStrength: 0.65,
        knotFrequency: 0.6,
        crossingGap: 5
    },

    mouse: {
        enabled: true,
        radius: 200,
        synchronization: 5,
        calmness: 0.85,
        smoothing: 10,
        color: [255, 185, 110]
    },

    glow: {
        enabled: true,
        intensity: 0.5,
        blur: 8
    },

    rendering: {
        sampleSpacing: 10
    },

    panel: {
        enabled: true
    }
};

window.getBackgroundConfig = () =>
    JSON.parse(JSON.stringify(config));

const canvas = document.getElementById("background");

// WebGL draws antialiased capsule segments.
// Each sampled part of a thread retains its independent clock.
const gl = canvas.getContext("webgl", {
    alpha: false,
    antialias: false,
    depth: false,
    stencil: false
});

if (!gl) {
    const message = document.createElement("p");

    message.textContent =
        "Woven Time requires WebGL. Enable hardware acceleration and reload.";

    message.style.cssText =
        "position:fixed;inset:20px;color:white;font:16px system-ui";

    document.body.append(message);

    throw new Error("WebGL is unavailable");
}

let program;
let buffer;
let locations;

const vertexSource = `
attribute vec2 a_position;
attribute vec2 a_local;
attribute float a_length;
attribute vec3 a_color;

uniform vec2 u_resolution;

varying vec2 v_local;
varying float v_length;
varying vec3 v_color;

void main() {
    gl_Position = vec4(
        a_position / u_resolution * vec2(2., -2.) + vec2(-1., 1.),
        0.,
        1.
    );

    v_local = a_local;
    v_length = a_length;
    v_color = a_color;
}
`;

const fragmentSource = `
precision mediump float;

varying vec2 v_local;
varying float v_length;
varying vec3 v_color;

uniform float u_halfWidth;
uniform float u_opacity;
uniform float u_blur;
uniform float u_glow;
uniform float u_pixel;

void main() {
    vec2 nearest = vec2(
        clamp(v_local.x, 0., v_length),
        0.
    );

    float distanceToLine = length(v_local - nearest);

    float core = 1. - smoothstep(
        max(0., u_halfWidth - u_pixel * .5),
        u_halfWidth + u_pixel * .5,
        distanceToLine
    );

    float outside = max(
        0.,
        distanceToLine - u_halfWidth
    );

    float halo = exp(
        -outside * outside /
        max(.001, 2. * u_blur * u_blur)
    );

    float alpha = u_opacity * (
        core + (1. - core) * halo * u_glow
    );

    gl_FragColor = vec4(v_color, alpha);
}
`;

function initializeGL() {
    function compile(type, source) {
        const shader = gl.createShader(type);

        gl.shaderSource(shader, source);
        gl.compileShader(shader);

        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(shader));
        }

        return shader;
    }

    program = gl.createProgram();

    const vertex = compile(gl.VERTEX_SHADER, vertexSource);
    const fragment = compile(gl.FRAGMENT_SHADER, fragmentSource);

    gl.attachShader(program, vertex);
    gl.attachShader(program, fragment);
    gl.linkProgram(program);

    gl.deleteShader(vertex);
    gl.deleteShader(fragment);

    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(program));
    }

    gl.useProgram(program);

    buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);

    // Position(2), local position(2), segment length(1), RGB(3).
    for (const [name, size, offset] of [
        ["a_position", 2, 0],
        ["a_local", 2, 2],
        ["a_length", 1, 4],
        ["a_color", 3, 5]
    ]) {
        const location = gl.getAttribLocation(program, name);

        gl.enableVertexAttribArray(location);

        gl.vertexAttribPointer(
            location,
            size,
            gl.FLOAT,
            false,
            32,
            offset * 4
        );
    }

    locations = Object.fromEntries(
        [
            "resolution",
            "halfWidth",
            "opacity",
            "blur",
            "glow",
            "pixel"
        ].map(name => [
            name,
            gl.getUniformLocation(program, "u_" + name)
        ])
    );

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.clearColor(0, 0, 0, 1);
}

initializeGL();

let contextLost = false;

canvas.addEventListener("webglcontextlost", event => {
    event.preventDefault();
    contextLost = true;
});

canvas.addEventListener("webglcontextrestored", () => {
    initializeGL();

    contextLost = false;
    previousTime = null;

    resize();
});

let vertices = new Float32Array(65536);
let vertexOffset = 0;

function appendVertex(x, y, localX, localY, length, color) {
    if (vertexOffset + 8 > vertices.length) {
        const larger = new Float32Array(vertices.length * 2);

        larger.set(vertices);
        vertices = larger;
    }

    vertices.set(
        [
            x,
            y,
            localX,
            localY,
            length,
            ...color
        ],
        vertexOffset
    );

    vertexOffset += 8;
}

function segment(a, b, color) {
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const length = Math.hypot(dx, dy);

    if (length < 0.0001) return;

    const ux = dx / length;
    const uy = dy / length;

    const blur = config.glow.enabled
        ? Math.max(0, config.glow.blur) * 0.5
        : 0;

    const padding =
        Math.max(0, config.fabric.lineWidth) / 2 +
        blur * 3 +
        1;

    const corners = [
        [-padding, -padding],
        [length + padding, -padding],
        [length + padding, padding],
        [-padding, padding]
    ];

    for (const index of [0, 1, 2, 0, 2, 3]) {
        const [x, y] = corners[index];

        appendVertex(
            a.x + ux * x - uy * y,
            a.y + uy * x + ux * y,
            x,
            y,
            length,
            color
        );
    }
}

function renderFabric() {
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clear(gl.COLOR_BUFFER_BIT);

    if (!vertexOffset || config.fabric.lineWidth <= 0) return;

    gl.useProgram(program);
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);

    gl.bufferData(
        gl.ARRAY_BUFFER,
        vertices.subarray(0, vertexOffset),
        gl.DYNAMIC_DRAW
    );

    gl.uniform2f(
        locations.resolution,
        width,
        height
    );

    gl.uniform1f(
        locations.halfWidth,
        Math.max(0, config.fabric.lineWidth) / 2
    );

    gl.uniform1f(
        locations.opacity,
        clamp(config.fabric.opacity, 0, 1)
    );

    gl.uniform1f(
        locations.blur,
        Math.max(0, config.glow.blur) * 0.5
    );

    gl.uniform1f(
        locations.glow,
        config.glow.enabled && config.glow.blur > 0
            ? clamp(config.glow.intensity, 0, 1)
            : 0
    );

    gl.uniform1f(
        locations.pixel,
        width / canvas.width
    );

    gl.drawArrays(
        gl.TRIANGLES,
        0,
        vertexOffset / 8
    );
}

const TAU = Math.PI * 2;

const clamp = (v, min, max) =>
    Math.max(min, Math.min(max, v));

const radians = degrees =>
    degrees * Math.PI / 180;

function mixColor(a, b, amount) {
    const t = clamp(amount, 0, 1);

    return a.map((value, i) =>
        value + (b[i] - value) * t
    );
}

let width = 0;
let height = 0;
let extent = 0;
let threads = [];
let gridDirty = true;
let previousTime = null;
let globalTime = 0;

const mouse = {
    x: 0,
    y: 0,
    targetX: 0,
    targetY: 0,
    active: false,
    initialized: false,
    influence: 0
};

function resize() {
    const dpr = Math.min(
        window.devicePixelRatio || 1,
        2
    );

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);

    gl.viewport(0, 0, canvas.width, canvas.height);

    gridDirty = true;
}

// --------------------------------------------------
// Each sampled part of each thread has its own clock.
// --------------------------------------------------

function rebuildFabric() {
    threads = [];

    const spacing = Math.max(
        16,
        config.fabric.spacing
    );

    const sampleSpacing = Math.max(
        4,
        config.rendering.sampleSpacing
    );

    extent =
        Math.hypot(width, height) / 2 +
        Math.max(0, config.weave.amplitude) * 3 +
        spacing * 2;

    const halfThreads = Math.ceil(extent / spacing);

    const samples = Math.ceil(
        extent * 2 / sampleSpacing
    );

    for (let axis = 0; axis < 2; axis++) {
        for (
            let index = -halfThreads;
            index <= halfThreads;
            index++
        ) {
            const phase = index * 1.73 + axis * 2.1;

            threads.push({
                axis,
                index,
                phase,
                samples: Array.from(
                    { length: samples + 1 },
                    (_, sample) => ({
                        along:
                            -extent +
                            sample / samples * extent * 2,
                        clock: globalTime,
                        calm: 0
                    })
                )
            });
        }
    }
}

function toScreen(x, y, cos, sin) {
    return {
        x: width / 2 + x * cos - y * sin,
        y: height / 2 + x * sin + y * cos
    };
}

function updateAndShape(thread, delta, cos, sin) {
    const spacing = Math.max(
        16,
        config.fabric.spacing
    );

    const wavelength = Math.max(
        40,
        config.weave.wavelength
    );

    const amplitude = Math.max(
        0,
        config.weave.amplitude
    );

    const mouseRadius = Math.max(
        1,
        config.mouse.radius
    );

    const points = [];

    for (const sample of thread.samples) {
        const across = thread.index * spacing;

        const baseX = thread.axis === 0
            ? sample.along
            : across;

        const baseY = thread.axis === 0
            ? across
            : sample.along;

        const baseScreen = toScreen(
            baseX,
            baseY,
            cos,
            sin
        );

        const dx = baseScreen.x - mouse.x;
        const dy = baseScreen.y - mouse.y;

        const influence = config.mouse.enabled
            ? mouse.influence * Math.exp(
                -(dx * dx + dy * dy) /
                (2 * mouseRadius * mouseRadius)
            )
            : 0;

        const localVariation = Math.sin(
            sample.along / wavelength * 1.4 +
            thread.phase
        );

        const pause = (
            0.5 + 0.5 * Math.sin(
                globalTime * 0.55 +
                thread.phase +
                sample.along / wavelength
            )
        ) ** 8;

        const rate = Math.max(
            0.02,
            1 +
            config.time.variation * localVariation -
            config.time.pauseStrength * pause
        );

        sample.clock += delta * config.time.speed * rate;

        // Mouse aligns local clocks with the shared clock.
        const synchronization = Math.max(
            0,
            config.mouse.synchronization
        ) * influence;

        const recovery = Math.max(
            0,
            config.time.recovery
        );

        // A gentle recovery keeps clock offsets bounded.
        sample.clock += (globalTime - sample.clock) * (
            1 - Math.exp(
                -(synchronization + recovery * 0.04) * delta
            )
        );

        const calmRate = influence > sample.calm
            ? Math.max(0.1, config.mouse.synchronization)
            : Math.max(0.1, recovery);

        sample.calm += (influence - sample.calm) * (
            1 - Math.exp(-calmRate * delta)
        );

        const spatialPhase =
            sample.along / wavelength * TAU;

        const knotEnvelope = Math.pow(
            0.5 + 0.5 * Math.sin(
                spatialPhase * config.weave.knotFrequency +
                thread.phase +
                sample.clock * 0.3
            ),
            4
        );

        const motion =
            0.6 * Math.sin(
                spatialPhase + sample.clock
            ) +
            0.25 * Math.sin(
                spatialPhase * 0.6 -
                sample.clock * 0.7 +
                thread.phase
            ) +
            config.weave.knotStrength *
            knotEnvelope *
            Math.sin(
                spatialPhase * 3 +
                sample.clock * 1.3
            );

        const displacement =
            amplitude * motion *
            (
                1 -
                sample.calm *
                clamp(config.mouse.calmness, 0, 1)
            );

        const x = thread.axis === 0
            ? sample.along
            : across + displacement;

        const y = thread.axis === 0
            ? across + displacement
            : sample.along;

        const point = toScreen(x, y, cos, sin);

        points.push({
            ...point,
            along: sample.along,
            calm: sample.calm
        });
    }

    return points;
}

// --------------------------------------------------
// Rendering threads and woven crossings
// --------------------------------------------------

function drawThread(thread, points) {
    const spacing = Math.max(
        16,
        config.fabric.spacing
    );

    const gap = clamp(
        config.weave.crossingGap,
        0,
        spacing * 0.35
    );

    const baseColor = thread.axis === 0
        ? config.fabric.colorA
        : config.fabric.colorB;

    for (let i = 1; i < points.length; i++) {
        const before = points[i - 1];
        const point = points[i];

        const midpoint =
            (before.along + point.along) / 2;

        const crossingIndex = Math.round(
            midpoint / spacing
        );

        const crossingDistance = Math.abs(
            midpoint - crossingIndex * spacing
        );

        const parity =
            ((thread.index + crossingIndex) % 2 + 2) % 2;

        if (
            thread.axis === parity &&
            crossingDistance < gap
        ) {
            continue;
        }

        const band = Math.min(
            7,
            Math.floor(
                (before.calm + point.calm) * 4
            )
        );

        const color = mixColor(
            baseColor,
            config.mouse.color,
            band / 7
        ).map(value =>
            clamp(value, 0, 255) / 255
        );

        segment(before, point, color);
    }
}

// --------------------------------------------------
// Animation
// --------------------------------------------------

function animate(timestamp) {
    requestAnimationFrame(animate);

    if (contextLost) {
        previousTime = null;
        return;
    }

    const delta = previousTime === null
        ? 0
        : Math.min(
            (timestamp - previousTime) / 1000,
            0.05
        );

    previousTime = timestamp;

    globalTime += delta * config.time.speed;

    const smoothing = 1 - Math.exp(
        -Math.max(0.1, config.mouse.smoothing) * delta
    );

    mouse.x +=
        (mouse.targetX - mouse.x) * smoothing;

    mouse.y +=
        (mouse.targetY - mouse.y) * smoothing;

    mouse.influence += (
        (mouse.active && config.mouse.enabled ? 1 : 0) -
        mouse.influence
    ) * smoothing;

    if (gridDirty) {
        gridDirty = false;
        rebuildFabric();
    }

    vertexOffset = 0;

    const angle = radians(config.fabric.rotation);
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);

    for (const thread of threads) {
        const points = updateAndShape(
            thread,
            delta,
            cos,
            sin
        );

        drawThread(thread, points);
    }

    renderFabric();
}

// --------------------------------------------------
// Pointer interaction
// --------------------------------------------------

function updateMouse(event) {
    if (
        event.target instanceof Element &&
        event.target.closest("[data-background-editor]")
    ) {
        mouse.active = false;
        return;
    }

    mouse.targetX = event.clientX;
    mouse.targetY = event.clientY;
    mouse.active = true;

    if (!mouse.initialized) {
        mouse.x = mouse.targetX;
        mouse.y = mouse.targetY;
        mouse.initialized = true;
    }
}

function deactivateMouse() {
    mouse.active = false;
}

window.addEventListener("pointermove", updateMouse);
window.addEventListener("pointerdown", updateMouse);
window.addEventListener("blur", deactivateMouse);
window.addEventListener("pointercancel", deactivateMouse);

document.documentElement.addEventListener(
    "pointerleave",
    deactivateMouse
);

window.addEventListener("pointerup", event => {
    if (event.pointerType !== "mouse") {
        deactivateMouse();
    }
});

document.addEventListener("visibilitychange", () => {
    previousTime = null;
    deactivateMouse();
});

window.addEventListener("resize", resize);

resize();
requestAnimationFrame(animate);

// --------------------------------------------------
// Optional editor
// --------------------------------------------------

if (config.panel.enabled) {
    import("./settings-editor.js?v=webgl-1")
        .then(({ mountEditor }) => {
            mountEditor({
                config,

                onChange(path) {
                    if ([
                        "fabric.spacing",
                        "weave.amplitude",
                        "rendering.sampleSpacing"
                    ].includes(path)) {
                        gridDirty = true;
                    }

                    deactivateMouse();
                },

                onReset() {
                    gridDirty = true;
                }
            });
        })
        .catch(error => {
            console.error(
                "Could not load editor:",
                error
            );
        });
}
</script>
</body>
</html>
