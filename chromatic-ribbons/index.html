<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromatic Ribbons</title>

<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050810;
  }

  #background {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
</style>
</head>

<body>
<canvas id="background" aria-hidden="true"></canvas>

<script type="module">
const config = {
  "ribbons": {
    "points": 20,
    "speed": 110,
    "stepsPerSecond": 350,
    "lineWidth": 1.5,
    "opacity": 0.008,
    "curvature": 0.4
  },
  "colors": {
    "hue": 265,
    "hueSpread": 75,
    "saturation": 85,
    "lightness": 65,
    "hueDrift": 3,
    "randomizeOnReset": true,
    "additive": true
  },
  "canvas": {
    "backgroundColor": [
      0,
      0,
      0
    ],
    "trailLifetime": 10,
    "pixelRatio": 1
  },
  "mouse": {
    "enabled": false,
    "radius": 330,
    "attraction": 85,
    "swirl": 150,
    "ribbonBend": 34,
    "flowInfluence": 1.5,
    "dragStrength": 0.8,
    "holdMultiplier": 2,
    "smoothing": 8,
    "doubleClickToReset": true
  },
  "animation": {
    "speed": 2.35,
    "paused": false,
    "respectReducedMotion": true
  },
  "panel": {
    "enabled": true
  }
};

window.getBackgroundConfig = () =>
  JSON.parse(JSON.stringify(config));

const canvas = document.querySelector("#background");

const gl = canvas.getContext("webgl", {
  alpha: false,
  antialias: false,
  depth: false,
  stencil: false,
  premultipliedAlpha: false,
  preserveDrawingBuffer: false
});

if (!gl) {
  const message = document.createElement("p");
  message.textContent =
    "WebGL is unavailable. Enable hardware acceleration or try another browser.";
  message.style.cssText =
    "color:white;padding:24px;font:16px system-ui";
  document.body.append(message);
  throw new Error("WebGL is unavailable");
}

// Each segment is two triangles. Birth times let the fragment shader fade
// every stroke individually, without full-screen trail textures or restarts.
const vertexSource = `
  attribute vec2 aPosition;
  attribute vec2 aNormal;
  attribute vec3 aColor;
  attribute float aBorn;
  attribute float aSide;

  uniform vec2 uSize;
  uniform float uWidth;

  varying vec3 vColor;
  varying float vBorn;
  varying float vSide;

  void main() {
    vSide = aSide;

    vec2 offset = aNormal * (uWidth * 0.5 + 1.0);
    vec2 clip = (aPosition + offset) / uSize * 2.0 - 1.0;

    gl_Position = vec4(clip.x, -clip.y, 0.0, 1.0);
    vColor = aColor;
    vBorn = aBorn;
  }
`;

const fragmentSource = `
  #ifdef GL_FRAGMENT_PRECISION_HIGH
  precision highp float;
  #else
  precision mediump float;
  #endif

  uniform float uTime;
  uniform float uLifetime;
  uniform float uOpacity;
  uniform float uWidth;

  varying vec3 vColor;
  varying float vBorn;
  varying float vSide;

  void main() {
    float age = max(0.0, uTime - vBorn);
    float life = clamp(1.0 - age / uLifetime, 0.0, 1.0);
    float fade = life * life * (3.0 - 2.0 * life);

    float halfWidth = uWidth * 0.5;
    float distance = abs(vSide) * (halfWidth + 1.0);

    float coverage = 1.0 - smoothstep(
      max(0.0, halfWidth - 0.5),
      halfWidth + 0.5,
      distance
    );

    float alpha = uOpacity * fade * coverage;

    if (alpha <= 0.0) discard;

    gl_FragColor = vec4(vColor, alpha);
  }
`;

function shader(type, source) {
  const result = gl.createShader(type);
  gl.shaderSource(result, source);
  gl.compileShader(result);

  if (!gl.getShaderParameter(result, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(result));
  }

  return result;
}

const vs = shader(gl.VERTEX_SHADER, vertexSource);
const fs = shader(gl.FRAGMENT_SHADER, fragmentSource);

const program = gl.createProgram();
gl.attachShader(program, vs);
gl.attachShader(program, fs);
gl.linkProgram(program);

if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
  throw new Error(gl.getProgramInfoLog(program));
}

gl.deleteShader(vs);
gl.deleteShader(fs);
gl.useProgram(program);

const buffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buffer);

// Position, normal, RGB, birth time, side.
const stride = 9 * 4;

for (const [name, size, offset] of [
  ["aPosition", 2, 0],
  ["aNormal", 2, 2],
  ["aColor", 3, 4],
  ["aBorn", 1, 7],
  ["aSide", 1, 8]
]) {
  const location = gl.getAttribLocation(program, name);
  gl.enableVertexAttribArray(location);

  gl.vertexAttribPointer(
    location,
    size,
    gl.FLOAT,
    false,
    stride,
    offset * 4
  );
}

const uniforms = Object.fromEntries(
  ["uSize", "uWidth", "uTime", "uLifetime", "uOpacity"].map(name => [
    name,
    gl.getUniformLocation(program, name)
  ])
);

let capacity = 0;
let start = 0;
let count = 0;
let births = new Float64Array(0);
let pending = [];
let trailClock = 0;
let contextLost = false;

const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

let width = 1;
let height = 1;
let points = [];
let baseHue = 185;
let time = 0;
let accumulator = 0;
let previous = null;
let sceneKey = "";
let resolutionKey = "";
let lastTap = null;

const mouse = {
  x: 0,
  y: 0,
  targetX: 0,
  targetY: 0,
  previousX: 0,
  previousY: 0,
  vx: 0,
  vy: 0,
  active: false,
  held: false,
  influence: 0
};

const random = (min, max) => min + Math.random() * (max - min);

const clamp = (value, min, max) =>
  Math.max(min, Math.min(max, value));

function backgroundColor(alpha = 1) {
  return `rgba(${config.canvas.backgroundColor.join(",")},${alpha})`;
}

function clearCanvas() {
  // Bound retained geometry to about 54 MB on the GPU. Very dense settings
  // can retire the oldest segments early when this budget is reached.
  capacity = Math.max(
    2048,
    Math.min(
      250000,
      Math.ceil(
        config.ribbons.points *
        config.ribbons.stepsPerSecond *
        config.canvas.trailLifetime *
        2
      )
    )
  );

  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);

  gl.bufferData(
    gl.ARRAY_BUFFER,
    capacity * 6 * stride,
    gl.DYNAMIC_DRAW
  );

  births = new Float64Array(capacity);
  start = 0;
  count = 0;
  pending = [];
  trailClock = 0;

  renderTrails();
}

function uploadTrails() {
  if (!pending.length) return;

  let data = new Float32Array(pending);
  pending = [];

  let segments = data.length / 54;

  if (segments > capacity) {
    data = data.subarray((segments - capacity) * 54);
    segments = capacity;
  }

  const overflow = Math.max(0, count + segments - capacity);

  start = (start + overflow) % capacity;
  count -= overflow;

  const end = (start + count) % capacity;
  const first = Math.min(segments, capacity - end);

  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);

  gl.bufferSubData(
    gl.ARRAY_BUFFER,
    end * 6 * stride,
    data.subarray(0, first * 54)
  );

  if (first < segments) {
    gl.bufferSubData(
      gl.ARRAY_BUFFER,
      0,
      data.subarray(first * 54)
    );
  }

  for (let i = 0; i < segments; i++) {
    births[(end + i) % capacity] = data[i * 54 + 7];
  }

  count += segments;
}

function renderTrails() {
  if (contextLost) return;

  uploadTrails();

  while (
    count &&
    trailClock - births[start] >= config.canvas.trailLifetime
  ) {
    start = (start + 1) % capacity;
    count--;
  }

  const color = config.canvas.backgroundColor;

  gl.clearColor(
    color[0] / 255,
    color[1] / 255,
    color[2] / 255,
    1
  );

  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND);

  gl.blendFunc(
    gl.SRC_ALPHA,
    config.colors.additive ? gl.ONE : gl.ONE_MINUS_SRC_ALPHA
  );

  gl.uniform2f(uniforms.uSize, width, height);
  gl.uniform1f(uniforms.uWidth, config.ribbons.lineWidth);
  gl.uniform1f(uniforms.uTime, trailClock);

  gl.uniform1f(
    uniforms.uLifetime,
    Math.max(0.5, config.canvas.trailLifetime)
  );

  gl.uniform1f(uniforms.uOpacity, config.ribbons.opacity);

  const first = Math.min(count, capacity - start);

  if (first) {
    gl.drawArrays(gl.TRIANGLES, start * 6, first * 6);
  }

  if (first < count) {
    gl.drawArrays(gl.TRIANGLES, 0, (count - first) * 6);
  }
}

function rgbFromHsl(hue, saturation, lightness) {
  const h = ((hue % 360) + 360) % 360 / 60;
  const s = saturation / 100;
  const l = lightness / 100;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs(h % 2 - 1));
  const m = l - c * 0.5;

  const choices = [
    [c, x, 0],
    [x, c, 0],
    [0, c, x],
    [0, x, c],
    [x, 0, c],
    [c, 0, x]
  ];

  return choices[Math.floor(h)].map(channel => channel + m);
}

function appendSegment(a, b, color) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const length = Math.hypot(dx, dy);

  if (length < 0.0001) return;

  const nx = -dy / length;
  const ny = dx / length;

  for (const [point, side] of [
    [a, -1],
    [b, -1],
    [a, 1],
    [a, 1],
    [b, -1],
    [b, 1]
  ]) {
    pending.push(
      point.x,
      point.y,
      nx * side,
      ny * side,
      color[0],
      color[1],
      color[2],
      trailClock,
      side
    );
  }
}

function makePoint() {
  const angle = random(0, Math.PI * 2);

  return {
    x: random(0, width),
    y: random(0, height),
    vx: Math.cos(angle) * config.ribbons.speed,
    vy: Math.sin(angle) * config.ribbons.speed,
    hueOffset: random(-0.5, 0.5),
    phase: random(0, Math.PI * 2),
    neighbor: 0
  };
}

function currentSceneKey() {
  return JSON.stringify([
    config.ribbons.points,
    config.canvas.trailLifetime,
    config.ribbons.stepsPerSecond,
    config.colors.hue,
    config.colors.randomizeOnReset
  ]);
}

function reset() {
  points = Array.from(
    { length: Math.max(2, Math.round(config.ribbons.points)) },
    makePoint
  );

  points.forEach((point, index) => {
    const offset =
      1 + Math.floor(Math.random() * (points.length - 1));

    point.neighbor = (index + offset) % points.length;
  });

  baseHue = config.colors.randomizeOnReset
    ? random(0, 360)
    : config.colors.hue;

  time = 0;
  accumulator = 0;
  sceneKey = currentSceneKey();

  clearCanvas();
}

function resize() {
  width = innerWidth;
  height = innerHeight;

  const ratio = Math.min(
    devicePixelRatio || 1,
    config.canvas.pixelRatio
  );

  canvas.width = Math.round(width * ratio);
  canvas.height = Math.round(height * ratio);

  gl.viewport(0, 0, canvas.width, canvas.height);

  resolutionKey = String(config.canvas.pixelRatio);
  reset();
}

function refresh() {
  if (resolutionKey !== String(config.canvas.pixelRatio)) {
    resize();
  } else if (sceneKey !== currentSceneKey()) {
    reset();
  }
}

function pointerStrength() {
  if (!config.mouse.enabled) return 0;

  return mouse.influence *
    (mouse.held ? config.mouse.holdMultiplier : 1);
}

function influenceAt(x, y) {
  const distance = Math.hypot(x - mouse.x, y - mouse.y);
  const u = clamp(distance / config.mouse.radius, 0, 1);

  return Math.pow(1 - u * u, 2) * pointerStrength();
}

function nearestOnSegment(a, b) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const lengthSquared = dx * dx + dy * dy;

  const t = lengthSquared > 0.001
    ? clamp(
        (
          (mouse.x - a.x) * dx +
          (mouse.y - a.y) * dy
        ) / lengthSquared,
        0,
        1
      )
    : 0.5;

  return {
    x: a.x + dx * t,
    y: a.y + dy * t,
    t
  };
}

function forceAt(x, y, influence) {
  const dx = mouse.x - x;
  const dy = mouse.y - y;
  const distance = Math.hypot(dx, dy);
  const denominator = Math.max(distance, 25);

  return {
    x: (
      dx / denominator * config.mouse.attraction -
      dy / denominator * config.mouse.swirl +
      mouse.vx * config.mouse.dragStrength
    ) * influence,

    y: (
      dy / denominator * config.mouse.attraction +
      dx / denominator * config.mouse.swirl +
      mouse.vy * config.mouse.dragStrength
    ) * influence
  };
}

function updatePoints(dt) {
  const forces = points.map(point =>
    forceAt(
      point.x,
      point.y,
      influenceAt(point.x, point.y)
    )
  );

  // Pull on nearby connections even when both endpoints are far away.
  points.forEach((point, index) => {
    const neighborIndex = point.neighbor;
    const neighbor = points[neighborIndex];
    const nearest = nearestOnSegment(point, neighbor);

    const influence =
      influenceAt(nearest.x, nearest.y) *
      config.mouse.flowInfluence;

    if (influence <= 0) return;

    const force = forceAt(nearest.x, nearest.y, influence);

    const aWeight = 0.25 + (1 - nearest.t) * 0.75;
    const bWeight = 0.25 + nearest.t * 0.75;

    forces[index].x += force.x * aWeight;
    forces[index].y += force.y * aWeight;

    forces[neighborIndex].x += force.x * bWeight;
    forces[neighborIndex].y += force.y * bWeight;
  });

  points.forEach((point, index) => {
    const turn =
      Math.sin(time * 0.35 + point.phase) *
      config.ribbons.curvature;

    const cos = Math.cos(turn * dt);
    const sin = Math.sin(turn * dt);
    const vx = point.vx * cos - point.vy * sin;
    const vy = point.vx * sin + point.vy * cos;

    point.vx = vx + forces[index].x * dt;
    point.vy = vy + forces[index].y * dt;

    const speed = Math.hypot(point.vx, point.vy);

    if (speed > 0.001) {
      const relaxedSpeed =
        speed +
        (config.ribbons.speed - speed) *
        (1 - Math.exp(-1.4 * dt));

      const limitedSpeed = Math.min(
        relaxedSpeed,
        Math.max(40, config.ribbons.speed * 4)
      );

      point.vx *= limitedSpeed / speed;
      point.vy *= limitedSpeed / speed;
    }

    point.x += point.vx * dt;
    point.y += point.vy * dt;

    if (point.x < 0) {
      point.x = -point.x;
      point.vx = Math.abs(point.vx);
    } else if (point.x > width) {
      point.x = width - (point.x - width);
      point.vx = -Math.abs(point.vx);
    }

    if (point.y < 0) {
      point.y = -point.y;
      point.vy = Math.abs(point.vy);
    } else if (point.y > height) {
      point.y = height - (point.y - height);
      point.vy = -Math.abs(point.vy);
    }

    point.x = clamp(point.x, 0, width);
    point.y = clamp(point.y, 0, height);
  });
}

function bendPoint(x, y) {
  const influence = influenceAt(x, y);
  if (influence <= 0) return { x, y };

  const dx = x - mouse.x;
  const dy = y - mouse.y;
  const distance = Math.hypot(dx, dy);
  const denominator = Math.max(distance, 25);

  const pull = clamp(config.mouse.attraction / 200, -1, 1);
  const twist = clamp(config.mouse.swirl / 200, -1.5, 1.5);
  const bend = config.mouse.ribbonBend * influence;

  const dragScale =
    config.mouse.dragStrength * influence * 0.035;

  return {
    x:
      x +
      (-dx / denominator * pull - dy / denominator * twist) * bend +
      mouse.vx * dragScale,

    y:
      y +
      (-dy / denominator * pull + dx / denominator * twist) * bend +
      mouse.vy * dragScale
  };
}

function drawConnection(point) {
  const neighbor = points[point.neighbor];

  const hue = (
    baseHue +
    point.hueOffset * config.colors.hueSpread +
    time * config.colors.hueDrift +
    360
  ) % 360;

  const color = rgbFromHsl(
    hue,
    config.colors.saturation,
    config.colors.lightness
  );

  const nearest = nearestOnSegment(point, neighbor);
  const affected = influenceAt(nearest.x, nearest.y) > 0.001;

  if (!affected) {
    appendSegment(point, neighbor, color);
    return;
  }

  const length = Math.hypot(
    neighbor.x - point.x,
    neighbor.y - point.y
  );

  const samples = Math.min(
    64,
    Math.max(
      8,
      Math.ceil(length / Math.max(10, config.mouse.radius / 12))
    )
  );

  let previousPoint = bendPoint(point.x, point.y);

  for (let i = 1; i <= samples; i++) {
    const t = i / samples;

    const nextPoint = bendPoint(
      point.x + (neighbor.x - point.x) * t,
      point.y + (neighbor.y - point.y) * t
    );

    appendSegment(previousPoint, nextPoint, color);
    previousPoint = nextPoint;
  }
}

function simulateStep(dt) {
  time += dt;
  trailClock += dt;
  updatePoints(dt);

  for (const point of points) {
    drawConnection(point);
  }
}

function frame(timestamp) {
  const realDt = previous === null
    ? 0
    : Math.min((timestamp - previous) / 1000, 0.05);

  previous = timestamp;

  if (contextLost) {
    requestAnimationFrame(frame);
    return;
  }

  const smoothing =
    1 - Math.exp(-config.mouse.smoothing * realDt);

  mouse.x += (mouse.targetX - mouse.x) * smoothing;
  mouse.y += (mouse.targetY - mouse.y) * smoothing;

  mouse.influence +=
    ((mouse.active ? 1 : 0) - mouse.influence) * smoothing;

  const rawVx = realDt > 0
    ? (mouse.x - mouse.previousX) / realDt
    : 0;

  const rawVy = realDt > 0
    ? (mouse.y - mouse.previousY) / realDt
    : 0;

  const velocityResponse = 1 - Math.exp(-12 * realDt);

  mouse.vx +=
    (clamp(rawVx, -600, 600) - mouse.vx) * velocityResponse;

  mouse.vy +=
    (clamp(rawVy, -600, 600) - mouse.vy) * velocityResponse;

  mouse.previousX = mouse.x;
  mouse.previousY = mouse.y;

  const still =
    config.animation.paused ||
    (
      config.animation.respectReducedMotion &&
      reducedMotion.matches
    );

  const dt = still ? 0 : realDt * config.animation.speed;

  accumulator += dt;

  const stepDt = 1 / config.ribbons.stepsPerSecond;
  let iterations = 0;

  while (accumulator >= stepDt && iterations < 180) {
    simulateStep(stepDt);
    accumulator -= stepDt;
    iterations++;
  }

  if (iterations === 180) {
    accumulator = Math.min(accumulator, stepDt);
  }

  renderTrails();
  requestAnimationFrame(frame);
}

function updatePointer(event) {
  if (event.target.closest?.("[data-background-editor]")) {
    deactivatePointer();
    return false;
  }

  if (!mouse.active) {
    mouse.x = event.clientX;
    mouse.y = event.clientY;
    mouse.previousX = event.clientX;
    mouse.previousY = event.clientY;
    mouse.vx = 0;
    mouse.vy = 0;
  }

  mouse.targetX = event.clientX;
  mouse.targetY = event.clientY;
  mouse.active = true;

  return true;
}

function deactivatePointer() {
  mouse.active = false;
  mouse.held = false;
  mouse.vx = 0;
  mouse.vy = 0;
}

addEventListener("pointermove", updatePointer);

addEventListener("pointerdown", event => {
  if (!updatePointer(event)) return;
  if (event.pointerType === "mouse" && event.button !== 0) return;

  mouse.held = true;

  if (
    event.pointerType !== "mouse" &&
    config.mouse.doubleClickToReset
  ) {
    const now = performance.now();

    if (
      lastTap &&
      now - lastTap.time < 350 &&
      Math.hypot(
        event.clientX - lastTap.x,
        event.clientY - lastTap.y
      ) < 35
    ) {
      reset();
      lastTap = null;
    } else {
      lastTap = {
        time: now,
        x: event.clientX,
        y: event.clientY
      };
    }
  }
});

addEventListener("pointerup", event => {
  mouse.held = false;

  if (event.pointerType !== "mouse") {
    mouse.active = false;
  }
});

addEventListener("dblclick", event => {
  if (
    config.mouse.doubleClickToReset &&
    !event.target.closest?.("[data-background-editor]")
  ) {
    reset();
  }
});

addEventListener("pointercancel", deactivatePointer);
addEventListener("blur", deactivatePointer);

document.documentElement.addEventListener(
  "pointerleave",
  deactivatePointer
);

document.addEventListener("visibilitychange", () => {
  previous = null;
  accumulator = 0;
  deactivatePointer();
});

addEventListener("resize", () => {
  if (!contextLost) resize();
});

canvas.addEventListener("webglcontextlost", event => {
  event.preventDefault();
  contextLost = true;
  previous = null;
});

// All GPU resources must be rebuilt after restoration.
canvas.addEventListener("webglcontextrestored", () => {
  location.reload();
});

resize();

const previewSteps = 450;

for (let i = 0; i < previewSteps; i++) {
  simulateStep(1 / config.ribbons.stepsPerSecond);

  if (i % 30 === 0) {
    uploadTrails();
  }
}

renderTrails();
requestAnimationFrame(frame);

if (config.panel.enabled) {
  import("./settings-editor.js")
    .then(({ createSettingsEditor }) => {
      createSettingsEditor({
        config,
        onChange: refresh,
        onReset: reset
      });
    })
    .catch(error => {
      console.error("Editor could not load:", error);
    });
}
</script>
</body>
</html>
