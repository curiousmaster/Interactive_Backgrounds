        }

        h2 {
            margin: 0 0 12px;

        }

            border: 1px solid #ffffff24;
            border-radius: 5px;
            padding: 6px;
        }

            padding: 0;
            accent-color: #8aaaff;
        }

        input[type=checkbox] {
            accent-color: #8aaaff;
        }

        #settings>input,#settings>select,textarea {
            width: 100%;
            margin-bottom: 8px;
        }

            display: flex;
            gap: 5px;
            margin-bottom: 8px;
        }

            min-width: 0;

            width: 34px;
            font-size: 20px;
            line-height: 1;

            cursor: default;
        }

            border-top: 1px solid #ffffff18;
            padding: 8px 0;
        }

        #settings details details {
            margin-left: 12px;
            padding-left: 8px;
            border-left: 1px solid #ffffff20;
        }

        summary {
            cursor: pointer;
            font-weight: 600;

        .setting {
