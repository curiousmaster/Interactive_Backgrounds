<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Spectral Prism</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #030308;
            color: #e4eaff;
            font: 13px system-ui;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        #settings {
            position: fixed;
            top: 48px;
            right: 12px;
            width: min(350px,calc(100vw - 24px));
            max-height: calc(100dvh - 60px);
            overflow: auto;
            padding: 14px;
            background: #101522e8;
            border: 1px solid #ffffff24;
            border-radius: 12px;
            backdrop-filter: blur(16px);
        }

        #settingsToggle {
            position: fixed;
            top: 10px;
            right: 12px;
        }

        h2 {
            margin: 0 0 12px;
            font-size: 18px;
        }

        input,select,button,textarea {
            font: inherit;
            color: inherit;
            background: #20283a;
            border: 1px solid #ffffff24;
            border-radius: 5px;
            padding: 6px;
        }

        input[type=range] {
            width: 100%;
            padding: 0;
            accent-color: #8aaaff;
        }

        input[type=checkbox] {
            accent-color: #8aaaff;
        }

        #settings>input,#settings>select,textarea {
            width: 100%;
            margin-bottom: 8px;
        }

        details {
            border-top: 1px solid #ffffff18;
            padding: 8px 0;
        }

        summary {
            cursor: pointer;
            font-weight: 600;
        }

        .setting {
            display: grid;
            grid-template-columns: 1fr minmax(70px,110px) 42px;
            align-items: center;
            gap: 5px;
            margin: 7px 0;
        }

        .setting[hidden],[hidden] {
            display: none!important;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        #stats {
            position: fixed;
            left: 12px;
            top: 12px;
            pointer-events: none;
            white-space: pre;
        }

        #error {
            position: fixed;
            bottom: 12px;
            left: 12px;
            color: #ffb4b4;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="stats"></div>
    <div id="error"></div>

                        }
                        co.setXYZ(i, rr, gg, bb);
                    }
                    co.needsUpdate = true;
                }
            }
            bloom.enabled = c.bloom.enabled;
            bloom.strength = c.bloom.strength + (c.effects.flare ? .25 : 0);
            bloom.radius = c.bloom.radius;
            bloom.threshold = c.bloom.threshold;
            composer.render();
            document.querySelector('#stats').textContent = c.controls.showStats ? `Prisms: ${objects.length}\nSegments: ${segments}\nInterfaces: ${hits}\nFPS: ${Math.round(1 / Math.max(dt, .001))}` : '';
        }
        resize();
        requestAnimationFrame(frame);
    </script>
</body>
</html>
