<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar System</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box }
  [hidden] { display: none !important }
  :root { color-scheme: dark; font: 14px/1.45 system-ui,sans-serif; color:#edf3ff }
  html, body { margin:0; height:100%; overflow:hidden }
  body { background:#050812 }
  canvas { display:block; width:100%; height:100%; touch-action:none }
  button, select, input { font:inherit; accent-color:#8db5ff }
  button, select, input:not([type=range],[type=checkbox],[type=file]) {
    color:inherit; background:#192640; border:1px solid #49638a; border-radius:.4rem; padding:.35rem .55rem
  }
  button { cursor:pointer }
  button[aria-pressed=true] { background:#36527d }
  a { color:#afceff }
  #solar-settings { position:fixed; top:.75rem; right:.75rem; z-index:6 }
  #solar-settings > button { display:block; margin-left:auto }
  .settings-panel, #card, #controls { background:#0b1324d9; border:1px solid #395079; border-radius:.65rem; backdrop-filter:blur(10px) }
  .settings-panel { margin-top:.5rem; width:min(22rem,calc(100vw - 1.5rem)); max-height:calc(100dvh - 4rem); overflow:auto; padding:.8rem }
  h2 { margin:0 0 .55rem; font-size:1.1rem }
  .settings-panel details { border-top:1px solid #314260; padding:.45rem 0 }
  .settings-panel summary { cursor:pointer; font-weight:650 }
  .settings-panel label { display:block; margin:.45rem 0 }
  .settings-panel input[type=search], .settings-panel input[type=range] { width:100% }
  .settings-panel output { float:right; color:#a8c4ef }
  .settings-actions, #controls { display:flex; flex-wrap:wrap; gap:.4rem; align-items:center }
  #controls { position:fixed; bottom:.75rem; left:.75rem; max-width:calc(100vw - 1.5rem); padding:.45rem; z-index:5 }
  #clock { padding:0 .4rem; font-variant-numeric:tabular-nums }
  #labels, #leader { position:fixed; inset:0; width:100%; height:100%; pointer-events:none }
  #labels span { position:absolute; color:#c7d8f3; font-size:11px; white-space:nowrap; text-shadow:0 1px 5px black }
  #card { position:fixed; width:min(17rem,calc(100vw - 1.5rem)); padding:.75rem; z-index:4 }
  #card:not(.pinned) { pointer-events:none }
  #card p { margin:.35rem 0 }
  #card button { margin:.45rem .35rem 0 0 }
  #timeline-panel, #observer-panel, #compare-panel, #tour-panel {
    flex-basis:100%; display:flex; align-items:center; flex-wrap:wrap; gap:.4rem
  }
  #compare-pair { display:flex; flex-wrap:wrap; align-items:center; gap:.4rem }
  #events { max-width:100% }
  #event-status { color:#b7cce7 }
  #toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:.4rem }
  .timeline-row { display:flex; flex:1 0 100%; min-width:0; align-items:center; gap:.5rem }
  .timeline-row input[type=range] { flex:1 1 0; min-width:0 }
  #speed-value { min-width:4.5ch; text-align:right; font-variant-numeric:tabular-nums }
  #labels span { opacity:var(--label-opacity,1); transition:opacity .18s }
  #labels, #leader, #card, #controls, #solar-settings { transition:opacity .45s }
  body.ambient #labels, body.ambient #leader, body.ambient #card,
  body.ambient #controls, body.ambient #solar-settings { opacity:0; pointer-events:none }
  @media (max-width:520px) { #toolbar { gap:.3rem } #clock { font-size:.8rem } #controls button { padding:.3rem .45rem } }
  #status { position:fixed; top:.85rem; left:.85rem; max-width:calc(100vw - 10rem); color:#afd0fa }
</style>
</head>
<body>
<div id="status" role="status">Loading Solar System…</div>
<div id="labels" aria-hidden="true"></div>
<svg id="leader" aria-hidden="true"><path fill="none" stroke="#9dbce8" stroke-opacity=".75" /></svg>
<aside id="card" aria-label="Object information" hidden></aside>
<nav id="controls" aria-label="Simulation controls" hidden>
  <div id="timeline-panel" hidden>
    <div class="timeline-row">
      <label for="scrub">Timeline</label>
      <input id="scrub" type="range">
      <button id="timeline-center" type="button" title="Center the timeline on the current simulation time">Recenter</button>
    </div>
    <div class="timeline-row">
      <label for="timeline-speed">Speed (days/s)</label>
      <input id="timeline-speed" type="range">
      <output id="speed-value" for="timeline-speed"></output>
    </div>
    <input id="date" type="datetime-local" aria-label="Simulation date and time (UTC)">
    <select id="events" aria-label="Jump to an event">
      <option value="">Jump to an event…</option>
    </select>
    <output id="event-status" aria-live="polite"></output>
  </div>
  <div id="observer-panel" hidden>
    <label for="observer-world">View from</label>
    <select id="observer-world"><option>Earth</option><option>Mars</option><option>Titan</option></select>
    <label for="observer-target">Look at</label><select id="observer-target"></select>
    <span id="observer-info"></span>
  </div>
  <div id="compare-panel" hidden>
    <label for="compare-mode">Compare</label>
    <select id="compare-mode"><option value="planets">All planets</option><option value="pair">Two bodies</option></select>
    <div id="compare-pair" hidden>
      <select id="compare-first" aria-label="First body"></select>
      <label for="compare-second">with</label><select id="compare-second"></select>
      <span id="compare-info"></span>
    </div>
    <button id="compare-fit" type="button">Fit to view</button>
  </div>
  <div id="tour-panel" hidden><span id="tour-stop"></span><button id="tour-next">Next flyby</button></div>
  <div id="toolbar">
  <button id="two">2D</button><button id="three">3D</button>
  <button id="pause">Pause</button><button id="now">Now</button>
  <button id="overview" hidden>Overview</button>
  <select id="inspect" aria-label="Inspect object"><option value="">Inspect object…</option></select>
  <button id="timeline" aria-controls="timeline-panel">Timeline</button>
  <button id="tour" aria-controls="tour-panel">Flybys</button>
  <button id="observer" aria-controls="observer-panel">Observer</button>
  <button id="compare" aria-controls="compare-panel">Compare</button>
  <time id="clock"></time>
  </div>
</nav>
<script src="./settings-editor.js"></script>
<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<script type="module">
const $ = id => document.getElementById(id);
try {
  const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js');
  start(THREE);
} catch (error) {
  $('status').textContent = 'Unable to start the solar system. WebGL and access to the Three.js CDN are required.';
  console.error(error);
}

function start(T) {
  const astro = window.Astronomy;
  const tau = 2 * Math.PI;
  const rad = Math.PI / 180;
  const day = 86400000;
  const epoch = Date.UTC(2000, 0, 1, 12);
  const minTime = Date.UTC(1800,0,1);
  const maxTime = Date.UTC(2050,11,31,23,59,59);
  const maxZoom = 100;
  const minute = 60000;
  const clockInterval = 1000;
  const speedRange = {min:-60,max:60,step:.05};
  const defaults = {
    mode:'3d', tilt:38, zoom:1, orbit:false, orbitSpeed:3, speed:1,
    paused:false, size:1, moonSize:1, stars:true, trails:true, trailOpacity:.45,
    moons:true, rings:true, labels:true, textures:location.protocol !== 'file:',
    highResolution:false, background:'#050812', cursorZoom:true, smartLabels:true,
    timeline:true, flybys:true, idleTour:false, tourDelay:25, flybyDuration:18,
    shadows:true, earthLights:true, earthClouds:true, earthAtmosphere:true,
    asteroidBelt:true, ringGrains:true, observerView:true, comparison:true,
    comets:true, cometTails:true, ambient:false, ambientDelay:8
  };
  const config = { ...defaults };
  const presets = {
    'Solar overview': {}, 'Flat atlas': { mode:'2d' }, 'Slow orbit': { orbit:true, speed:4 },
    'Quiet background': { ambient:true, idleTour:true, orbit:true, speed:.05, trailOpacity:.24 }
  };
  const is3d = c => c.mode === '3d';
  const sections = {
    View: [
      {key:'mode',label:'View mode',options:{'2d':'2D · top down','3d':'3D · perspective'}},
      {key:'tilt',label:'Camera tilt',min:5,max:85,step:1,when:is3d},
      {key:'zoom',label:'Zoom',min:.6,max:maxZoom,step:.05},
      {key:'orbit',label:'Auto-orbit camera',when:is3d},
      {key:'orbitSpeed',label:'Camera orbit speed (°/s)',min:.5,max:15,step:.5,when:c=>is3d(c)&&c.orbit}
    ],
    Time: [
      {key:'paused',label:'Pause simulation'},
      {key:'speed',label:'Simulation days per second',...speedRange}
    ],
    Features: [
      {key:'trails',label:'Orbital paths'},
      {key:'trailOpacity',label:'Path opacity',min:.05,max:1,step:.05,when:c=>c.trails},
      {key:'moons',label:'Moons in planet focus'},
      {key:'moonSize',label:'Moon size multiplier',min:.5,max:3,step:.1,when:c=>c.moons},
      {key:'rings',label:'Planetary rings'},
      {key:'textures',label:'Texture maps'},
      {key:'highResolution',label:'Optional 8K close-up maps',when:c=>c.textures},
      {key:'cursorZoom',label:'Zoom toward the cursor'},
      {key:'smartLabels',label:'Zoom-aware labels and paths'},
      {key:'timeline',label:'Timeline and event bookmarks'},
      {key:'shadows',label:'Moon and ring shadows'},
      {key:'earthLights',label:'Earth night lights'},
      {key:'earthClouds',label:'Earth clouds'},
      {key:'earthAtmosphere',label:'Earth atmosphere'},
      {key:'asteroidBelt',label:'Asteroid belt'},
      {key:'ringGrains',label:'Saturn ring grains',when:c=>c.rings},
      {key:'observerView',label:'Observer view'},
      {key:'comparison',label:'Body size comparison'},
      {key:'comets',label:'Comets'},
      {key:'cometTails',label:'Comet ion and dust tails',when:c=>c.comets},
      {key:'labels',label:'Object labels'},
      {key:'stars',label:'Star field'}
    ],
    'Flybys and ambient': [
      {key:'flybys',label:'Cinematic flybys'},
      {key:'flybyDuration',label:'Seconds per flyby',min:8,max:45,step:1,when:c=>c.flybys},
      {key:'idleTour',label:'Start or resume flybys when idle',when:c=>c.flybys},
      {key:'tourDelay',label:'Idle time before flybys (s)',min:5,max:120,step:1,when:c=>c.flybys&&c.idleTour},
      {key:'ambient',label:'Ambient mode'},
      {key:'ambientDelay',label:'Idle time before hiding controls (s)',min:3,max:60,step:1,when:c=>c.ambient}
    ],
    Style: [
      {key:'size',label:'Overview body size multiplier',min:.5,max:3,step:.1},
      {key:'background',label:'Background color',validate:v=>CSS.supports('color',v)}
    ]
  };

  // J2000 mean elements and rates per Julian century (JPL approximate planet positions).
  // Fields: semimajor axis (AU), eccentricity, inclination, mean longitude,
  // longitude of perihelion, longitude of ascending node.
  const elements = [
    [[.38709927,.20563593,7.00497902,252.25032350,77.45779628,48.33076593],[.00000037,.00001906,-.00594749,149472.67411175,.16047689,-.12534081]],
    [[.72333566,.00677672,3.39467605,181.97909950,131.60246718,76.67984255],[.0000039,-.00004107,-.00078890,58517.81538729,.00268329,-.27769418]],
    [[1.00000261,.01671123,-.00001531,100.46457166,102.93768193,0],[.00000562,-.00004392,-.01294668,35999.37244981,.32327364,0]],
    [[1.52371034,.09339410,1.84969142,-4.55343205,-23.94362959,49.55953891],[.00001847,.00007882,-.00813131,19140.30268499,.44441088,-.29257343]],
    [[5.202887,.04838624,1.30439695,34.39644051,14.72847983,100.47390909],[-.00011607,-.00013253,-.00183714,3034.74612775,.21252668,.20469106]],
    [[9.53667594,.05386179,2.48599187,49.95424423,92.59887831,113.66242448],[-.00125060,-.00050991,.00193609,1222.49362201,-.41897216,-.28867794]],
    [[19.18916464,.04725744,.77263783,313.23810451,170.95427630,74.01692503],[-.00196176,-.00004397,-.00242939,428.48202785,.40805281,.04240589]],
    [[30.06992276,.00859048,1.77004347,-55.12002969,44.96476227,131.78422574],[.00026291,.00005105,.00035372,218.45945325,-.32241464,-.00508664]]
  ];
  const planetRows = [
    ['Mercury',2439.7,87.969,58.646,.034,'#a39788','mercury',.14],
    ['Venus',6051.8,224.701,-243.025,2.64,'#dcba85','venus_atmosphere',.19],
    ['Earth',6371,365.256,.99727,23.44,'#5395dc','earth_daymap',.2],
    ['Mars',3389.5,686.980,1.02596,25.19,'#d07957','mars',.16],
    ['Jupiter',69911,4332.59,.41354,3.13,'#d4aa82','jupiter',.52],
    ['Saturn',58232,10759.22,.444,26.73,'#dfc390','saturn',.44],
    ['Uranus',25362,30688.5,.71833,97.77,'#9bd5d8','uranus',.32],
    ['Neptune',24622,60182,.67125,28.32,'#5b85d1','neptune',.31]
  ];
  // Approximate satellite elements: radius (km), orbital semimajor axis (km), period
  // (days), eccentricity, inclination relative to the chosen reference plane.
  const moonRows = {
    Earth:[['Moon',1737.4,384400,27.322,.0549,5.15,'#bbb8b5','moon']],
    Mars:[['Phobos',11.1,9376,.319,.0151,1.08],['Deimos',6.2,23463,1.263,.0003,1.79]],
    Jupiter:[['Io',1821.6,421700,1.769,.0041,.04,'#e6be73'],['Europa',1560.8,671034,3.551,.009,.47,'#e3c9a4'],['Ganymede',2634.1,1070412,7.155,.0013,.2],['Callisto',2410.3,1882709,16.689,.0074,.28]],
    Saturn:[['Mimas',198.2,185539,.942,.0196,1.57],['Enceladus',252.1,238042,1.370,.0047,.02,'#d8e5ef'],['Tethys',531.1,294672,1.888,.0001,1.09],['Dione',561.4,377415,2.737,.0022,.03],['Rhea',763.8,527068,4.518,.001,.35],['Titan',2574.7,1221870,15.945,.0288,.35,'#d7a566'],['Iapetus',734.5,3560820,79.3215,.0283,15.47]],
    Uranus:[['Miranda',235.8,129900,1.413,.0013,4.34],['Ariel',578.9,190900,2.520,.0012,.04],['Umbriel',584.7,266000,4.144,.0039,.13],['Titania',788.9,436300,8.706,.0011,.08],['Oberon',761.4,583500,13.463,.0014,.07]],
    Neptune:[['Proteus',210,117647,1.122,.0005,.04],['Triton',1353.4,354759,5.877,.00002,156.83,'#c8b5ac'],['Nereid',170,5513400,360.14,.75,7.23]]
  };

  const scene = new T.Scene();
  const renderer = new T.WebGLRenderer({ alpha:true, antialias:true });
  renderer.setClearColor(0,0);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  document.body.prepend(renderer.domElement);
  const canvas = renderer.domElement;
  const perspective = new T.PerspectiveCamera(44,1,.005,5000);
  const flat = new T.OrthographicCamera(-1,1,1,-1,.005,5000);
  const ray = new T.Raycaster();
  const sphere = new T.SphereGeometry(1,40,28);
  const detailSphere = new T.SphereGeometry(1,96,64);
  const light = new T.DirectionalLight(0xfff0da,2.1);
  const sunlight = new T.PointLight(0xfff0da,2.1,0,0);
  scene.add(light,light.target,sunlight,new T.AmbientLight(0xaabfe8,.58));
  const textureLoader = new T.TextureLoader().setCrossOrigin('anonymous');
  const textureBase = './textures/';
  const textureSource = 'https://www.solarsystemscope.com/textures/';
  const solarRadius = 695700;
  const sun = {name:'Sun',radius:solarRadius,period:0,spin:25.38,tilt:7.25,color:'#ffbb55',map:'sun',display:.72};
  const planets = planetRows.map(([name,radius,period,spin,tilt,color,map,display],index) =>
    ({name,radius,period,spin,tilt,color,map,display,elements:elements[index]}));
  const pluto = {
    name:'Pluto',kind:'Dwarf planet',radius:1188,period:90560,spin:6.38723,tilt:122.53,
    color:'#c7ad97',display:.14,reference:'https://science.nasa.gov/dwarf-planets/pluto/facts/',
    // JPL approximate J2000 elements and rates, valid from 1800 to 2050.
    elements:[[39.48211675,.24882730,17.14001206,238.92903833,224.06891629,110.30393684],
      [-.00031596,.00005170,.00004818,145.20780515,-.04062942,-.01183482]]
  };
  // Holman et al., Table 2. Heliocentric osculating elements at MJD 59337.8171 TDB.
  const ed138 = {
    name:'2026 ED138',kind:'Dwarf planet candidate',diameterEstimate:'612–1,530 km',
    period:365.256*Math.pow(43.269536,1.5),color:'#b9917c',display:.12,
    reference:'https://arxiv.org/abs/2610.38693',
    orbit:{epoch:(59337.8171-40587)*day-69184,a:43.269536,e:.1339372,
      inclination:24.3846266,node:322.797458,perihelion:169.4550,mean:120.4534}
  };
  // JPL Small-Body Database snapshots. Times of perihelion are Julian dates in TDB.
  const comets=[
    ['1P/Halley','1P',2446469.973616,17.928635,.967935996,162.19053,59.098947,112.241431,27728.04609],
    ['2P/Encke','2P',2460240.034840,2.218337,.846996923,11.339612,334.013809,187.283430,1206.81257],
    ['67P/Churyumov–Gerasimenko','67P',2457247.588658,3.462249,.640908131,7.040295,50.135574,12.798250,2353.07607],
    ['C/2020 F3 (NEOWISE)','C/2020 F3',2459034.178898,358.467957,.999178026,128.937503,61.010428,37.278658,2478985.218]
  ].map(([name,designator,tp,a,e,inclination,node,perihelion,period])=>({
    name,kind:'Comet',comet:true,designator,period,display:.085,color:'#8c7c6d',
    reference:'https://ssd.jpl.nasa.gov/tools/sbdb_lookup.html#/?sstr='+encodeURIComponent(designator),
    orbit:{epoch:(tp-2440587.5)*day-69184,a,e,inclination,node,perihelion,mean:0}
  }));
  const [halley,encke,rosettaComet,neowise]=comets;
  const orbitingBodies=[...planets,pluto,ed138,...comets];
  const overviewExtent=Math.max(34,ed138.orbit.a*(1+ed138.orbit.e)*1.04);
  const moons = planets.flatMap(parent => (moonRows[parent.name] || []).map(
    ([name,radius,a,period,e,i,color='#b5a999',map],index) =>
      ({name,parent,radius,a,period,e,i,spin:period,color,map,phase:index*1.62+.6,node:index*.74,tilt:0})));
  const jovianMaps = {Io:'jup1vss2',Europa:'jup2vuu2',Ganymede:'jup3vuu2',Callisto:'jup4vuu2'};
  for (const moon of moons) {
    if (jovianMaps[moon.name]) moon.externalMap = textureBase+jovianMaps[moon.name]+'.jpg';
    if (moon.name === 'Nereid') moon.spin = .480;
  }
  const bodies = [sun,...orbitingBodies,...moons];
  const satellitesByHost = new Map(planets.map(body=>[body,moons.filter(moon=>moon.parent===body)]));
  for (const body of bodies) {
    body.root = new T.Group();
    body.axis = new T.Group();
    body.material = body === sun ? new T.MeshBasicMaterial() : new T.MeshStandardMaterial({roughness:1});
    body.mesh = new T.Mesh(sphere,body.material);
    body.mesh.userData.body = body;
    body.root.add(body.axis);
    body.axis.add(body.mesh);
    scene.add(body.root);
    body.label = document.createElement('span');
    body.label.textContent = body.name;
    $('labels').append(body.label);
    $('inspect').add(new Option(body.parent ? body.name+' · '+body.parent.name : body.name, body.name));
  }

  function loadMap(body, large = false) {
    if ((!body.map && !body.externalMap) || !config.textures || location.protocol==='file:' || (large && body.externalMap)) return;
    const key = large ? 'detail' : 'overview';
    if (body[key]) return;
    body[key] = 'loading';
    const url = body.externalMap || textureBase+(large?'8k_':'2k_')+body.map+'.jpg';
    textureLoader.load(url, texture => {
      texture.colorSpace = T.SRGBColorSpace;
      texture.anisotropy = Math.min(8,renderer.capabilities.getMaxAnisotropy());
      body[key] = texture;
    }, undefined, () => { body[key] = 'unavailable'; });
  }

  const rings = {
    Jupiter:[[1.42,1.81,'#b59b84',.10],[1.81,3.15,'#9d836f',.055]],
    Saturn:[[1.24,2.35,'#dec194',.8]],
    Uranus:[[1.48,1.66,'#91abb3',.12],[1.73,1.80,'#9aaeb5',.23],[1.91,1.98,'#a0bac4',.35]],
    Neptune:[[1.69,1.75,'#8093b7',.13],[2.13,2.36,'#829cc8',.09],[2.53,2.57,'#a3aed0',.25]]
  };
  let saturnMap;
  let saturnRequested = false;
  function loadSaturnMap() {
    if (!config.textures || saturnRequested || location.protocol==='file:') return;
    saturnRequested = true;
    textureLoader.load(textureBase+'2k_saturn_ring_alpha.png',texture=>{
      texture.colorSpace = T.SRGBColorSpace;
      saturnMap = texture;
    },undefined,()=>{});
  }
  for (const body of planets.filter(body => rings[body.name])) {
    body.rings = new T.Group();
    body.axis.add(body.rings);
    for (const [inner,outer,color,opacity] of rings[body.name]) {
      const geometry = new T.RingGeometry(inner,outer,160,12);
      const positions = geometry.attributes.position;
      const uv = geometry.attributes.uv;
      for (let i=0;i<positions.count;i++) {
        const radius = Math.hypot(positions.getX(i),positions.getY(i));
        uv.setXY(i,(radius-inner)/(outer-inner),.5);
      }
      geometry.rotateX(-Math.PI/2);
      const mesh = new T.Mesh(geometry,new T.MeshBasicMaterial({
        color,opacity,side:T.DoubleSide,transparent:true,depthWrite:false
      }));
      mesh.userData.ringStyle = { color,opacity };
      body.rings.add(mesh);
    }
    if (body.name === 'Saturn') {
      const bands = [[1.24,1.53,0x8d755b,.25],[1.53,1.95,0xdac194,.8],[2.03,2.27,0xc3aa85,.63],[2.31,2.35,0xd6bc90,.35]];
      body.fallbackRings = new T.Group();
      body.rings.add(body.fallbackRings);
      for (const [inner,outer,color,opacity] of bands) {
        const geometry = new T.RingGeometry(inner,outer,160);
        geometry.rotateX(-Math.PI/2);
        body.fallbackRings.add(new T.Mesh(geometry,new T.MeshBasicMaterial({

  const starPositions = [];
  let seed = 9147;

  function orbitPoint(a,e,i,node,arg,mean) {
    mean %= tau;
    if (Math.abs(mean)>Math.PI) mean-=Math.sign(mean)*tau;
    let eccentric = e>.8 ? (mean<0 ? -Math.PI : Math.PI) : mean;
    for (let n=0;n<28;n++) {

    const x = a*(Math.cos(eccentric)-e);
    const y = a*Math.sqrt(1-e*e)*Math.sin(eccentric);
    const u = x*Math.cos(arg)-y*Math.sin(arg);
    const v = x*Math.sin(arg)+y*Math.cos(arg);
    return new T.Vector3(u*Math.cos(node)-v*Math.cos(i)*Math.sin(node),v*Math.sin(i),

  function makeCityMap() {

  function createDebris(count,planetary) {

  // Find the closest approach of a Galilean moon's shadow to Jupiter's center.
  function nextShadowTransit(moon,after) {
    function distanceAt(ms) {
      const lightDirection=planetPosition(jupiter,ms).negate().normalize();
      const offset=moonPosition(moon,ms);
      const along=offset.dot(lightDirection);
      return along>0 ? offset.addScaledVector(lightDirection,-along).length() : Infinity;
    }
    const step=day/96;
    const end=Math.min(maxTime,after+Math.max(10,2*moon.period)*day);
    let older=distanceAt(after);
    let previous=distanceAt(after+step);
    for (let ms=after+2*step;ms<=end;ms+=step) {
      const current=distanceAt(ms);
      if (previous<=older && previous<=current && previous<jupiter.radius*1.15) {
        let lo=ms-2*step, hi=ms;
        for (let pass=0;pass<24;pass++) {
          const a=lo+(hi-lo)/3, b=hi-(hi-lo)/3;
          if (distanceAt(a)<distanceAt(b)) hi=b;
          else lo=a;
        }
        const best=(lo+hi)/2;
        if (distanceAt(best)<jupiter.radius) return best;
      }
      older=previous;
      previous=current;
    }
    return NaN;
  }

  function updateObserver(positions) {
    const origin=byName.get($('observer-world').value);
    const target=byName.get($('observer-target').value);
    const center=positions.get(origin);
    observerDirection.copy(positions.get(target)).sub(center).normalize();

    observerEye.copy(center).addScaledVector(observerDirection,origin.radius*1.002);

      target.name+' · '+(2*Math.asin(Math.min(1,target.radius/range))/rad).toFixed(3)+'°';

      const lit=(1+towardSun.dot(direction.normalize().negate()))/2;
      description+=' · '+Math.round(100*lit)+'% illuminated';
    }
    if ($('observer-info').textContent!==description) $('observer-info').textContent=description;
    return origin;
  }

  function comparisonHalfHeight() {
    return Math.max(1.27,comparison.width*.55*height/width)/comparisonZoom;

  function specialCamera() {
    const aspect=width/height;
    if (view==='compare') {
      camera=flat;
      const halfHeight=comparisonHalfHeight();
      flat.left=-halfHeight*aspect;
      flat.right=halfHeight*aspect;
      flat.top=halfHeight;
      flat.bottom=-halfHeight;
      flat.up.copy(yAxis);
      flat.position.set(comparisonCenter.x,comparisonCenter.y,7);
      flat.lookAt(comparisonCenter.x,comparisonCenter.y,0);
      return true;
    }
    if (view==='observer') {
      camera=perspective;
      camera.aspect=aspect;
      camera.fov=observerFov;
      camera.position.set(0,0,0);
      camera.up.copy(yAxis);
      const direction=observerDirection.clone().applyAxisAngle(yAxis,observerYaw);
      const right=direction.clone().cross(yAxis).normalize();
      direction.applyAxisAngle(right,observerPitch);
      camera.lookAt(direction);
      return true;
    }
    if (flyby) {
      const {shot,elapsed}=flyby;
      camera=perspective;
      camera.aspect=aspect;
      camera.fov=aspect<1 ? 52 : 44;
      const p=T.MathUtils.smoothstep(elapsed/config.flybyDuration,0,1);
      const target=shot.follow ? shot.follow.root.position.clone() : new T.Vector3(...shot.target);
      const rotation=shot.host.axis.quaternion;
      const offset=shot.curve.getPoint(p);
      // Keep the Saturn shot in its equatorial plane and start the Earth shot on the dusk limb.
      if (shot.host===saturn) offset.applyQuaternion(rotation);
      if (shot.host===earth) offset.applyAxisAngle(yAxis,Math.atan2(
        solarUniforms.get(earth).solarDirection.value.x,solarUniforms.get(earth).solarDirection.value.z
      )+Math.PI/2);
      camera.position.copy(target).add(offset);
      camera.up.copy(yAxis);
      if (shot.host===saturn) camera.up.applyQuaternion(rotation);
      camera.lookAt(target);
      return true;
    }
    return false;
  }

  function updatePaths() {
    const rebuild = lastFocus!==focus || !Number.isFinite(trailTime) || Math.abs(time-trailTime)>day*120;
    for (const body of [...orbitingBodies,...moons]) {
      body.path.visible = (!body.comet||config.comets) && !view && config.trails && (focus ? body.parent===focus && (config.moons || flyby?.shot.follow===body) : !body.parent);
      const pathDetail = !config.smartLabels ? 1 : focus ?
        T.MathUtils.smoothstep(config.zoom,.75,2.4) : T.MathUtils.lerp(1,.24,T.MathUtils.smoothstep(config.zoom,4,20));
      body.path.material.opacity = config.trailOpacity*pathDetail*(flyby ? .24 : 1);
      body.path.visible &&= body.path.material.opacity>.005;
      if (!rebuild || !body.path.visible) continue;
      rebuildPath(body);
    }
    if (rebuild) { trailTime=time; lastFocus=focus; }
    for (const body of [...orbitingBodies,...moons]) {
      if (body.path.visible && !body.path.geometry.attributes.position) rebuildPath(body);
    }

  function rebuildPath(body) {
    const points = [];
    const cycle = body.period*day;
    for (let sample=0;sample<=160;sample++) {
      // Sample eccentric anomaly so the highly eccentric perihelion arc stays smooth.
      const angle=(sample/160-.5)*tau;
      const date=body.comet ? body.orbit.epoch+(angle-body.orbit.e*Math.sin(angle))/tau*cycle :
        time+(sample/160-.5)*cycle;
      points.push(body.parent ? moonPosition(body,date).multiplyScalar(1/body.parent.radius) : planetPosition(body,date));
    }
    // A satellite or planet can precess during one revolution, so keep the
    // sampled endpoints instead of drawing an artificial closing segment.
    body.path.geometry.dispose();
    body.path.geometry=new T.BufferGeometry().setFromPoints(points);
  }
  // A stylized two-lobed nucleus for 67P.
  const nucleus67P=sphere.clone();
  const nucleusPoints=nucleus67P.attributes.position;
  for (let i=0;i<nucleusPoints.count;i++) {
    const x=nucleusPoints.getX(i);
    const waist=.92-.56*Math.exp(-18*x*x)+.14*x;
    nucleusPoints.setXYZ(i,x*1.35,nucleusPoints.getY(i)*waist,nucleusPoints.getZ(i)*waist+.14*x);
  }
  nucleus67P.computeVertexNormals();
  nucleus67P.computeBoundingSphere();
  const tailSamples=340;
  function createCometTail(body,color) {
    const geometry=new T.BufferGeometry();
    const positions=new T.BufferAttribute(new Float32Array(tailSamples*3),3);
    positions.setUsage(T.DynamicDrawUsage);
    geometry.setAttribute('position',positions);
    const fade=Float32Array.from({length:tailSamples},(_,i)=>(1-i/tailSamples)**1.6);
    geometry.setAttribute('tailFade',new T.BufferAttribute(fade,1));
    const material=new T.ShaderMaterial({
      uniforms:{tint:{value:new T.Color(color)},strength:{value:0},pixelSize:{value:Math.min(devicePixelRatio,2)*5}},
      vertexShader:`
        attribute float tailFade;
        varying float fade;
        uniform float pixelSize;
        void main() {
          fade=tailFade;
          gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);
          gl_PointSize=pixelSize*(.7+.55*tailFade);
        }
      `,
      fragmentShader:`
        varying float fade;
        uniform vec3 tint;
        uniform float strength;
        void main() {
          float glow=max(0.,1.-2.*length(gl_PointCoord-.5));
          gl_FragColor=vec4(tint,glow*glow*fade*strength);
        }
      `,
      transparent:true,depthWrite:false,blending:T.AdditiveBlending
    });
    const points=new T.Points(geometry,material);
    points.frustumCulled=false;
    points.visible=false;
    body.root.add(points);
    return points;
  }
  for (const body of comets) {
    body.ionTail=createCometTail(body,0x70bfff);
    body.dustTail=createCometTail(body,0xffc98e);
  }

  function updateCometTails(body,heliocentric,tailScale) {
    const distance=heliocentric.length();
    const activity=1-T.MathUtils.smoothstep(distance,1.25,5);
    const visible=config.cometTails && activity>.015 && view!=='compare';
    body.ionTail.visible=body.dustTail.visible=visible;
    if (!visible) return;
    const away=heliocentric.clone().normalize();
    const trailing=planetPosition(body,time-.1*day).sub(planetPosition(body,time));
    trailing.addScaledVector(away,-trailing.dot(away)).normalize();
    const side=away.clone().cross(trailing).normalize();
    for (const tail of [body.ionTail,body.dustTail]) {
      const dust=tail===body.dustTail;
      const length=tailScale*activity*(dust?.82:1);
      tail.material.uniforms.strength.value=activity*(dust?.34:.42);
      const positions=tail.geometry.attributes.position;
      for (let i=0;i<tailSamples;i++) {
        const t=(i/tailSamples)**1.85;
        const spread=(dust?.12:.045)*length*(.05+t);
        const angle=i*2.399963;
        const wide=Math.sin(angle)*spread*(.2+.8*Math.sin(i*6.13)**2);
        const narrow=Math.cos(angle)*spread;
        const along=t*length;
        const curve=dust ? -.46*length*t*t : 0;
        positions.setXYZ(i,away.x*along+side.x*wide+trailing.x*(narrow-curve),
          away.y*along+side.y*wide+trailing.y*(narrow-curve),
          away.z*along+side.z*wide+trailing.z*(narrow-curve));
      }
      positions.needsUpdate=true;
    }
  }

  function updateBodies(date,positions) {
    loadSaturnMap();
    const comparing=view==='compare';
    const observer=view==='observer' ? updateObserver(positions) : null;
    pickList.length=0;
    for (const body of bodies) {
      const comparisonBody=comparing ? comparison.bodies.get(body) : null;
      const visible=comparing ? Boolean(comparisonBody) :
        observer ? (body.radius||body.name===$('observer-target').value) && body!==observer && (!body.parent||config.moons||body.name===$('observer-target').value) :
        focus ? body===focus || (body.parent===focus && (config.moons||flyby?.shot.follow===body)) : !body.parent;
      body.root.visible=visible && (!body.comet||config.comets);
      if (!body.root.visible) { body.label.hidden=true; continue; }
      const world=positions.get(body);
      const relative=body.parent ? world.clone().sub(positions.get(body.parent)) : null;
      let pos=new T.Vector3();
      let size=body===focus ? (body.comet?.14:1) : body.parent ?
        Math.max(.075,body.radius/body.parent.radius)*config.moonSize : body.display*config.size;
      if (comparisonBody) {
        size=comparisonBody.radius;
        pos.x=comparisonBody.x;
      } else if (observer) {
        const offset=world.clone().sub(observerEye);
        const distance=offset.length();
        const depth=25+Math.log1p(distance/100)*5;
        pos=offset.multiplyScalar(depth/distance);
        size=body.comet ? depth*.00065 : depth*body.radius/distance;
      } else if (relative) {
        pos=relative.clone().divideScalar(body.parent.radius);
      } else if (body!==focus && body!==sun) {
        pos=world.clone().divideScalar(auKm);
      }
      body.root.position.copy(pos);
      if (body.comet) updateCometTails(body,world.clone().divideScalar(auKm),focus===body && !observer ? 4.5 :
        observer ? Math.min(1.8,pos.length()*.055) : 2.1);
      body.mesh.scale.setScalar(size);
      body.visualRadius=size;
      if (body.parent && body.name !== 'Nereid') {
        // Keep the model's +X meridian oriented toward the host.
        body.axis.quaternion.setFromUnitVectors(xAxis,relative.clone().negate().normalize());
        body.mesh.rotation.y=0;
        if (body.name === 'Moon') setAxis(body,date);
      } else {
        body.mesh.rotation.y=body.spin ? ((time-epoch)/day/body.spin % 1)*tau : 0;
        setAxis(body,date);
      }
      if (body.rings) {
        body.rings.visible=config.rings && !comparing;
        body.rings.scale.setScalar(size);
        if (body.fallbackRings) {
          const mapped=Boolean(config.textures && saturnMap);
          const ring=body.rings.children[0];
          ring.visible=mapped;
          body.fallbackRings.visible=!mapped;
          if (mapped && ring.material.map!==saturnMap) {
            ring.material.map=saturnMap;
            ring.material.color.set('#ffffff');
            ring.material.needsUpdate=true;
          }
        }
      }
      loadMap(body);
      if (config.highResolution && focus===body && (config.zoom>=2 || flyby) &&
          !['venus_atmosphere','uranus','neptune'].includes(body.map)) loadMap(body,true);
      const map = config.textures ?
        (config.highResolution && focus===body && body.detail?.isTexture ? body.detail : body.overview?.isTexture ? body.overview : null) : null;
      if (body.material.map!==map) {
        body.material.map=map;
        body.material.needsUpdate=true;
      }
      body.material.color.set(map?'#ffffff':body.color);
      pickList.push(body.mesh);
    }
    const direction=focus && focus!==sun ? positions.get(focus).clone().negate().normalize() : new T.Vector3(.55,.6,1);
    light.position.copy(direction).multiplyScalar(500);
    light.visible=Boolean(comparing || (focus && focus!==sun));
    sunlight.visible=!focus && !view;
    updateLighting(positions,comparing);
    earthClouds.visible=config.earthClouds && !comparing;
    earthClouds.material.uniforms.drift.value=((time-epoch)/day*.145)%tau;
    earthAtmosphere.visible=config.earthAtmosphere && !comparing;
  }
  function updateCamera(delta) {
    if (specialCamera()) {
      camera.updateProjectionMatrix();
      camera.updateMatrixWorld();
      return;
    }
    perspective.fov=44;
    perspective.up.copy(yAxis);
    const satellites=focus ? moons.filter(body=>body.parent===focus) : [];
    const outer=focus && config.moons ? Math.max(0,...satellites.filter(body=>body.name!=='Nereid').map(body=>body.a*(1+body.e)/focus.radius)) : 0;
    const targetExtent=focus ? Math.max(4,outer*1.18) : overviewExtent;
    extent=T.MathUtils.damp(extent,targetExtent,7,delta);
    if ((config.orbit || ambientActive) && config.mode==='3d' && !drag) yaw+=delta*(config.orbit ? config.orbitSpeed : .65)*rad;
    const aspect=width/height;
    const fit=extent/config.zoom;
    const halfHeight=fit/Math.min(1,aspect);
    const target=pan.clone().add(cameraAnchor?.root.position ?? new T.Vector3());
    if (config.mode==='2d') {
      camera=flat;
      flat.left=-halfHeight*aspect;
      flat.right=halfHeight*aspect;
      flat.top=halfHeight;
      flat.bottom=-halfHeight;
      flat.up.set(0,0,-1);
      flat.position.copy(target).addScaledVector(yAxis,halfHeight*2+(focus ? 500 : 50));
    } else {
      camera=perspective;
      perspective.aspect=aspect;
      const tilt=(manualTilt??config.tilt)*rad;
      const anchorRadius=cameraAnchor?.visualRadius ?? (focus ? 1 : 0);
      const distance=Math.max(anchorRadius*1.06,.01,halfHeight/Math.tan(perspective.fov*rad/2));
      perspective.position.copy(target).add(new T.Vector3(
        Math.sin(yaw)*Math.cos(tilt),Math.sin(tilt),Math.cos(yaw)*Math.cos(tilt)
      ).multiplyScalar(distance));
    }
    camera.lookAt(target);
    camera.updateProjectionMatrix();
    camera.updateMatrixWorld();
  }
  function screenPoint(vector) {
    const p=vector.clone().project(camera);
    return {x:(p.x+1)*width/2,y:(1-p.y)*height/2, visible:p.z>=-1&&p.z<=1&&Math.abs(p.x)<1.05&&Math.abs(p.y)<1.05};
  }
  const viewRight=new T.Vector3();
  function updateLabels() {
    projected.clear();
    const visible=bodies.filter(body=>body.root.visible);
    const selected=pinned||hovered;
    const lookTarget=view==='observer' ? byName.get($('observer-target').value) : null;
    const priority=body=>body===selected ? 100 : body===focus||body===lookTarget ? 50 : body.parent ? 0 : 25;
    visible.sort((a,b)=>priority(b)-priority(a));
    const used=[];
    viewRight.copy(xAxis).applyQuaternion(camera.quaternion);
    for (const body of visible) {
      const point=screenPoint(body.root.position);
      const edge=screenPoint(body.root.position.clone().addScaledVector(viewRight,body.visualRadius));
      point.radius=Math.abs(edge.x-point.x);
      const inDetail=point.visible && point.radius>(body.mesh.geometry===detailSphere ? 70 : 95);
      body.mesh.geometry=body===rosettaComet ? nucleus67P : config.smartLabels && inDetail ? detailSphere : sphere;
      projected.set(body,point);
      const inComparison=view==='compare';
      const labelWidth=body.name.length*6.3+6;
      const x=Math.round(inComparison ?
        T.MathUtils.clamp(point.x-labelWidth/2,0,Math.max(0,width-labelWidth)) : point.x+point.radius+5);
      let y=Math.round(inComparison ? point.y+point.radius+6 : point.y-8);
      const collides=top=>used.some(other=>x<other.right && x+labelWidth>other.left &&
        top<other.bottom && top+16>other.top);
      if (inComparison && collides(y)) y+=17;
      const overlap=collides(y);
      const rect={left:x,top:y,right:x+labelWidth,bottom:y+16};
      const moonOpacity=body.parent && !view ?
        T.MathUtils.smoothstep(Math.max(config.zoom,point.radius/4),.75,2.25) : 1;
      const opacity=(config.smartLabels && body!==selected ? moonOpacity : 1)*(flyby ? .38 : 1);
      const show=config.labels && point.visible && opacity>.01 &&
        (!config.smartLabels || (!overlap && rect.left<width && (body===selected||rect.right<width+3)));
      if (show) used.push(rect);
      body.label.hidden=!show;
      if (show) {
        body.label.style.setProperty('--label-opacity',opacity.toFixed(3));
        body.label.style.transform='translate('+x+'px,'+y+'px)';
      }
    }
  }
  function pick(x,y) {
    ray.setFromCamera(new T.Vector2(x/width*2-1,1-y/height*2),camera);
    const hit=ray.intersectObjects(pickList)[0]?.object.userData.body;
    if (hit) return hit;
    let closest=null;
    let distance=14;
    for (const [body,p] of projected) {
      const d=Math.hypot(p.x-x,p.y-y);
      if (p.visible && d<distance) { closest=body; distance=d; }
    }
    return closest;
  }
  const card=$('card');
  const path=$('leader').querySelector('path');
  function cardText(tag,text) {
    const node=document.createElement(tag);
    node.textContent=text;
    card.append(node);
    return node;
  }
  function renderCard() {
    const body=pinned||hovered;
    const point=projected.get(body);
    card.hidden=Boolean(view) || !body || (body.parent && !config.moons) || (!point?.visible && !pinned);
    path.setAttribute('d','');
    if (card.hidden) { cardBody=null; return; }
    const state=body.material.map?'mapped':!config.textures?'disabled':body.overview==='unavailable'?'unavailable':'plain';
    const signature=body.name+'|'+Boolean(pinned)+'|'+state+'|'+(focus?.name ?? '');
    if (cardBody!==signature) {
      cardBody=signature;
      card.replaceChildren();
      card.classList.toggle('pinned',Boolean(pinned));
      cardText('h2',body.name);
      cardText('p',body.parent?'Moon of '+body.parent.name:body===sun?'G2-type star':body.kind ?? 'Planet');
      if (body.radius) cardText('p','Mean radius · '+body.radius.toLocaleString('en')+' km');
      if (body.diameterEstimate) cardText('p','Estimated diameter · '+body.diameterEstimate+' (albedo-dependent)');
      if (body.reference) {
        const source=cardText('a',body===pluto ? 'NASA Pluto facts' : body.comet ? 'JPL orbit data' : 'Discovery paper and orbit');
        source.href=body.reference;
        source.target='_blank';
        source.rel='noopener noreferrer';
      }
      if (body.period && body!==neowise) cardText('p','Orbital period · '+body.period.toLocaleString('en')+' days');
      if (body.spin) cardText('p','Rotation · '+Math.abs(body.spin).toLocaleString('en')+' days'+(body.parent && body.name!=='Nereid'?' · synchronous':body.spin<0||body.tilt>90?' · retrograde':''));
      if (!body.parent && Number.isFinite(body.tilt)) cardText('p','Axial tilt · '+body.tilt+'°');
      if (body!==sun) cardText('p','Orbit · '+((body.parent ? moonEphemeris(body) : astro && !body.orbit)?'Astronomy Engine':'approximate Keplerian model'));
      if (body.comet) cardText('p','Nucleus and tails are illustrative.');
      if (body===ed138) cardText('p','Display size and surface are illustrative.');
      if (point && body.parent) cardText('p','Moon size is enlarged where needed for selection.');
      if (state==='mapped') {
        const credit=cardText('a',body.externalMap?'Texture · JPL / Caltech / USGS':'Texture · Solar System Scope (CC BY 4.0)');
        credit.href=body.externalMap?'https://space.jpl.nasa.gov/tmaps/jupiter.html':textureSource;
        credit.target='_blank';
        credit.rel='noopener noreferrer';
      } else cardText('p',state==='unavailable'?'Texture unavailable · approximate appearance':state==='disabled'?'Textures disabled':'Approximate appearance');
      if (pinned) {
        if (!focus || (body.parent||body)!==focus) cardText('button','Focus').onclick=()=>{ changeFocus(body,false); config.zoom=1; updateControls(); };
        cardText('button','Close').onclick=()=>{ pinned=null; hovered=null; $('inspect').value=''; };
      } else cardText('p','Click or tap to pin');
    }
    const right=point?.visible && point.x+card.offsetWidth+34<width;
    const pad=12;
    const x=point?.visible ? T.MathUtils.clamp(point.x+(right?28:-card.offsetWidth-28),pad,Math.max(pad,width-card.offsetWidth-pad)) : pad;
    const y=point?.visible ? T.MathUtils.clamp(point.y-40,50,Math.max(50,height-card.offsetHeight-76)) : 52;
    card.style.left=x+'px';
    card.style.top=y+'px';
    if (point?.visible) {
      const end=x+(right?0:card.offsetWidth);
      const endY=y+Math.min(42,card.offsetHeight/2);
      path.setAttribute('d','M '+point.x+' '+point.y+' L '+end+' '+endY);
    }
  }

  let drag=null;
  let pointer=null;
  canvas.addEventListener('pointerdown',event=>{
    if (drag || event.button!==0) return;
    drag={id:event.pointerId,x:event.clientX,y:event.clientY,startX:event.clientX,startY:event.clientY,moved:false};
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener('pointermove',event=>{
    if (event.pointerType!=='touch') pointer={x:event.clientX,y:event.clientY};
    if (!drag || drag.id!==event.pointerId) return;
    drag.moved ||= Math.hypot(event.clientX-drag.startX,event.clientY-drag.startY)>5;
    if (!drag.moved) return;
    const dx=event.clientX-drag.x, dy=event.clientY-drag.y;
    if (view==='compare') {
      const scale=(flat.top-flat.bottom)/height;
      comparisonCenter.x-=dx*scale;
      comparisonCenter.y+=dy*scale;
    } else if (view==='observer') {
      observerYaw-=dx*observerFov*rad/height;
      observerPitch=T.MathUtils.clamp(observerPitch+dy*observerFov*rad/height,-1.48,1.48);
    } else if (config.mode==='3d') {
      yaw-=dx*.006;
      manualTilt=T.MathUtils.clamp((manualTilt??config.tilt)+dy*.25,-85,89);
    } else {
      const scale=(flat.top-flat.bottom)/height;
      pan.add(new T.Vector3(-dx*scale,0,-dy*scale));
    }
    drag.x=event.clientX;
    drag.y=event.clientY;
  });
  canvas.addEventListener('pointerup',event=>{
    if (drag?.id!==event.pointerId) return;
    if (!drag.moved && !view) {
      const hit=pick(event.clientX,event.clientY);
      pinned=hit===pinned?null:hit;
      $('inspect').value=pinned?.name||'';
      hovered=null;
    }
    drag=null;
  });
  canvas.addEventListener('pointercancel',event=>{ if (drag?.id===event.pointerId) drag=null; });
  canvas.addEventListener('pointerleave',()=>{pointer=null;hovered=null;});
  const zoomPlane=new T.Plane();
  const pointerNdc=new T.Vector2();
  function cursorOnPlane() {
    ray.setFromCamera(pointerNdc,camera);
    return ray.ray.intersectPlane(zoomPlane,new T.Vector3());
  }
  canvas.addEventListener('wheel',event=>{
    event.preventDefault();
    if (!camera) return;
    const scroll=event.deltaY*(event.deltaMode===1 ? 16 : event.deltaMode===2 ? height : 1);
    const factor=Math.exp(-scroll*.001);
    if (view==='compare') {
      const zoom=T.MathUtils.clamp(comparisonZoom*factor,1,maxZoom);
      const halfHeight=comparisonHalfHeight();
      const shift=(1-comparisonZoom/zoom)*halfHeight;
      comparisonCenter.x+=(2*event.clientX-width)/height*shift;
      comparisonCenter.y+=(1-2*event.clientY/height)*shift;
      comparisonZoom=zoom;
      return;
    }
    if (view==='observer') {
      observerFov=T.MathUtils.clamp(observerFov/factor,.25,78);
      return;
    }
    const previousZoom=config.zoom;
    const zoom=T.MathUtils.clamp(previousZoom*factor,.6,maxZoom);
    if (previousZoom===zoom) return;
    let before=null;
    const hit=config.cursorZoom && factor>1 ? pick(event.clientX,event.clientY) : null;
    if (config.cursorZoom) {
      pointerNdc.set(event.clientX/width*2-1,1-event.clientY/height*2);
      const center=cameraAnchor?.root.position.clone() ?? new T.Vector3();
      zoomPlane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(new T.Vector3()),hit?.root.position ?? center.add(pan));
      before=cursorOnPlane();
    }
    config.zoom=zoom;
    if (hit && hit!==cameraAnchor && zoom>=3) {
      if (!focus && hit.parent===undefined && hit!==sun && config.mode==='3d') {
        changeFocus(hit,false);
        extent=Math.max(4,...(satellitesByHost.get(hit) ?? []).filter(body=>body.name!=='Nereid')
          .map(body=>body.a*(1+body.e)/hit.radius*1.18));
        config.zoom=Math.min(maxZoom,Math.max(3,extent/1.7));
      }
      cameraAnchor=hit;
      pan.set(0,0,0);
    } else if (before) {
      updateCamera(0);
      const after=cursorOnPlane();
      if (after) pan.add(before.sub(after));
    }
    editor.sync();
  },{passive:false});
  window.addEventListener('keydown',event=>{
    if (event.key==='Escape' && !event.defaultPrevented && !$('solar-settings').contains(event.target)) {
      if (flyby) stopFlyby();
      else if (view) activateView('');
      else { pinned=null; hovered=null; pointer=null; $('inspect').value=''; }
    }
  });

  let lastPositionTime=NaN;
  let positions;
  function frame(now) {
    const delta=Math.max(0,Math.min(.1,(now-last)/1000));
    last=now;
    updatePresentation(now,delta);
    if (!config.paused) {
      const speed=flyby ? T.MathUtils.clamp(config.speed,-.025,.025) : config.speed;
      time=T.MathUtils.clamp(time+delta*speed*day,minTime,maxTime);
    }
    if (time!==lastPositionTime) {
      positions=physicalPositions(time);
      lastPositionTime=time;
    }
    const date=new Date(time);
    updateBodies(date,positions);
    updatePaths();
    updateCamera(delta);
    updateDebris();
    const atmosphere=earthAtmosphere.material.uniforms;
    atmosphere.flatView.value=camera.isOrthographicCamera;
    camera.getWorldDirection(atmosphere.viewDirection.value).negate();
    stars.visible=config.stars && view!=='compare';
    stars.position.copy(camera.position);
    renderer.render(scene,camera);
    updateLabels();
    if (!drag && pointer && !pinned && !view && !flyby && !ambientActive) hovered=pick(pointer.x,pointer.y);
    else if (flyby || ambientActive) hovered=null;
    renderCard();
    if (now-lastClockUpdate>=clockInterval) updateClock(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
</body>
