t.vy+=(ty-t.py)*stiff*inv*dt;

t.vy*=drag;

function render(){const cam=config.camera,c=config.colors,fx=config.effects,at=config.atmosphere;const bg=rgb(c.backgroundColor);gl.bindFramebuffer(gl.FRAMEBUFFER,scene.fbo);gl.viewport(0,0,canvas.width,canvas.height);gl.enable(gl.DEPTH_TEST);gl.depthMask(true);gl.disable(gl.BLEND);gl.clearColor(...bg,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
let fov=2*Math.atan(height/(2*cam.perspective)),z=cam.perspective/cam.zoom;
let projection=cam.mode==='orthographic'?ortho(-width/2/cam.zoom,width/2/cam.zoom,-height/2/cam.zoom,height/2/cam.zoom,-2000,2000):perspective(fov,width/height,1,4000);
let vx=rad(cam.tiltX)+(cam.autoOrbit?Math.sin(clock*cam.orbitSpeed)*.09:0),vy=rad(cam.tiltY)+(cam.autoOrbit?Math.cos(clock*cam.orbitSpeed)*.09:0);
let view=viewMatrix(vx,vy,z);
const n=tiles.length,arrays=Array.from({length:4},()=>new Float32Array(n*4));let i=0;
for(const t of tiles){const a=i*4,x=t.x+t.px,y=t.y+t.py,z0=t.pz+Math.sin(clock*.4+t.phase)*config.tiles.personality*4;
const tilt=rad(config.physics.rotation)*Math.pow(clamp(1-Math.hypot(t.x-pointer.x,t.y-pointer.y)/config.physics.radius,0,1),2)*(pointer.active?1:0);
const rot=rad(config.motion.rotation)*Math.sin(clock*config.motion.speed+t.phase)*config.motion.separation;
arrays[0].set([x,y,z0,t.size*config.tiles.size],a);
arrays[1].set([rot*Math.cos(t.axis)+tilt*.3,rot*Math.sin(t.axis)+tilt*.3,rot+tilt,t.phase],a);
const color=sampleColor(t.x,t.y,z0);

arrays[3].set([t.hero,t.mass,t.phase,t.colorShift],a);

}
refreshGeometry();
gl.useProgram(prog);
gl.bindVertexArray(vao);
for(let j=0;j<4;j++){gl.bindBuffer(gl.ARRAY_BUFFER,instanceBuffers[j]);gl.bufferData(gl.ARRAY_BUFFER,arrays[j],gl.DYNAMIC_DRAW);}
mat(prog,'uProjection',projection);
mat(prog,'uView',view);
u3(prog,'uEye',[0,0,z]);
u3(prog,'uLight',[config.lighting.directionX,config.lighting.directionY,config.lighting.directionZ]);
u3(prog,'uHighlight',rgb(c.highlightColor));
u3(prog,'uBackColor',rgb(c.colorC));
u4(prog,'uMaterial',[config.materials.metallic,config.materials.roughness,config.materials.glass,config.materials.iridescence]);
u4(prog,'uLightParams',[config.lighting.intensity,config.lighting.ambient,config.lighting.specular,config.lighting.glintStrength]);
u4(prog,'uEffects',[config.materials.fresnel,config.materials.environment,config.tiles.edgeOpacity,1]);
u4(prog,'uFlags',[+fx.hologram,+fx.mirrorUndersides,+fx.scan,+config.lighting.glints]);
u1(prog,'uTime',clock);
u1(prog,'uOpacity',config.tiles.opacity);
u1(prog,'uEdgeWidth',config.tiles.edgeWidth);
u1(prog,'uBevel',config.tiles.bevel);
u1(prog,'uThickness',config.tiles.thickness);
u1(prog,'uMorph',config.tiles.morph);
u1(prog,'uShape',config.tiles.shape==='square'?0:config.tiles.shape==='hexagon'?.25:.75);
u1(prog,'uHero',config.tiles.heroScale);
u1(prog,'uBackContrast',config.materials.backContrast);
u1(prog,'uScanSpeed',config.effects.scanSpeed);
u1(prog,'uMaterialType',['satin','metal','glass','ceramic','iridescent'].indexOf(config.materials.type));
gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.drawArraysInstanced(gl.TRIANGLES,0,count,n);gl.bindVertexArray(null);
// A compact point layer for atmospheric dust and optional energy connections.
if((at.dust&&at.enabled)||fx.connections||fx.lightTrails){const lines=[];if(at.dust&&at.enabled)for(const d of dust){let x=d.x+Math.sin(clock*.15+d.phase)*12,y=d.y+Math.cos(clock*.2+d.phase)*12;lines.push(x,y,d.z,x+.65,y+.65,d.z);}if(fx.connections){let step=config.tiles.size+config.tiles.spacing;for(let k=0;k<tiles.length;k++){const t=tiles[k];if(k%3)continue;const neighbor=tiles[k+1];if(neighbor&&Math.hypot(t.x-neighbor.x,t.y-neighbor.y)<step*fx.connectionDistance)lines.push(t.x+t.px,t.y+t.py,t.pz,neighbor.x+neighbor.px,neighbor.y+neighbor.py,neighbor.pz);}}
if(lines.length){drawLines(new Float32Array(lines),projection,view,at.dustOpacity);}}
gl.bindFramebuffer(gl.FRAMEBUFFER,null);
gl.disable(gl.DEPTH_TEST);
gl.disable(gl.BLEND);
gl.viewport(0,0,canvas.width,canvas.height);
gl.useProgram(postProg);
gl.activeTexture(gl.TEXTURE0);
gl.bindTexture(gl.TEXTURE_2D,scene.tex);
gl.uniform1i(loc(postProg,'tex'),0);
u2(postProg,'resolution',canvas.width,canvas.height);
u4(postProg,'post',[at.enabled&&at.bloom?at.bloomStrength:0,at.bloomThreshold,at.enabled?at.vignette:0,at.enabled?at.grain:0]);
u4(postProg,'post2',[+(at.enabled&&at.chromaticAberration),at.aberration,+(at.enabled&&at.depthOfField),at.dofStrength]);
u1(postProg,'time',clock);
u2(postProg,'extra',at.enabled?at.haze:0,0);
u3(postProg,'background',bg);
gl.drawArrays(gl.TRIANGLES,0,3);
}
const lineProg=program(`#version 300 es\nprecision highp float;layout(location=0)in vec3 pos;uniform mat4 projection,view;void main(){gl_Position=projection*view*vec4(pos,1.);}`,`#version 300 es\nprecision highp float;uniform vec4 color;out vec4 frag;void main(){frag=color;}`),lineVao=gl.createVertexArray(),lineBuffer=gl.createBuffer();gl.bindVertexArray(lineVao);gl.bindBuffer(gl.ARRAY_BUFFER,lineBuffer);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);gl.bindVertexArray(null);
function drawLines(arr,projection,view,opacity){gl.useProgram(lineProg);gl.bindVertexArray(lineVao);gl.bindBuffer(gl.ARRAY_BUFFER,lineBuffer);gl.bufferData(gl.ARRAY_BUFFER,arr,gl.DYNAMIC_DRAW);mat(lineProg,'projection',projection);mat(lineProg,'view',view);u4(lineProg,'color',[.5,.8,1,opacity]);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);gl.drawArrays(gl.LINES,0,arr.length/3);gl.bindVertexArray(null);}
function tick(ms){requestAnimationFrame(tick);if(document.hidden)return;if(config.animation.maxFps&&ms-lastFrame<1000/config.animation.maxFps)return;const real=last?Math.min((ms-last)/1000,.05):0;last=ms;lastFrame=ms;const reduced=config.animation.respectReducedMotion&&matchMedia('(prefers-reduced-motion: reduce)').matches,dt=config.animation.paused||reduced?0:real*config.animation.speed;clock+=dt;update(dt);render();if(config.animation.adaptiveQuality&&config.animation.quality==='auto'&&real>0){frameTimes.push(real);if(frameTimes.length>=180){const avg=frameTimes.reduce((a,b)=>a+b,0)/frameTimes.length;frameTimes=[];if(avg>.028&&qualityScale>.6){qualityScale=Math.max(.6,qualityScale-.1);resize();}else if(avg<.015&&qualityScale<1){qualityScale=Math.min(1,qualityScale+.1);resize();}}}}
function position(e){
 const r=canvas.getBoundingClientRect(),sx=(e.clientX-r.left)/r.width,sy=(e.clientY-r.top)/r.height;
 const cam=config.camera,zoom=clamp(cam.zoom,cam.minZoom,cam.maxZoom),dist=cam.perspective/zoom;
 const ax=rad(cam.tiltX)+(cam.autoOrbit?Math.sin(clock*cam.orbitSpeed)*.09:0);
 const ay=rad(cam.tiltY)+(cam.autoOrbit?Math.cos(clock*cam.orbitSpeed)*.09:0);
 const x=(sx-.5)*width/zoom,y=(.5-sy)*height/zoom;
 const fov=2*Math.atan(height/(2*cam.perspective));
 const aspect=width/height;
 // Ray in camera coordinates: orthographic starts at the near plane;
 // perspective starts at the camera and passes through the pixel.
 const near=cam.mode==='orthographic'?[x,y,0]:[0,0,0];
 const dir=cam.mode==='orthographic'?[0,0,-1]:[(sx*2-1)*Math.tan(fov/2)*aspect,(1-sy*2)*Math.tan(fov/2),-1];
 // Invert view rotation using transpose of its orthonormal 3x3 block.
 const v=viewMatrix(ax,ay,dist);
 const rotate=p=>[v[0]*p[0]+v[1]*p[1]+v[2]*p[2],v[4]*p[0]+v[5]*p[1]+v[6]*p[2],v[8]*p[0]+v[9]*p[1]+v[10]*p[2]];

 const direction=rotate(dir);
 if(Math.abs(direction[2])<1e-7)return {x:0,y:0};

 return {x:origin[0]+direction[0]*t,y:origin[1]+direction[1]*t};
}
canvas.addEventListener('pointermove',e=>{const p=position(e);pointer.dragX=p.x-pointer.tx;pointer.dragY=p.y-pointer.ty;pointer.tx=p.x;pointer.ty=p.y;pointer.active=true;});
canvas.addEventListener('pointerenter',()=>pointer.active=true);
canvas.addEventListener('pointerleave',()=>{pointer.active=false;pointer.down=false;});
canvas.addEventListener('pointerdown',e=>{const p=position(e);pointer.tx=pointer.x=p.x;pointer.ty=pointer.y=p.y;pointer.down=true;pointer.active=true;if(config.physics.shockwaves)wave(p.x,p.y);canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointerup',()=>pointer.down=false);
canvas.addEventListener('pointercancel',()=>pointer.down=false);
canvas.addEventListener('wheel',e=>{if(!config.camera.wheelZoom)return;e.preventDefault();config.camera.zoom=clamp(config.camera.zoom*Math.exp(-e.deltaY*.001),config.camera.minZoom,config.camera.maxZoom);},{passive:false});
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{last=0;lastFrame=0;});

const meshKeys=['tiles.size','tiles.spacing','tiles.sizeVariation','tiles.heroChance','tiles.heroScale','atmosphere.dustCount'];let meshSnapshot='';
let sizeSnapshot='';
function changed(){const qualityKey=[config.animation.quality,config.animation.maxDpr].join('|');if(sizeSnapshot!==qualityKey){sizeSnapshot=qualityKey;resize();}const key=meshKeys.map(p=>p.split('.').reduce((v,k)=>v[k],config)).join('|');if(key!==meshSnapshot){meshSnapshot=key;rebuild();}config.camera.zoom=clamp(config.camera.zoom,config.camera.minZoom,config.camera.maxZoom);}
function reset(){rebuild();waves=[];}
function preset(name){const patches={classic:{camera:{mode:'orthographic',depth:0,tiltX:0,tiltY:0},tiles:{thickness:1,morph:0},materials:{type:'satin',iridescence:0,glass:0},atmosphere:{bloom:false,dust:false}},cinematic:{camera:{mode:'perspective',depth:45,tiltX:8,tiltY:-7},tiles:{thickness:7,morph:.12},materials:{type:'iridescent',iridescence:.8},atmosphere:{bloom:true,dust:true}},chaos:{motion:{mode:'explosion',explode:true,explodeStrength:140},physics:{vortex:true,gravityWells:true},effects:{fractures:true,scan:true,connections:true}},portal:{effects:{portal:true,scan:true,hologram:true},camera:{tiltX:12,tiltY:9},motion:{mode:'vortex'}}};for(const [section,values] of Object.entries(defaults))Object.assign(config[section],structuredClone(values));for(const [section,values]of Object.entries(patches[name]||{}))Object.assign(config[section],values);changed();}
resize();changed();requestAnimationFrame(tick);
if(config.panel.enabled)import('./settings-editor.js?v=4').then(({createSettingsEditor})=>createSettingsEditor({config,defaults,onChange:changed,onReset:reset,onPreset:preset})).catch(e=>{notice.textContent='Settings editor: '+e.message;});
