      gl.useProgram(dustProgram);

      gl.uniformMatrix4fv(
        dustUniforms.uProjection,
        false,
        projectionMatrix
      );

      gl.uniformMatrix4fv(
        dustUniforms.uView,
        false,
        viewMatrix
      );

      gl.uniform1f(
        dustUniforms.uTime,
        simulationTime
      );

      gl.uniform1f(
        dustUniforms.uPointScale,
        5
      );

      gl.uniform3fv(
        dustUniforms.uColor,
        rgb(config.colors.highlightColor)
      );

      gl.uniform1f(
        dustUniforms.uOpacity,
        config.atmosphere.dustOpacity
      );

      gl.depthMask(false);

      gl.enable(gl.BLEND);

      gl.blendFunc(
        gl.SRC_ALPHA,
        gl.ONE
      );

      gl.bindVertexArray(dustVAO);

      gl.drawArrays(
        gl.POINTS,
        0,
        dustCount
      );

      gl.bindVertexArray(null);

      gl.disable(gl.BLEND);

      gl.depthMask(true);
    }

    // ============================================================
    // TILE RENDERING
    // ============================================================

    function renderTiles() {
      gl.useProgram(tileProgram);

      gl.uniformMatrix4fv(
        tileUniforms.uProjection,
        false,
        projectionMatrix
      );

      gl.uniformMatrix4fv(
        tileUniforms.uView,
        false,
        viewMatrix
      );

      gl.uniform1f(
        tileUniforms.uTime,
        simulationTime
      );

      gl.uniform1f(
        tileUniforms.uBevel,
        config.tiles.bevel
      );

      gl.uniform1f(
        tileUniforms.uThickness,
        config.tiles.thickness
      );

      gl.uniform1f(
        tileUniforms.uMorph,
        config.tiles.morph
      );

      const shapeValue =
        config.tiles.shape === "hexagon"
          ? 0.5
          : config.tiles.shape === "triangle"
            ? 1
            : 0;

      gl.uniform1f(
        tileUniforms.uShape,
        shapeValue
      );

      gl.uniform1f(
        tileUniforms.uHero,
        config.tiles.heroScale
      );

      gl.uniform3fv(
        tileUniforms.uEye,
        cameraEye
      );

      gl.uniform3fv(
        tileUniforms.uLight,
        normalize3(
          config.lighting.directionX,
          config.lighting.directionY,
          config.lighting.directionZ
        )
      );

      gl.uniform3fv(
        tileUniforms.uHighlight,
        rgb(config.colors.highlightColor)
      );

      gl.uniform3fv(
        tileUniforms.uBackColor,
        rgb(config.colors.colorB)
      );

      gl.uniform4f(
        tileUniforms.uMaterial,
        config.materials.metallic,
        config.materials.roughness,
        config.materials.glass,
        config.materials.iridescence
      );

      gl.uniform4f(
        tileUniforms.uLightParams,
        config.lighting.intensity,
        config.lighting.ambient,
        config.lighting.specular,
        config.lighting.glintStrength
      );

      gl.uniform4f(
        tileUniforms.uEffects,
        config.materials.fresnel,
        config.materials.environment,
        config.tiles.edgeOpacity,
        config.effects.scanSpeed
      );

      gl.uniform4f(
        tileUniforms.uFlags,
        config.effects.hologram ? 1 : 0,
        config.effects.mirrorUndersides ? 1 : 0,
        config.effects.scan ? 1 : 0,
        config.lighting.glints ? 1 : 0
      );

      gl.uniform1f(
        tileUniforms.uOpacity,
        config.tiles.opacity
      );

      gl.uniform1f(
        tileUniforms.uEdgeWidth,
        config.tiles.edgeWidth
      );

      gl.enable(gl.DEPTH_TEST);

      gl.depthFunc(gl.LEQUAL);

      gl.enable(gl.CULL_FACE);

      gl.cullFace(gl.BACK);

      gl.enable(gl.BLEND);

      gl.blendFunc(
        gl.SRC_ALPHA,
        gl.ONE_MINUS_SRC_ALPHA
      );

      gl.bindVertexArray(tileVAO);

      gl.drawElementsInstanced(
        gl.TRIANGLES,
        geometry.indices.length,
        gl.UNSIGNED_SHORT,
        0,
        tiles.length
      );

      gl.bindVertexArray(null);

      gl.disable(gl.BLEND);
      gl.disable(gl.CULL_FACE);
    }

    // ============================================================
    // SCENE RENDERING
    // ============================================================

    function renderScene() {
      gl.bindFramebuffer(
        gl.FRAMEBUFFER,
        sceneTarget.framebuffer
      );

      gl.viewport(
        0,
        0,
        sceneTarget.width,
        sceneTarget.height
      );

      const background = rgb(
        config.colors.backgroundColor
      );

      gl.clearColor(
        background[0],
        background[1],
        background[2],
        1
      );

      gl.clear(
        gl.COLOR_BUFFER_BIT |
        gl.DEPTH_BUFFER_BIT
      );

      renderTiles();
      renderDust();
    }

    // ============================================================
    // BLOOM RENDERING
    // ============================================================

    function renderBloom() {
      gl.bindFramebuffer(
        gl.FRAMEBUFFER,
        bloomTarget.framebuffer
      );

      gl.viewport(
        0,
        0,
        bloomTarget.width,
        bloomTarget.height
      );

      gl.disable(gl.DEPTH_TEST);
      gl.disable(gl.BLEND);

      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      if (
        !config.atmosphere.enabled ||
        !config.atmosphere.bloom
      ) {
        return;
      }

      gl.useProgram(bloomProgram);

      gl.activeTexture(gl.TEXTURE0);

      gl.bindTexture(
        gl.TEXTURE_2D,
        sceneTarget.texture
      );

      gl.uniform1i(
        bloomUniforms.uScene,
        0
      );

      gl.uniform2f(
        bloomUniforms.uResolution,
        sceneTarget.width,
        sceneTarget.height
      );

      gl.uniform1f(
        bloomUniforms.uThreshold,
        config.atmosphere.bloomThreshold
      );

      gl.uniform1f(
        bloomUniforms.uBlurRadius,
        2
      );

      gl.bindVertexArray(fullscreenVAO);

      gl.drawArrays(
        gl.TRIANGLES,
        0,
        3
      );

      gl.bindVertexArray(null);
    }

    // ============================================================
    // FINAL POST-PROCESSING COMPOSITE
    // ============================================================

    function renderComposite() {
      gl.bindFramebuffer(
        gl.FRAMEBUFFER,
        null
      );

      gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
      );

      gl.disable(gl.DEPTH_TEST);
      gl.disable(gl.BLEND);

      gl.useProgram(compositeProgram);

      gl.activeTexture(gl.TEXTURE0);

      gl.bindTexture(
        gl.TEXTURE_2D,
        sceneTarget.texture
      );

      gl.uniform1i(
        compositeUniforms.uScene,
        0
      );

      gl.activeTexture(gl.TEXTURE1);

      gl.bindTexture(
        gl.TEXTURE_2D,
        bloomTarget.texture
      );

      gl.uniform1i(
        compositeUniforms.uBloom,
        1
      );

      gl.uniform2f(
        compositeUniforms.uResolution,
        canvas.width,
        canvas.height
      );

      gl.uniform1f(
        compositeUniforms.uTime,
        simulationTime
      );

      gl.uniform1f(
        compositeUniforms.uBloomStrength,
        config.atmosphere.bloomStrength
      );

      gl.uniform1f(
        compositeUniforms.uVignette,
        config.atmosphere.enabled
          ? config.atmosphere.vignette
          : 0
      );

      gl.uniform1f(
        compositeUniforms.uGrain,
        config.atmosphere.enabled
          ? config.atmosphere.grain
          : 0
      );

      gl.uniform1f(
        compositeUniforms.uAberration,
        config.atmosphere.aberration
      );

      gl.uniform1f(
        compositeUniforms.uHaze,
        config.atmosphere.enabled
          ? config.atmosphere.haze
          : 0
      );

      gl.uniform1f(
        compositeUniforms.uDofStrength,
        config.atmosphere.dofStrength
      );

      gl.uniform3fv(
        compositeUniforms.uBackground,
        rgb(config.colors.backgroundColor)
      );

      gl.uniform4f(
        compositeUniforms.uFlags,
        config.atmosphere.enabled &&
        config.atmosphere.bloom ? 1 : 0,

        config.atmosphere.enabled &&
        config.atmosphere.chromaticAberration ? 1 : 0,

        config.atmosphere.enabled &&
        config.atmosphere.depthOfField ? 1 : 0,

        0
      );

      gl.bindVertexArray(fullscreenVAO);

      gl.drawArrays(
        gl.TRIANGLES,
        0,
        3
      );

      gl.bindVertexArray(null);
    }

    // ============================================================
    // MAIN RENDER FUNCTION
    // ============================================================

    function render() {
      renderScene();
      renderBloom();
      renderComposite();
    }

    // ============================================================
    // CONFIGURATION CHANGES
    // ============================================================

    function onConfigChange() {
      const desiredDpr = Math.min(
        window.devicePixelRatio || 1,
        config.animation.maxDpr
      );

      const desiredWidth = Math.max(
        1,
        Math.round(
          window.innerWidth * desiredDpr
        )
      );

      const desiredHeight = Math.max(
        1,
        Math.round(
          window.innerHeight * desiredDpr
        )
      );

      if (
        canvas.width !== desiredWidth ||
        canvas.height !== desiredHeight
      ) {
        resize();
        resizeRenderTargets();
      }

      if (
        dustCount !==
        Math.floor(config.atmosphere.dustCount)
      ) {
        buildDust();
      }

      refreshMesh();
      updateCamera();
    }

    function resetMosaic() {
      buildTiles();
      buildDust();

      shockwaves.length = 0;
      gravityWells.length = 0;
    }

    // ============================================================
    // VISUAL PRESETS
    // ============================================================

    const presets = {
      classic: {
        camera: {
          mode: "orthographic",
          tiltX: 0,
          tiltY: 0,
          depth: 0,
          zoom: 1
        },

        materials: {
          type: "satin",
          metallic: 0.05,
          roughness: 0.8,
          glass: 0,
          iridescence: 0
        },

        motion: {
          mode: "classic",
          drift: 15,
          separation: 0.65
        },

        atmosphere: {
          bloom: false,
          dust: false,
          depthOfField: false
        }
      },

      cinematic: {
        camera: {
          mode: "perspective",
          tiltX: 8,
          tiltY: -6,
          depth: 45,
          zoom: 1
        },

        materials: {
          type: "iridescent",
          metallic: 0.55,
          roughness: 0.25,
          glass: 0.35,
          iridescence: 0.8
        },

        motion: {
          mode: "wave",
          separation: 0.8
        },

        atmosphere: {
          bloom: true,
          bloomStrength: 0.85,
          dust: true,
          vignette: 0.3
        }
      },

      chaos: {
        camera: {
          mode: "perspective",
          tiltX: 14,
          tiltY: 10,
          depth: 75
        },

        motion: {
          mode: "explosion",
          explodeStrength: 180,
          separation: 1,
          rotation: 45
        },

        physics: {
          vortex: true,
          shockwaves: true,
          shockStrength: 120
        },

        effects: {
          fractures: true,
          connections: true
        }
      },

      portal: {
        camera: {
          mode: "perspective",
          tiltX: 0,
          tiltY: 0,
          depth: 80
        },

        motion: {
          mode: "vortex",
          separation: 0.9
        },

        effects: {
          portal: true,
          portalRadius: 220,
          portalStrength: 1,
          hologram: true
        },

        atmosphere: {
          bloom: true,
          bloomStrength: 1.1
        }
      }
    };

    function applyPreset(name) {
      const preset = presets[name];

      if (!preset) {
        return;
      }

      // Restore defaults first so presets do not
      // inherit unrelated effects from one another.
      for (
        const [groupName, values] of
        Object.entries(defaults)
      ) {
        if (!config[groupName]) {
          continue;
        }

        for (
          const [key, value] of
          Object.entries(values)
        ) {
          config[groupName][key] =
            structuredClone(value);
        }
      }

      // Apply the selected preset.
      for (
        const [groupName, values] of
        Object.entries(preset)
      ) {
        if (!config[groupName]) {
          continue;
        }

        Object.assign(
          config[groupName],
          values
        );
      }

      onConfigChange();
      resetMosaic();
    }

    // ============================================================
    // ANIMATION LOOP
    // ============================================================

    let lastRenderedTime = 0;

    function animate(timestamp) {
      requestAnimationFrame(animate);

      const now = timestamp * 0.001;

      if (previousTime === null) {
        previousTime = now;
      }

      const rawDt = clamp(
        now - previousTime,
        0,
        0.05
      );

      previousTime = now;

      const maxFps = Math.max(
        1,
        config.animation.maxFps
      );

      const frameInterval =
        1 / maxFps;

      if (
        now - lastRenderedTime <
        frameInterval
      ) {
        return;
      }

      lastRenderedTime = now;

      const reducedMotion =
        config.animation.respectReducedMotion &&
        window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;

      const paused =
        config.animation.paused ||
        reducedMotion;

      const dt = paused
        ? 0
        : rawDt *
          config.animation.speed;

      if (!paused) {
        simulationTime += dt;

        updatePointerSmoothing(dt);
        updateShockwaves(dt);
        updateGravityWells(dt);
      }

      refreshMesh();

      // IMPORTANT:
      // Update camera BEFORE calculating physics.
      // Mouse raycasting and rendering now use
      // exactly the same view/projection matrices.
      updateCamera();

      updateInstanceData(dt);

      render();
    }

    // ============================================================
    // RESIZE HANDLING
    // ============================================================

    window.addEventListener(
      "resize",
      () => {
        resize();
        resizeRenderTargets();
        buildDust();
      }
    );

    // ============================================================
    // INITIALIZATION
    // ============================================================

    resize();
    resizeRenderTargets();
    buildDust();

    updateCamera();
    updateInstanceData(0);

    requestAnimationFrame(animate);

    // ============================================================
    // SETTINGS EDITOR
    // ============================================================

    if (config.panel.enabled) {
      import("./settings-editor.js")
        .then(({ createSettingsEditor }) => {
          createSettingsEditor({
            config,
            defaults,
            presets,
            onChange: onConfigChange,
            onReset: resetMosaic,
            onPreset: applyPreset
          });
        })
        .catch(error => {
          console.error(
            "Settings editor could not load:",
            error
          );
        });
    }

  </script>
</body>
